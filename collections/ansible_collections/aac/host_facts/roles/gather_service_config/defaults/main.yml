---
# Default variables for gather_service_config role

# Services that should be disabled (CIS 2.x)
unnecessary_services:
  - autofs              # 1.1.23 - Automounter
  - avahi-daemon        # 2.2.2 - Avahi Server
  - cups                # 2.1.2 - CUPS
  - dhcpd               # 2.2.5 - DHCP Server
  - slapd               # 2.2.7 - LDAP server
  - nfs-server          # 2.2.8 - NFS
  - rpcbind             # 2.2.9 - RPC
  - bind                # 2.2.10 - DNS Server
  - vsftpd              # 2.2.11 - FTP Server
  - httpd               # 2.2.12 - HTTP server
  - dovecot             # 2.2.13 - IMAP/POP3 server
  - smb                 # 2.2.14 - Samba
  - squid               # 2.2.15 - HTTP Proxy
  - snmpd               # 2.2.16 - SNMP Server
  - ypserv              # 2.2.17 - NIS Server
  - rsh.socket          # 2.3.1 - RSH server
  - rlogin.socket       # 2.3.2 - rlogin server
  - rexec.socket        # 2.3.3 - rexec server
  - telnet.socket       # 2.3.4 - telnet server
  - tftp.socket         # 2.3.5 - TFTP server
  - rsyncd              # 2.2.18 - rsync server
  - postfix             # May need to be enabled for local mail (configurable)

# Services that should be enabled (CIS requirements)
required_services:
  - chronyd             # 2.1.1 - Time synchronization
  - systemd-journald    # Logging
  - rsyslog             # Logging (if used instead of journald)
  - auditd              # Auditing
  - firewalld           # Firewall

# Time synchronization services (only one should be active)
time_sync_services:
  - chronyd
  - ntpd
  - systemd-timesyncd

# Client services that should be removed/disabled
unnecessary_client_packages:
  - telnet              # 2.3.4 - Telnet client
  - rsh                 # 2.3.1-3 - RSH clients
  - talk                # Legacy messaging
  - ypbind              # NIS client
  - tftp                # TFTP client

# X11 packages (for server systems)
x11_packages:
  - xorg-x11-server-common
  - xorg-x11-server-Xorg
  - xorg-x11-server-Xwayland

# Mail Transfer Agent - acceptable values
acceptable_mta:
  - postfix             # Most common
  - sendmail            # Legacy
  - none                # No MTA (discouraged)

# Expected chrony configuration
chrony_config_file: /etc/chrony.conf
chrony_required_options:
  - server              # Must have time servers configured
  - pool                # OR pool directive

# NTP drift file
ntp_drift_file: /var/lib/chrony/drift
