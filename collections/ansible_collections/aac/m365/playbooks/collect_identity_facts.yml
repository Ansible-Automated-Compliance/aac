---
# Sample playbook: collect M365 identity facts and POST them to OPA
# for CIS evaluation.
#
# Prereq:
#   - An Azure AD app registration with these Graph API permissions
#     (Application, not Delegated):
#       Directory.Read.All
#       Policy.Read.All
#       RoleManagement.Read.Directory
#       UserAuthenticationMethod.Read.All
#     and admin consent granted in the tenant.
#   - The tenant id, client id, and client secret stored in
#     Ansible Vault (NOT in this file).
#
# Survey vars (or set via -e):
#   m365_tenant_id        — Entra tenant GUID
#   m365_client_id        — app registration client id
#   m365_client_secret    — app registration secret (vault)
#   opa_url               — OPA compliance container URL
#                           (default http://opa-compliance:8182 (override per topology))

- name: Collect M365 identity facts → evaluate against CIS via OPA
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - aac.m365

  vars:
    opa_url: "{{ opa_url | default('http://opa-compliance:8182') }}"

  tasks:

    - name: Collect identity state from Microsoft Graph
      aac.m365.m365_identity_facts:
        tenant_id: "{{ m365_tenant_id }}"
        client_id: "{{ m365_client_id }}"
        client_secret: >-
          {{ m365_client_secret }}
      register: identity

    - name: Evaluate CIS Section 1 controls in OPA
      ansible.builtin.uri:
        url: "{{ opa_url }}/v1/data/cis_m365/identity/compliance_report"
        method: POST
        body_format: json
        body:
          input: "{{ identity.facts }}"
        status_code: 200
      register: opa_response

    - name: Show summary
      ansible.builtin.debug:
        msg:
          - "CIS M365 Section 1 — Identity"
          - "Compliant: {{ opa_response.json.result.compliant }}"
          - "Violations: {{ opa_response.json.result.violation_count }}"
          - "Detail: {{ opa_response.json.result.violations }}"
