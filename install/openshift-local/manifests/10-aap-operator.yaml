---
# Ansible Automation Platform 2.7 operator on OpenShift Local (CRC).
# Apply once, as kubeadmin:  oc apply -f install/openshift-local/manifests/10-aap-operator.yaml
# Then wait for the ClusterServiceVersion to reach Succeeded before applying 20-aap.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: aap-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: aap-operator-og
  namespace: aap-operator
spec:
  targetNamespaces:
    - aap-operator
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ansible-automation-platform
  namespace: aap-operator
spec:
  name: ansible-automation-platform-operator
  channel: stable-2.7
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
