# PostgreSQL for AAC on OpenShift.
#
# This seeds only the database service and persistent volume. The AAC schema,
# compliance_reader role, and optional evidence-writer role are created later by
# the AAC initialization playbooks or job templates.
#

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compliance-db-data
  namespace: aac
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: compliance-db
  namespace: aac
  labels:
    app: compliance-db
spec:
  serviceName: compliance-db
  replicas: 1
  selector:
    matchLabels:
      app: compliance-db
  template:
    metadata:
      labels:
        app: compliance-db
    spec:
      imagePullSecrets:
        - name: redhat-registry-pull-secret
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: compliance-db
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U compliance -d compliance -h 127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U compliance -d compliance -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: compliance-db-data

---
apiVersion: v1
kind: Service
metadata:
  name: compliance-db
  namespace: aac
spec:
  selector:
    app: compliance-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
