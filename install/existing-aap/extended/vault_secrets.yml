---
# AAC vault_secrets.yml — SHIPPED PLACEHOLDER
#
# WHY THIS FILE IS COMMITTED
# --------------------------
# AAP 2.7's project-sync mechanism checks out the GitHub repo into the
# controller pod. Playbooks that `vars_files: vault_secrets.yml` fail at
# compile time if the file is missing, regardless of which tasks would
# actually consume the variables. Shipping a placeholder file unblocks
# `ansible-playbook` parse-time and lets each install supply real
# values via AAP inventory variables or extra_vars overlays.
#
# HOW REAL SECRETS GET SUPPLIED
# -----------------------------
# 1. AAP inventory variables on "Compliance Infrastructure" (default
#    for in-cluster installs — sets compliance_db_password, opa_*_url,
#    pg_host, etc.)
# 2. Per-template extra_vars (sensitive site overrides — vault_github_pat,
#    aws_*, vault_anthropic_api_key)
# 3. An Ansible Vault credential on the template, if the values below
#    are replaced with `!vault |` encrypted blocks for a specific install
#
# NEVER commit real credentials over the PLACEHOLDER values.
#
# ─────────────────────────────────────────────────────────────────────────────
# CATEGORY 1 — PERSONAL CREDENTIALS (always overridden per install)
# ─────────────────────────────────────────────────────────────────────────────

vault_redhat_username: PLACEHOLDER
vault_redhat_offline_token: PLACEHOLDER
vault_github_pat: PLACEHOLDER
vault_quay_username: PLACEHOLDER
vault_quay_password: PLACEHOLDER
vault_anthropic_api_key: PLACEHOLDER

# ─────────────────────────────────────────────────────────────────────────────
# CATEGORY 2 — LOCAL LAB AWS CREDENTIALS (always overridden per install)
# ─────────────────────────────────────────────────────────────────────────────

aws_lab_access_key: PLACEHOLDER
aws_lab_secret_key: PLACEHOLDER
aws_local_account_id: PLACEHOLDER
aws_local_account_name: PLACEHOLDER
aws_local_iam_user: PLACEHOLDER

# ─────────────────────────────────────────────────────────────────────────────
# CATEGORY 3 — RHPDS AWS CREDENTIALS (always overridden per cluster)
# ─────────────────────────────────────────────────────────────────────────────

aws_rhpds_access_key: PLACEHOLDER
aws_rhpds_secret_key: PLACEHOLDER
aws_rhpds_account_id: PLACEHOLDER
aws_rhpds_account_name: PLACEHOLDER
aws_rhpds_iam_user: PLACEHOLDER

# ─────────────────────────────────────────────────────────────────────────────
# CATEGORY 4 — AAP-INSTALL-SPECIFIC (always overridden per install)
# ─────────────────────────────────────────────────────────────────────────────

vault_aap_admin_password: PLACEHOLDER
vault_aap_mac_admin_password: PLACEHOLDER
vault_windows_admin_password: PLACEHOLDER
vault_aap_local_mcp_token: PLACEHOLDER
vault_aap_mac_mcp_token: PLACEHOLDER

# ─────────────────────────────────────────────────────────────────────────────
# CATEGORY 5 — IN-CLUSTER DEFAULTS (safe to ship; override only if site differs)
# These match the in-cluster AAC stack defaults from
# the lab manifests in aac-demos (`demos/lab-crc/mac-aap/manifests/20-postgres.yaml` + `40-grafana.yaml`).
# ─────────────────────────────────────────────────────────────────────────────

compliance_db_password: PLACEHOLDER
compliance_reader_password: PLACEHOLDER
grafana_admin_password: PLACEHOLDER

