# The following variables have been created to help you customize the 
# installation of the AAC Compliance Automation Platform (AAP) artifacts
# in AAP trying to avoid hardcoding the values in the playbooks specially 
# the values that are used multiple times.

# *** ONLY EDIT THE PLACEHOLDER VALUES ***

# AAC Global Variables
aac_organization: PLACEHOLDER
aac_host_ssh_user: PLACEHOLDER
aac_host_description: "Dedicated AAC stack — OPA, PostgreSQL, Grafana"

aac_template_deploy_opa_name: AAC_Deploy_OPA_Containers
aac_template_deploy_opa_description: "Deploy opa-security :8181, opa-compliance :8182, opa-ot :8183 on aac_host"

aac_template_init_postgres_name: AAC_Init_PostgreSQL_Database
aac_template_init_postgres_description: "Initialize compliance DB schema (container already on aac_host via quadlet)"
aac_postgres_container_name: aac-postgresql

aac_template_seed_framework_catalog_name: AAC_Seed_Framework_Catalog
aac_template_seed_framework_catalog_description: |
  Upsert framework_catalog and seed customer_frameworks from enabled_by_default.
  Required before AAC_Load_OPA_Policies with source=database (otherwise the loader falls back to baseline).
  Needs ansible/vars/site_config.yml on the project checkout.

aac_template_enroll_discovered_name: AAC_Enroll_Discovered_Frameworks
aac_template_enroll_discovered_description: |
  Additively enable bundles in customer_frameworks from discovered host/product signals.
  Run after hosts are inventoried and facts are in the database; then load with source=database.

aac_template_load_opa_name: AAC_Load_OPA_Policies
aac_template_load_opa_description: |
  Push Rego from the project checkout into opa-security :8181, opa-compliance :8182, opa-ot :8183.

  Launch survey — source (default: database):
  • database — tenant selection from customer_frameworks (run AAC_Seed_Framework_Catalog first; falls back to baseline).
  • all — every framework (lab/demo only; long run, high OPA memory).
  • baseline — framework_catalog enabled_by_default only.
  • file — ansible/vars/policy_selection.yml (copy from policy_selection.yml.example).
  • extra_vars — set survey frameworks_to_load (comma-separated loader_key values).

  Other playbook vars: reconcile (default true) prunes OPA IDs not in this run;
  allow_partial_load (default false) fails on any bundle error. See load_opa_policies.yml header.

aac_template_deploy_grafana_name: AAC_Deploy_Grafana_Dashboards
aac_template_deploy_grafana_description: |
  Provision Grafana on aac_host :3000 — PostgreSQL datasource + compliance dashboards.
  Does not start the Grafana container (quadlet/manual aac-grafana must already be running).
  Uses grafana_admin_* and compliance DB credentials from attached AAP credentials.
  Optional at launch: dashboard_file / dashboard_uid to deploy a single dashboard.

