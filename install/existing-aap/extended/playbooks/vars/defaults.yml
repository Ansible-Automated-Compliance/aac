# The following variables have been created to help you customize the 
# installation of the AAC Compliance Automation Platform (AAP) artifacts
# in AAP trying to avoid hardcoding the values in the playbooks specially 
# the values that are used multiple times.

# *** ONLY EDIT THE PLACEHOLDER VALUES ***

# AAC Global Variables
aac_organization: PLACEHOLDER
aac_host: "{{ controller_hostname | regex_replace('^https://', '') | regex_replace('/$', '') }}"

# Decision Environment
eda_de_name: AAC Default Decision Environment
aac_decision_environment: "{{ eda_de_name }}"
eda_de_description: Red Hat supported DE for AAC EDA rulebooks (CIS drift, Golden Image, Sentinel, NERC-CIP)
eda_de_image: registry.redhat.io/ansible-automation-platform-26/de-supported-rhel9:latest

# EDA Project
eda_project_name: AAC Vulnerability Reactor
eda_project_description: AAC Vulnerability Reactor

# AAP Project
aap_project_name: AAC Compliance Automation
aap_project_description: AAC Compliance Automation
aap_project_default_ee: Default Execution Environment

# Workflow Jobs
m365v7_name: AAC_CIS_M365v7_Complete_Workflow
m365v7_description: AAC CIS M365v7 Complete Workflow

cis_name: AAC_CIS_Complete_Workflow
cis_description: AAC CIS Complete Workflow

dummy_name: AAC_CIS_Dummy_Workflow
dummy_description: AAC CIS Dummy Workflow

# Inventory
aac_inventory_name: Compliance Infrastructure
aac_inventory_description: "Hosts for AAC compliance assessments and demo workloads"

# Credentials
aac_cred_github_pat_controller: AAC GitHub PAT (Source Control)
aac_cred_github_pat_eda: GitHub PAT (Source Control)
aac_cred_postgresql: AAC Postgresql
aac_cred_vault: AAC Vault
aac_cred_controller_token: Controller Token
aac_cred_redhat_registry: Red Hat Container Registry
aac_cred_quay: AAC Quay
aac_cred_grafana: AAC Grafana

