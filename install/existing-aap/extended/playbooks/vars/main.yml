# The following variables have been created to help you customize the 
# installation of the AAC Compliance Automation Platform (AAP), these
# are the global variables used during the entire installation process.

# *** ONLY EDIT THE PLACEHOLDER VALUES ***

# Connectivity
controller_hostname: PLACEHOLDER
controller_username: PLACEHOLDER
controller_verify_ssl: false
ah_host: "{{ controller_hostname }}"
ah_username: "{{ controller_username }}"
ah_validate_certs: "{{ controller_verify_ssl }}"
aap_controller_url: "https://{{ controller_hostname }}"
aap_gateway_url:    "https://{{ controller_hostname }}"

# Git configurations
github_username: PLACEHOLDER
git_repo_url: 'https://github.com/Ansible-Automated-Compliance/aac.git'
git_repo_branch: 'main'

# Postgres configurations
pg_user: PLACEHOLDER
pg_host: "{{ aac_host }}"
pg_port: "5432"
pg_db: PLACEHOLDER

# Other Credential usernames
redhat_username: PLACEHOLDER
quay_username: PLACEHOLDER
grafana_admin_user: PLACEHOLDER

