---

- name: Create Red Hat Console Credentials
  ansible.controller.credential:
    name: "{{ aac_cred_redhat_registry }}"
    description: AAC Red Hat Console
    credential_type: Red Hat Console
    organization: "{{ aac_organization }}"
    inputs:
      redhat_username: "{{ redhat_username }}"
      redhat_offline_token: "{{ redhat_offline_token }}"
