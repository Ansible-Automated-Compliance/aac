---

- name: Create Postgresql Credentials
  ansible.controller.credential:
    name: "{{ aac_cred_postgresql }}"
    description: AAC Postgresql
    credential_type: Postgresql
    organization: "{{ aac_organization }}"
    inputs:
      pg_password: "{{ pg_password }}"
      pg_user: "{{ pg_user }}"
      pg_host: "{{ pg_host }}"
      pg_port: "{{ pg_port }}"
      pg_db: "{{ pg_db }}"
