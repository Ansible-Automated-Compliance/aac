---

- name: Create GitHub PAT for AAC compliance repo (Source Control)
  ansible.controller.credential:
    name: "{{ aac_cred_github_pat_controller }}"
    description: GitHub PAT for AAC compliance repo (Source Control)
    credential_type: Source Control
    organization: "{{ aac_organization }}"
    inputs:
      username: "{{ github_username }}"
      password: "{{ github_pat }}"
