---

- name: Create AAC host Machine (SSH) credential
  ansible.controller.credential:
    name: "{{ aac_cred_aac_host_ssh }}"
    description: SSH to the dedicated AAC host as {{ aac_host_ssh_user }} (podman, OPA deploy)
    credential_type: Machine
    organization: "{{ aac_organization }}"
    inputs:
      username: "{{ aac_host_ssh_user }}"
      ssh_key_data: "{{ aac_host_ssh_private_key }}"
      become_method: sudo
  no_log: true
