---

- name: CIS M365 v7 Complete Workflow
  ansible.controller.workflow_job_template:
    name: "{{ m365v7_name }}"
    description: "{{ m365v7_description }}"
    organization: "{{ aac_organization }}"
    state: present
    extra_vars:
      aac_caa_enabled: false
      opa_security_url: http://{{ aac_host }}:8181

- name: Collect
  ansible.controller.workflow_job_template_node:
    identifier: "Collect Facts"
    workflow: "{{ m365v7_name }}"
    unified_job_template: AAC_Collect_Facts
    organization: "{{ aac_organization }}"
    all_parents_must_converge: false

- name: Report
  ansible.controller.workflow_job_template_node:
    identifier: "Report"
    workflow: "{{ m365v7_name }}"
    unified_job_template: AAC_CIS_M365v7_Findings_Report
    organization: "{{ aac_organization }}"
    all_parents_must_converge: false
    success_nodes:
      - "Collect Facts"
