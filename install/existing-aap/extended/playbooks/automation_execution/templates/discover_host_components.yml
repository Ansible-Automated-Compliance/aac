---

- name: Load discover-components survey variable definitions
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../vars/discover_components_survey.yml"

# No variables at launch: this template holds the database credential, so the
# launcher gets the two bounded survey fields and nothing else. The playbook
# takes the database host from ansible/vars/site_config.yml in the project.
- name: Discover host components job template
  ansible.controller.job_template:
    name: "{{ aac_template_discover_components_name }}"
    description: "{{ aac_template_discover_components_description }}"
    organization: "{{ aac_organization }}"
    state: present
    inventory: "{{ aac_inventory_name }}"
    limit: localhost
    project: "{{ aap_project_name }}"
    playbook: ansible/playbooks/discover_host_components.yml
    job_type: run
    execution_environment: "{{ aap_project_default_ee }}"
    credentials:
      - "{{ aac_cred_vault }}"
      - "{{ aac_cred_postgresql }}"
    ask_variables_on_launch: false
    survey_enabled: true
    survey_spec: "{{ aac_discover_components_survey_spec }}"
