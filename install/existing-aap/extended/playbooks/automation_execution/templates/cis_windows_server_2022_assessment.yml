---

- name: CIS Windows Server 2022 Assessment
  ansible.controller.job_template:
    name: AAC_CIS_Windows_Server_2022_Assessment
    description: "CIS Windows Server 2022 Assessment"
    organization: "{{ aac_organization }}"
    state: present
    inventory: Compliance Infrastructure
    project: "{{ aap_project_name }}"
    playbook: ansible/playbooks/cis_windows_server_2022_assessment.yml
    job_type: run
    execution_environment: "{{ aap_project_default_ee }}"
    credentials:
      - "{{ aac_cred_postgresql }}"
      - "{{ aac_cred_vault }}"
    become_enabled: false
    extra_vars:
      aac_caa_enabled: false
      opa_security_url: "http://{{ aac_host }}:8181"
