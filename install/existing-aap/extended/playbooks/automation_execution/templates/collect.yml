---

- name: Collect all facts from the system
  ansible.controller.job_template:
    name: AAC_Collect_Facts
    description: "Collect all facts from the system"
    organization: "{{ aac_organization }}"
    state: present
    inventory: Compliance Infrastructure
    project: "{{ aap_project_name }}"
    playbook: ansible/playbooks/collect_all_facts.yml
    job_type: run
    execution_environment: "{{ aap_project_default_ee }}"
    credentials:
      - "{{ aac_cred_postgresql }}"
      - "{{ aac_cred_vault }}"
    become_enabled: true
    extra_vars:
      aac_caa_enabled: false
      opa_security_url: "http://{{ aac_host }}:8181"
