---

- name: CIS Microsoft 365 Foundations Benchmark v7.0.0 Findings Report
  ansible.controller.job_template:
    name: AAC_CIS_M365v7_Findings_Report
    description: "CIS Microsoft 365 Foundations Benchmark v7.0.0 Findings Report"
    organization: "{{ aac_organization }}"
    state: present
    inventory: Compliance Infrastructure
    project: "{{ aap_project_name }}"
    playbook: ansible/playbooks/m365_cis_findings_report.yml
    job_type: run
    execution_environment: "{{ aap_project_default_ee }}"
    credentials:
      - "{{ aac_cred_postgresql }}"
      - "{{ aac_cred_vault }}"
    become_enabled: true
    extra_vars:
      aac_caa_enabled: false
      opa_security_url: "http://{{ aac_host }}:8181"
