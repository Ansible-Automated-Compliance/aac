---

- name: Create Red Hat Registry Credential
  ansible.eda.credential:
    name: "Red Hat Container Registry"
    description: Red Hat Container Registry
    organization_name: "{{ aac_organization }}"
    credential_type_name: Container Registry
    inputs:
      host: "registry.redhat.io"
      username: "{{ redhat_username }}"
      password: "{{ redhat_offline_token }}"
