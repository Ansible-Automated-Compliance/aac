---

- name: Create Hub Default Decision Environment Container Registry Credential
  ansible.eda.credential:
    name: "Hub Default Decision Environment Container Registry"
    description: Hub Default Decision Environment Container Registry
    organization_name: "{{ aac_organization }}"
    credential_type_name: Container Registry
    inputs:
      host: "{{ controller_hostname | regex_replace('^https://', '') | regex_replace('/$', '') }}"
      username: "{{ controller_username }}"
      password: "{{ controller_password }}"
      verify_ssl: "{{ controller_verify_ssl }}"
    state: present
