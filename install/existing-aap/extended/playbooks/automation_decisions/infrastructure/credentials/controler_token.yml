---

- name: Create Controller Token Credential
  ansible.eda.credential:
    name: {{ aac_cred_controller_token_name }}
    description: {{ aac_cred_controller_token_description }}
    organization_name: "{{ aac_organization }}"
    credential_type_name: Red Hat Ansible Automation Platform
    inputs:
      host: "{{ controller_hostname }}"
      username: "{{ controller_username }}"
      password: "{{ controller_password }}"
      verify_ssl: "{{ controller_verify_ssl }}"
    state: present