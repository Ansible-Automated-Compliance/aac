---

- name: Create GitHub PAT
  ansible.eda.credential:
    name: "GitHub PAT (Source Control)"
    description: GitHub Personal Access Token for compliance repository (Source Control)
    organization_name: "{{ aac_organization }}"
    credential_type_name: Source Control
    state: present
    inputs:
      username: "{{ github_username }}"
      password: "{{ github_pat }}"
