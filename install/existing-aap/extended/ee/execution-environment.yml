---
# AAC Compliance Execution Environment
# To build:
# ansible-builder build -vvv -t quay.io/<org>/aac-compliance-ee:latest
# Then push to a registry:
# podman login quay.io
# podman push quay.io/<org>/aac-compliance-ee:latest

version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-26/ee-supported-rhel9:latest

additional_build_files:
    - src: cosign.tar.gz
      dest: configs

dependencies:
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt
  python_interpreter:
    package_system: python312
    python_path: /usr/bin/python3.12

options:
  package_manager_path: /usr/bin/microdnf

additional_build_steps:
  append_final:
    - RUN microdnf install -y unzip && microdnf clean all
    - ADD _build/configs/cosign.tar.gz /usr/local/bin/cosign 
