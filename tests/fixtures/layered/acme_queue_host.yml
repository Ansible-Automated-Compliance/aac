---
# Stub collector for a MADE-UP component, used only by tests/test_layered_collection.py
# and the local container run. "acme_queue" exists nowhere in the product: it is
# added to a copy of the catalog by the test. The stub returns a fixed result,
# so the test can read it without running Ansible.
- name: Acme queue stub | return a fixed host-side result
  ansible.builtin.set_fact:
    lc_result:
      status: collected
      instance:
        identity: cluster/acme-prod
        name: Acme queue (stub)
      facts:
        config:
          listen: "0.0.0.0:7777"
          tls: "on"
        files:
          - {path: /etc/acme/queue.conf, mode: "640", owner: acme, group: acme}
      children:
        - {kind: container_image, value: "quay.io/sclorg/postgresql-16-c9s:latest", name: acme-store}
        - {kind: process, value: acme-worker, name: worker}
