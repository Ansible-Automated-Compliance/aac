[defaults]
host_key_checking = False
retry_files_enabled = False
roles_path = ansible/roles:roles
# Without this, collections/ansible_collections/ is not discoverable and any
# aac.* FQCN fails to resolve -- "the role 'aac.m365.m365_assessment' was not
# found", and the same for every module in the collection. Nothing in the repo
# set it, so the aac.m365 collection has never been resolvable from an AAP job.
collections_path = collections
# Mitogen strategy plugin — installed in EE at /opt/mitogen
# Use 'strategy: mitogen_linear' per-playbook or benchmark_strategy=mitogen_linear
# as an extra_var to enable. Default stays 'linear'.
# NOTE: /opt/mitogen_strategies only exists inside the AAC Compliance EE container (EE ID 6).
# Comment out this line for local ansible-playbook runs outside the EE.
strategy_plugins = /opt/mitogen_strategies

[ssh_connection]
pipelining = True
