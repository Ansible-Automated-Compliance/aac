---
# cis_linux_build_opa_input.yml — the ONE mapper from collected Linux facts to
# the CIS Linux OPA input shape.
#
# Shared by cis_rhel9_assessment.yml (direct) and evaluate_stored_facts.yml
# (stored facts). Both must send OPA the same payload; this file is where it is
# built.
#
# Input:   facts_data     — {ansible_facts: {...}, custom_facts: {...}} as produced
#                           by ../tasks/collect_linux_compliance_facts.yml
#          opa_hostname   — hostname to report (optional)
#          m              — when called in a loop from evaluate_stored_facts.yml,
#                           the matrix row; the built input is appended to
#                           eval_inputs as {'m': m, 'input': opa_input}
# Output:  opa_input
#
# SAFETY NOTES
# - Template injection: every host-collected string here (sshd config, sudoers,
#   banners, logging config, …) arrives as module output (`register` stdout or a
#   postgresql_query row), which Ansible wraps as AnsibleUnsafe; it is carried
#   through `combine` untemplated. tests/cis_mapper verifies a hostile payload
#   ("{{ lookup('pipe','id') }}") survives verbatim and nothing is evaluated.
# - Parser differential: a derived field is only ever as good as this file's
#   regex versus the daemon's own parser. Where that could read as "configured"
#   from a comment or a partial file, the derivation is written to bias CLOSED
#   (uncommented Defaults lines only for sudo; whole rsyslog/journald files plus
#   drop-ins collected; journald defaults applied only where the daemon's own
#   default applies). Prefer `sshd -T`-style effective output over raw files.
#
# RULE: NEVER FABRICATE. A section is emitted only when the collector gathered
# the facts behind it, and a field only when it can be derived from them. A
# section that is not emitted is reported by the policy as NOT ASSESSED (see
# cis_rhel9.section_inputs in the Rego library), which is the honest result.
# The previous mapper carried constants such as aide_installed: false,
# global_gpgcheck_enabled: true and logrotate.installed: true; those produced
# violations and passes for controls nobody had looked at.
#
# Sections emitted today and the facts behind them:
#   ansible_facts, ssh, pam (+ login.defs aging, password_auth, root_gid,
#   default_umask, tmout, inactive_days), auditd (+ log / log dir / config
#   file permissions), services (ansible service_facts), packages (audit,
#   pwquality), sudo, selinux, bootloader, rsyslog, journald, chronyd,
#   time_synchronization, autofs, cron (daemon state + file modes/owners and
#   allow/deny presence), initial_setup (banner presence, banner modes/owners,
#   gpg_keys, enabled_repos, repos_without_gpgcheck, global_gpgcheck_enabled,
#   crypto_policy), disabled_filesystem_modules, mount_options (/tmp,
#   /dev/shm), world_writable, boot_security, sysctl_parameters (analysis:
#   parameter + running value for a fixed CIS whitelist), ip_forwarding, ipv6,
#   firewall, wireless_interfaces, user_group, storage_encryption,
#   certificates (RPM family), authorized_keys.
# The supplement sections (boot_security onward, and the "+" fields above) come
# from collector blocks that end in "end:ok"; without that marker -- a block
# that did not run, or a stored-facts row older than 2026-10-19 -- they are not
# emitted. Platform notes: gpg_keys / enabled_repos / certificates are RPM-only
# and are omitted on Debian/Ubuntu (NOT ASSESSED / evidence missing there).
#
# CIS RHEL 9 v3.0.0 (2026-10-21): the _v3_* sections below come from the
# kmod / sysctl / pkg_state / config / perms / accounts / fs_sweep blocks
# (disabled_*_modules with available/disabled/loaded, sysctl_parameters
# analysis + persisted, packages, services for units service_facts does not
# report, crypto_policy, chronyd, mta, firewall backend/zones, GDM fields,
# critical_files, ssh/sudo/rsyslog/audit-tool/log file modes, shadow_entries,
# unowned/ungrouped files, sticky_bit, privileged_commands). They are emitted
# only from their own valid block, like the supplement sections.
#
# Not emitted (NOT ASSESSED until a collector exists): suid_files,
# sgid_files, ssh_private_keys (v2 shape), unnecessary_services,
# separate_partitions, usb_storage, sysctl_parameters.non_compliant_params
# (an expected-value comparison is a policy decision, not the mapper's).

- name: Build CIS Linux OPA input from collected facts (no fabricated values)
  vars:
    _af: "{{ facts_data.ansible_facts | default({}) }}"
    _cf: "{{ facts_data.custom_facts | default({}) }}"
    _svc: "{{ (facts_data.ansible_facts | default({})).services | default({}) }}"
    _logging_raw: "{{ (facts_data.custom_facts | default({})).logging_raw | default('') }}"
    _rsyslog_txt: "{{ (_logging_raw.split('=== journald ==='))[0] }}"
    _journald_txt: "{{ (_logging_raw.split('=== journald ==='))[1] | default('') }}"
    _sudoers: "{{ (facts_data.custom_facts | default({})).sudoers_raw | default('') }}"
    _aging_raw: "{{ (facts_data.custom_facts | default({})).password_aging_raw | default('') }}"
    _banners: "{{ (facts_data.custom_facts | default({})).banners_raw | default('') }}"
    _grub: "{{ (facts_data.custom_facts | default({})).grub_raw | default('') }}"
    _mods_raw: "{{ (facts_data.custom_facts | default({})).kernel_modules_raw | default('') }}"
    _tmp_mount: "{{ (_af.mounts | default([])) | selectattr('mount', 'equalto', '/tmp') | list | first | default({}) }}"
    _shm_mount: "{{ (_af.mounts | default([])) | selectattr('mount', 'equalto', '/dev/shm') | list | first | default({}) }}"

    _base:
      ansible_facts:
        ansible_hostname: "{{ _af.hostname | default(opa_hostname | default(inventory_hostname)) }}"
        ansible_distribution: "{{ _af.distribution | default('') }}"
        ansible_distribution_version: "{{ _af.distribution_version | default('') }}"
        ansible_distribution_major_version: "{{ _af.distribution_major_version | default((_af.distribution_version | default('0')) | string | split('.') | first) }}"
        ansible_os_family: "{{ _af.os_family | default('') }}"
        ansible_kernel: "{{ _af.kernel | default('') }}"
        ansible_architecture: "{{ _af.architecture | default('') }}"
        ansible_mounts: "{{ _af.mounts | default([]) }}"
        ansible_interfaces: "{{ _af.interfaces | default([]) }}"
        ansible_default_ipv4: "{{ _af.default_ipv4 | default({}) }}"
        ansible_selinux: "{{ _af.selinux | default({}) }}"
        ansible_service_mgr: "{{ _af.service_mgr | default('systemd') }}"
        ansible_processor_cores: "{{ _af.processor_cores | default(0) }}"
        ansible_memtotal_mb: "{{ _af.memtotal_mb | default(0) }}"

    # ── SSH (CIS 5.2.x) ────────────────────────────────────────────────────
    _ssh: >-
      {{ {'ssh': {'sshd_config_raw': (_cf.sshd_config_raw | regex_replace('(?im)^listenaddress[^\n]*\n?', ''))}}
         if (_cf.sshd_config_raw | default('') | length > 0) else {} }}

    # ── PAM + login.defs aging (CIS 5.4.x, 5.5.x) ──────────────────────────
    _aging: >-
      {%- set d = {} -%}
      {%- for key, name in [('PASS_MAX_DAYS', 'pass_max_days'), ('PASS_MIN_DAYS', 'pass_min_days'), ('PASS_WARN_AGE', 'pass_warn_age')] -%}
        {%- set m = _aging_raw | regex_search(key ~ '\\s+(\\d+)', '\\1') -%}
        {%- if m -%}{%- set _ = d.update({name: (m[0] | int)}) -%}{%- endif -%}
      {%- endfor -%}
      {{ d }}
    _pam: >-
      {{ {'pam': ({'pwquality_conf_raw': _cf.pwquality_conf_raw | default(''),
                   'pwquality_installed': (_cf.pwquality_conf_raw | default('') | length > 0),
                   'system_auth': _cf.pam_config_raw | default('')} | combine(_aging))}
         if ((_cf.pam_config_raw | default('') | length > 0) or (_cf.pwquality_conf_raw | default('') | length > 0)) else {} }}

    # ── auditd (CIS 4.1.x) ─────────────────────────────────────────────────
    _auditd_rules: "{{ (_cf.auditd_rules_raw | default('')) | split('\n') | select | list }}"
    _auditd: >-
      {{ {'auditd': {'config': _cf.auditd_conf_raw | default(''), 'active_rules': _auditd_rules, 'rules': _auditd_rules}}
         if ((_cf.auditd_rules_raw | default('') | length > 0) or (_cf.auditd_conf_raw | default('') | length > 0)) else {} }}

    # ── packages the modules ask about and the collector can answer ────────
    _packages:
      packages:
        audit: "{{ 'auditd.service' in _svc }}"
        pwquality: "{{ _cf.pwquality_conf_raw | default('') | length > 0 }}"

    # ── sudo (CIS 5.3.x) ───────────────────────────────────────────────────
    # Only an UNCOMMENTED Defaults line may satisfy a control; a commented
    # "# Defaults logfile=" must not read as configured (fail-open otherwise).
    _sudo_timeout: "{{ _sudoers | regex_search('(?m)^\\s*Defaults[^#\\n]*timestamp_timeout\\s*=\\s*(-?\\d+)', '\\1') }}"
    _sudo_logfile: "{{ _sudoers is search('(?m)^\\s*Defaults[^#\\n]*logfile\\s*=') }}"
    _sudo: >-
      {{ {'sudo': ({'installed': true, 'sudoers_content': _sudoers, 'logfile_exists': (_sudo_logfile | bool)}
                   | combine({'timestamp_timeout': _sudo_timeout[0]} if _sudo_timeout else {}))}
         if (_sudoers | length > 0) else {} }}

    # ── SELinux (CIS 1.6.x) ────────────────────────────────────────────────
    _selinux: >-
      {{ {'selinux': {'installed': ((_af.selinux | default({})).status | default('')) in ['enabled', 'disabled'],
                      'status': (_af.selinux | default({})).status | default('disabled'),
                      'mode': (_af.selinux | default({})).mode | default('disabled'),
                      'policy': (_af.selinux | default({})).type | default(''),
                      'grub_cmdline': _grub}}
         if ((_af.selinux | default({})).status is defined) else {} }}

    # ── bootloader (CIS 1.4.x) ─────────────────────────────────────────────
    _bootloader: "{{ {'bootloader': {'grub_config': _grub}} if (_grub | length > 0) else {} }}"

    # ── rsyslog / journald (CIS 4.2.x) — derived from the config text ──────
    _rsyslog_mode: "{{ _rsyslog_txt | regex_search('\\$FileCreateMode\\s+(\\d+)', '\\1') }}"
    _rsyslog: >-
      {{ {'rsyslog': ({'installed': ('rsyslog.service' in _svc),
                       'service_active': (_svc.get('rsyslog.service', {}).get('state', '') == 'running'),
                       'service_enabled': (_svc.get('rsyslog.service', {}).get('status', '') == 'enabled'),
                       'logging_rules_count': (_rsyslog_txt | regex_findall('^[^#$].*\s-?/var/log/', multiline=True) | length),
                       'remote_logging_configured': (_rsyslog_txt is search('(?m)^[^#]*\s@@?[\w.\[\]:-]+')),
                       'config_raw': (_rsyslog_txt | regex_replace('^\\s*=== rsyslog ===\\s*\\n?', '') | trim)}
                      | combine({'file_create_mode': _rsyslog_mode[0]} if _rsyslog_mode else {}))}
         if ((_logging_raw | length > 0) or ('rsyslog.service' in _svc)) else {} }}
    _journald_storage: "{{ _journald_txt | regex_search('(?m)^Storage=(\\w+)', '\\1') }}"
    _journald: >-
      {{ {'journald': {'service_active': (_svc.get('systemd-journald.service', {}).get('state', '') == 'running'),
                       'compress_enabled': ('yes' if (_journald_txt is search('(?m)^Compress=yes')) else 'no'),
                       'forward_to_syslog': ('yes' if (_journald_txt is search('(?m)^ForwardToSyslog=yes')) else 'no'),
                       'storage_mode': (_journald_storage[0] if _journald_storage else 'auto')}}
         if (_logging_raw | length > 0) else {} }}

    # ── services derived from ansible_facts.services (CIS 2.x, 5.1.1) ──────
    _chronyd_active: "{{ _svc.get('chronyd.service', {}).get('state', '') == 'running' }}"
    _services: >-
      {{ {'chronyd': {'installed': ('chronyd.service' in _svc),
                      'service_active': (_chronyd_active | bool),
                      'service_enabled': (_svc.get('chronyd.service', {}).get('status', '') == 'enabled'),
                      'has_time_sources': (_chronyd_active | bool)},
          'time_synchronization': {'has_active_service': (_chronyd_active | bool),
                                   'active_service': ('chronyd' if (_chronyd_active | bool) else ''),
                                   'services': [{'service': 'chronyd', 'active': (_chronyd_active | bool)}]},
          'autofs': {'installed': ('autofs.service' in _svc),
                     'active': (_svc.get('autofs.service', {}).get('state', '') == 'running'),
                     'enabled': (_svc.get('autofs.service', {}).get('status', '') == 'enabled')},
          'cron': {'crond_enabled': (_svc.get('crond.service', {}).get('status', '') == 'enabled'),
                   'crond_running': (_svc.get('crond.service', {}).get('state', '') == 'running')}}
         if (_svc | length > 0) else {} }}

    # ── initial setup: banner presence (CIS 1.7.x) ─────────────────────────
    # *_contains_sensitive_info: the CIS audit pattern -- an escape that prints
    # system data (\m \r \s \v) or the OS id -- in that file's own text.
    _banner_text: >-
      {%- set o = {'motd': [], 'issue': [], 'issue_net': []} -%}{%- set cur = {'k': ''} -%}
      {%- for l in _banners.split('\n') -%}
        {%- if l == '=== /etc/motd ===' -%}{%- set _ = cur.update({'k': 'motd'}) -%}
        {%- elif l == '=== /etc/issue ===' -%}{%- set _ = cur.update({'k': 'issue'}) -%}
        {%- elif l == '=== /etc/issue.net ===' -%}{%- set _ = cur.update({'k': 'issue_net'}) -%}
        {%- elif cur.k != '' -%}{%- set _ = o[cur.k].append(l) -%}{%- endif -%}
      {%- endfor -%}
      {{ o }}
    _os_ids: >-
      {%- set d = (_af.distribution | default('') | lower) -%}
      {{ ({'redhat': ['rhel', 'red hat'], 'centos': ['centos'], 'rocky': ['rocky'], 'almalinux': ['almalinux', 'alma'], 'fedora': ['fedora'],
           'ubuntu': ['ubuntu'], 'amazon': ['amzn', 'amazon'], 'debian': ['debian']}).get(d, ([d] if d else [])) }}
    _initial: >-
      {%- set o = {'motd_exists': (('=== /etc/motd ===' in _banners) and ((_banners.split('=== /etc/issue ==='))[0] | length > 20)),
                   'issue_exists': ('=== /etc/issue ===' in _banners),
                   'issue_net_exists': ('=== /etc/issue.net ===' in _banners)} -%}
      {%- set pat = '(?i)(\\\\[mrsv]' ~ ((_os_ids | map('regex_escape') | map('regex_replace', '^(.*)$', '|\\\\b\\1\\\\b') | join('')) if (_os_ids | length) > 0 else '') ~ ')' -%}
      {%- for k in ['motd', 'issue', 'issue_net'] if o[k ~ '_exists'] -%}
        {%- set _ = o.update({k ~ '_contains_sensitive_info': ((_banner_text[k] | join('\n')) is search(pat))}) -%}
      {%- endfor -%}
      {{ {'initial_setup': o} if (_banners | length > 0) else {} }}

    # ── filesystem modules (CIS 1.1.1.x) from the modprobe probe ───────────
    _fsmods_list: >-
      {%- set out = [] -%}
      {%- for line in (_mods_raw | split('\n')) if ':' in line -%}
        {%- set name = line.split(':')[0] | trim -%}
        {%- set disabled = line.endswith(':disabled') -%}
        {%- set _ = out.append({'module': name, 'disabled': disabled, 'loaded': 'unknown', 'compliant': disabled}) -%}
      {%- endfor -%}
      {{ out }}
    _fsmods: >-
      {{ {'disabled_filesystem_modules': {'modules': _fsmods_list,
                                          'all_compliant': ((_fsmods_list | rejectattr('compliant') | list | length) == 0)}}
         if (_mods_raw | length > 0) else {} }}

    # ── mount options for /tmp and /dev/shm (CIS 1.1.2.x) from ansible_mounts
    _mounts: >-
      {{ {'mount_options': {'tmp': {'exists': (_tmp_mount | length > 0),
                                    'has_nodev': ('nodev' in ((_tmp_mount.options | default('')) | split(','))),
                                    'has_nosuid': ('nosuid' in ((_tmp_mount.options | default('')) | split(','))),
                                    'has_noexec': ('noexec' in ((_tmp_mount.options | default('')) | split(',')))},
                            'dev_shm': {'exists': (_shm_mount | length > 0),
                                        'has_nodev': ('nodev' in ((_shm_mount.options | default('')) | split(','))),
                                        'has_nosuid': ('nosuid' in ((_shm_mount.options | default('')) | split(','))),
                                        'has_noexec': ('noexec' in ((_shm_mount.options | default('')) | split(',')))}}}
         if (_af.mounts is defined) else {} }}

    # ── world-writable files (CIS 6.1.x) ───────────────────────────────────
    # The collector lists at most 100 paths; count is the TRUE total when it
    # was collected, and truncated: true marks a partial list (or an unknown
    # total, e.g. the sweep timed out), which is never compliant.
    _ww: >-
      {%- set ww = _cf.world_writable_files | reject('match', '^__count__[|]') | list -%}
      {%- set tr = (_cf.world_writable_truncated | default(false)) | bool -%}
      {%- set n = (_cf.world_writable_count | int) if ((_cf.world_writable_count | default('', true) | string) is match('^[0-9]+$')) else (ww | length) -%}
      {{ {'world_writable': ({'files': ww, 'count': (n | int), 'compliant': ((n | int) == 0 and not tr)}
                             | combine({'truncated': true} if tr else {}))}
         if (_cf.world_writable_files is defined) else {} }}

    # ══ CIS supplement (collector blocks ending in "end:ok") ══════════════
    # A block without its end:ok marker (not run, or a stored row older than
    # the collector change) yields no fields at all.
    _fm_raw: "{{ _cf.file_modes_raw | default('') }}"
    _boot_raw: "{{ _cf.boot_raw | default('') }}"
    _net_raw: "{{ _cf.network_raw | default('') }}"
    _ug_raw: "{{ _cf.user_group_raw | default('') }}"
    _ap_raw: "{{ _cf.account_policy_raw | default('') }}"
    _pt_raw: "{{ _cf.pkg_trust_raw | default('') }}"
    _st_raw: "{{ _cf.storage_raw | default('') }}"
    _cert_raw: "{{ _cf.certs_raw | default('') }}"
    _ak_raw: "{{ _cf.authorized_keys_raw | default('') }}"
    _kmod_raw: "{{ _cf.kmod_raw | default('') }}"
    _sysctl_raw: "{{ _cf.sysctl_raw | default('') }}"
    _pkg_raw: "{{ _cf.pkg_state_raw | default('') }}"
    _cfg_raw: "{{ _cf.config_raw | default('') }}"
    _perms_raw: "{{ _cf.perms_raw | default('') }}"
    _acc_raw: "{{ _cf.accounts_raw | default('') }}"
    _sweep_raw: "{{ _cf.fs_sweep_raw | default('') }}"

    # INTEGRITY RULES for the tagged-line blocks (each is fail-closed):
    #  - end:ok must appear exactly once and be the block's last line, else the
    #    whole block is "not collected" (a forged or truncated block);
    #  - a singleton tag (one fixed path, one sysctl key, fips, ...) seen more
    #    than once makes the whole block "not collected": never first/last-wins,
    #    and dropping just that field would read as a pass for rules that only
    #    fire when a field is present;
    #  - missing_cmd|<cmd> and truncated|<tag> mean the evidence is incomplete:
    #    the block (or, where noted, the field) is not collected;
    #  - symlink|<tag> is recorded; the collector reports the link's own mode;
    #  - unsafe_name|<tag> lines only RECORD that the collector replaced a
    #    hostile host string by unsafe:<sha256 prefix>; the record itself is
    #    kept and judged like any other (a world-writable file with a hostile
    #    name still fails). They never invalidate a block: an unprivileged user
    #    can create such names, and must not be able to suppress a section.
    # Every parse yields {tag: [[field, ...], ...], '_dup': [...], '_unsafe': [...]}.
    _fm_kv: >-
      {%- set d = {'_dup': [], '_unsafe': [], '_trunc': [], '_missing': [], '_symlink': []} -%}{%- set seen = {} -%}
      {%- set lines = _fm_raw | trim | split('\n') -%}
      {%- set marked = ((lines | select('equalto', 'end:ok') | list | length) == 1) and ((lines | last) == 'end:ok') -%}
      {%- for line in lines if marked and line != 'end:ok' -%}
        {%- set p = line.split('|') -%}
        {%- if (p | length) >= 2 -%}
          {%- set key = ('path|' ~ (p[1:] | last)) if p[0] in ['stat', 'absent'] else (p[0] if p[0] in ['audit_log_file', 'audit_log_dir'] else '') -%}
          {%- if key != '' -%}
            {%- if key in seen -%}{%- set _ = d._dup.append(key) -%}{%- endif -%}
            {%- set _ = seen.update({key: 1}) -%}
          {%- endif -%}
          {%- if p[0] == 'unsafe_name' -%}{%- set _ = d._unsafe.append(p[1]) -%}{%- endif -%}
          {%- if p[0] == 'truncated' -%}{%- set _ = d._trunc.append(p[1]) -%}{%- endif -%}
          {%- if p[0] == 'missing_cmd' -%}{%- set _ = d._missing.append(p[1]) -%}{%- endif -%}
          {%- if p[0] == 'symlink' -%}{%- set _ = d._symlink.append(p[1]) -%}{%- endif -%}
          {%- set _ = d.setdefault(p[0], []).append(p[1:]) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ d | combine({'_marked': marked}) }}
    _boot_kv: >-
      {%- set d = {'_dup': [], '_unsafe': [], '_trunc': [], '_missing': [], '_symlink': []} -%}{%- set seen = {} -%}
      {%- set lines = _boot_raw | trim | split('\n') -%}
      {%- set marked = ((lines | select('equalto', 'end:ok') | list | length) == 1) and ((lines | last) == 'end:ok') -%}
      {%- for line in lines if marked and line != 'end:ok' -%}
        {%- set p = line.split('|') -%}
        {%- if (p | length) >= 2 -%}
          {%- set key = (p[0] ~ '|' ~ p[1]) if p[0] in ['pkg', 'sysctl', 'sulogin', 'enabled', 'coredump'] else (p[0] if p[0] in ['aide_db', 'aide_cron', 'aide_timer', 'grub_pw_hashed', 'grub_pw_plain', 'coredump_present'] else '') -%}
          {%- if key != '' -%}
            {%- if key in seen -%}{%- set _ = d._dup.append(key) -%}{%- endif -%}
            {%- set _ = seen.update({key: 1}) -%}
          {%- endif -%}
          {%- if p[0] == 'unsafe_name' -%}{%- set _ = d._unsafe.append(p[1]) -%}{%- endif -%}
          {%- if p[0] == 'truncated' -%}{%- set _ = d._trunc.append(p[1]) -%}{%- endif -%}
          {%- if p[0] == 'missing_cmd' -%}{%- set _ = d._missing.append(p[1]) -%}{%- endif -%}
          {%- if p[0] == 'symlink' -%}{%- set _ = d._symlink.append(p[1]) -%}{%- endif -%}
          {%- set _ = d.setdefault(p[0], []).append(p[1:]) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ d | combine({'_marked': marked}) }}
    _net_kv: >-
      {%- set d = {'_dup': [], '_unsafe': [], '_trunc': [], '_missing': [], '_symlink': []} -%}{%- set seen = {} -%}
      {%- set lines = _net_raw | trim | split('\n') -%}
      {%- set marked = ((lines | select('equalto', 'end:ok') | list | length) == 1) and ((lines | last) == 'end:ok') -%}
      {%- for line in lines if marked and line != 'end:ok' -%}
        {%- set p = line.split('|') -%}
        {%- if (p | length) >= 2 -%}
          {%- set key = (p[0] ~ '|' ~ p[1]) if p[0] in ['sysctl'] else (p[0] if p[0] in ['ipv6', 'ipv6_addresses', 'firewall'] else '') -%}
          {%- if key != '' -%}
            {%- if key in seen -%}{%- set _ = d._dup.append(key) -%}{%- endif -%}
            {%- set _ = seen.update({key: 1}) -%}
          {%- endif -%}
          {%- if p[0] == 'unsafe_name' -%}{%- set _ = d._unsafe.append(p[1]) -%}{%- endif -%}
          {%- if p[0] == 'truncated' -%}{%- set _ = d._trunc.append(p[1]) -%}{%- endif -%}
          {%- if p[0] == 'missing_cmd' -%}{%- set _ = d._missing.append(p[1]) -%}{%- endif -%}
