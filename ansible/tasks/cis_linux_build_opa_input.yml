    # block usable: marker valid, no duplicate singleton, no missing command,
    # no truncated list (a capped list is not the whole truth). Exceptions,
    # per item: a capped dotfile list (user_group) or key list (authorized_keys)
    # becomes one failing entry for THAT user / file; nothing else is dropped.
    _ok_fm: "{{ (_fm_kv._marked | bool) and (_fm_kv._dup | length == 0) and (_fm_kv._missing | length == 0) and (_fm_kv._trunc | length == 0) }}"
