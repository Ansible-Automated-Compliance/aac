    _ok_cert: "{{ (_cert_kv._marked | bool) and (_cert_kv._dup | length == 0) and (_cert_kv._missing | length == 0) and (_cert_kv._trunc | length == 0) }}"
    _ok_ak: "{{ (_ak_kv._marked | bool) and (_ak_kv._dup | length == 0) and (_ak_kv._missing | length == 0) and (_ak_kv._trunc | reject('equalto', 'akkey') | list | length == 0) }}"
    # v3 blocks. perms / sweep: a capped list (grub, logf; unowned, ungrouped,
    # nosticky, priv) drops only THAT field, never the rest of the block.
    _ok_kmod: "{{ (_kmod_kv._marked | bool) and (_kmod_kv._dup | length == 0) and (_kmod_kv._missing | length == 0) and (_kmod_kv._trunc | length == 0) }}"
