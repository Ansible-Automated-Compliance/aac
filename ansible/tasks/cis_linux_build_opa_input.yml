    _ok_acc: "{{ (_acc_kv._marked | bool) and (_acc_kv._dup | length == 0) and (_acc_kv._missing | length == 0) and (_acc_kv._trunc | length == 0) }}"
    _ok_sweep: "{{ (_sweep_kv._marked | bool) and (_sweep_kv._dup | length == 0) and (_sweep_kv._missing | length == 0) }}"
    # path -> {mode, owner, group} | {absent: true}, only from a usable block
    _fm: >-
      {%- set d = {'_ok': (_ok_fm | bool), '_auditcfg': []} -%}
      {%- if (_ok_fm | bool) -%}
        {%- for p in _fm_kv.get('stat', []) if (p | length) >= 4 -%}
          {%- set _ = d.update({(p[3:] | join('|')): {'mode': p[0], 'owner': p[1], 'group': p[2]}}) -%}
        {%- endfor -%}
        {%- for p in _fm_kv.get('absent', []) -%}{%- set _ = d.update({(p | join('|')): {'absent': true}}) -%}{%- endfor -%}
        {%- for p in _fm_kv.get('audit_log_file', []) -%}{%- set _ = d.update({'_audit_log_file': (p | join('|'))}) -%}{%- endfor -%}
        {%- for p in _fm_kv.get('audit_log_dir', []) -%}{%- set _ = d.update({'_audit_log_dir': (p | join('|'))}) -%}{%- endfor -%}
        {%- for p in _fm_kv.get('auditcfg', []) if (p | length) >= 4 -%}
          {%- set _ = d._auditcfg.append({'stat': {'path': (p[3:] | join('|')), 'mode': p[0], 'pw_name': p[1], 'gr_name': p[2]}}) -%}
        {%- endfor -%}
      {%- endif -%}
      {{ d }}
    # What the integrity rules rejected, per block -- carried to OPA as
    # evidence (no policy reads it today; it explains a NOT ASSESSED).
    _integrity: >-
      {%- set o = {} -%}
      {%- for name, kv in [('file_modes', _fm_kv), ('boot', _boot_kv), ('network', _net_kv), ('user_group', _ug_kv), ('account_policy', _ap_kv), ('pkg_trust', _pt_kv), ('storage', _st_kv), ('certs', _cert_kv), ('authorized_keys', _ak_kv), ('kernel_modules', _kmod_kv), ('sysctl', _sysctl_kv), ('package_state', _pkg_kv), ('config', _cfg_kv), ('permissions', _perms_kv), ('accounts', _acc_kv), ('filesystem_sweep', _sweep_kv)] -%}
        {%- if (kv._dup + kv._unsafe + kv._trunc + kv._missing + kv._symlink) | length > 0 -%}
          {%- set _ = o.update({name: {'duplicate_singletons': kv._dup, 'unsafe_names': kv._unsafe, 'truncated': kv._trunc,
                                       'missing_commands': kv._missing, 'symlinks': kv._symlink}}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'collection_integrity': o} if (o | length) > 0 else {} }}
    _crypto_policy: "{{ (((_pt_kv.crypto_policy | default([[]]))[-1] | first | default('')) | trim) if (_ok_pt | bool) else '' }}"
    # ── boot_security (CIS 1.3-1.5) ────────────────────────────────────────
    # grub.cfg: the BIOS/RHEL path first, the Debian path second.
    _grub_stat: >-
      {{ _fm.get('/boot/grub2/grub.cfg', {}) if ('mode' in _fm.get('/boot/grub2/grub.cfg', {}))
         else _fm.get('/boot/grub/grub.cfg', {}) }}
    _boot_security: >-
      {%- set kv = {} -%}{%- set sy = {} -%}{%- set cd = {} -%}{%- set cores = [] -%}
      {%- for p in _boot_kv.get('pkg', []) + _boot_kv.get('enabled', []) + _boot_kv.get('sulogin', []) if (p | length) == 2 -%}
        {%- set _ = kv.update({p[0]: (p[1] | trim) == 'yes'}) -%}
      {%- endfor -%}
      {%- for p in _boot_kv.get('sysctl', []) if (p | length) == 2 -%}{%- set _ = sy.update({p[0]: (p[1] | trim)}) -%}{%- endfor -%}
      {%- for p in _boot_kv.get('coredump', []) if (p | length) == 2 -%}{%- set _ = cd.update({p[0]: (p[1] | trim)}) -%}{%- endfor -%}
      {%- for p in _boot_kv.get('hard_core', []) -%}{%- set _ = cores.append(p[0] | trim) -%}{%- endfor -%}
      {%- set one = {} -%}
      {%- for k in ['aide_db', 'aide_cron', 'aide_timer', 'grub_pw_hashed', 'grub_pw_plain', 'coredump_present'] if k in _boot_kv -%}
        {%- set _ = one.update({k: (_boot_kv[k][-1][0] | trim)}) -%}
      {%- endfor -%}
      {%- set o = {} -%}
      {%- for name, key in [('aide_installed', 'aide'), ('prelink_installed', 'prelink'), ('abrt_installed', 'abrt'), ('abrtd_enabled', 'abrtd'), ('kdump_enabled', 'kdump')] if key in kv -%}
        {%- set _ = o.update({name: kv[key]}) -%}
      {%- endfor -%}
      {%- for name, key in [('aide_database_initialized', 'aide_db'), ('aide_cron_configured', 'aide_cron'), ('aide_timer_configured', 'aide_timer')] if key in one -%}
        {%- set _ = o.update({name: one[key] == 'yes'}) -%}
      {%- endfor -%}
      {%- if (one.grub_pw_hashed | default('x')) is match('^\d+$') and (one.grub_pw_plain | default('x')) is match('^\d+$') -%}
        {%- set _ = o.update({'grub_password_set': ((one.grub_pw_hashed | int) + (one.grub_pw_plain | int)) > 0,
                              'grub_password_hashed': (one.grub_pw_plain | int) == 0}) -%}
      {%- endif -%}
      {%- if 'mode' in _grub_stat -%}
        {%- set _ = o.update({'grub_cfg_mode': _grub_stat.mode, 'grub_cfg_owner': _grub_stat.owner, 'grub_cfg_group': _grub_stat.group}) -%}
      {%- endif -%}
      {%- if 'rescue.service' in kv and 'emergency.service' in kv -%}
        {%- set _ = o.update({'single_user_auth_required': kv['rescue.service'] and kv['emergency.service']}) -%}
      {%- endif -%}
      {%- if 'rescue.service' in kv -%}{%- set _ = o.update({'rescue_auth_required': kv['rescue.service']}) -%}{%- endif -%}
      {%- if 'emergency.service' in kv -%}{%- set _ = o.update({'emergency_auth_required': kv['emergency.service']}) -%}{%- endif -%}
      {%- if 'fs.suid_dumpable' in sy -%}{%- set _ = o.update({'core_dumps_disabled_sysctl': sy['fs.suid_dumpable'] == '0'}) -%}{%- endif -%}
      {%- if (_boot_kv | length) > 0 -%}
        {%- set _ = o.update({'core_dumps_disabled_limits': ((cores | length) > 0) and ((cores | reject('equalto', '0') | list | length) == 0)}) -%}
      {%- endif -%}
      {%- if one.coredump_present | default('') == 'yes' -%}
        {%- set _ = o.update({'systemd_coredump_storage': cd.get('Storage', 'external'),
                              'systemd_coredump_process_size_max': cd.get('ProcessSizeMax', 'unset (systemd default)')}) -%}
      {%- endif -%}
      {%- for name, key in [('aslr_value', 'kernel.randomize_va_space'), ('kernel_kptr_restrict', 'kernel.kptr_restrict'), ('kernel_dmesg_restrict', 'kernel.dmesg_restrict')] if key in sy -%}
        {%- set _ = o.update({name: sy[key]}) -%}
      {%- endfor -%}
      {{ {'boot_security': o} if ((_ok_boot | bool) and (o | length) > 0) else {} }}

    # ── network (CIS 3.x) — exact whitelist; values as the kernel reports ──
    # No expected values here: comparing them is the policy's job.
    _net_params:
      - net.ipv4.ip_forward
      - net.ipv4.conf.all.forwarding
      - net.ipv4.conf.default.forwarding
      - net.ipv4.conf.all.route_localnet
      - net.ipv4.conf.default.route_localnet
      - net.ipv6.conf.all.forwarding
      - net.ipv6.conf.default.forwarding
      - net.ipv4.conf.all.send_redirects
      - net.ipv4.conf.default.send_redirects
      - net.ipv4.conf.all.accept_source_route
      - net.ipv4.conf.default.accept_source_route
      - net.ipv6.conf.all.accept_source_route
      - net.ipv6.conf.default.accept_source_route
      - net.ipv4.conf.all.accept_redirects
      - net.ipv4.conf.default.accept_redirects
      - net.ipv6.conf.all.accept_redirects
      - net.ipv6.conf.default.accept_redirects
      - net.ipv4.conf.all.secure_redirects
      - net.ipv4.conf.default.secure_redirects
      - net.ipv4.conf.all.log_martians
      - net.ipv4.conf.default.log_martians
      - net.ipv4.icmp_echo_ignore_broadcasts
      - net.ipv4.icmp_ignore_bogus_error_responses
      - net.ipv4.conf.all.rp_filter
      - net.ipv4.conf.default.rp_filter
      - net.ipv4.tcp_syncookies
      - net.ipv6.conf.all.accept_ra
      - net.ipv6.conf.default.accept_ra
    _network: >-
      {%- set sy = {} -%}
      {%- for p in _net_kv.get('sysctl', []) if (p | length) == 2 -%}{%- set _ = sy.update({p[0]: (p[1] | trim)}) -%}{%- endfor -%}
      {%- set analysis = [] -%}
      {%- for n in _net_params if n in sy -%}{%- set _ = analysis.append({'parameter': n, 'current_value': sy[n]}) -%}{%- endfor -%}
      {%- set o = {} -%}
      {%- if (analysis | length) > 0 -%}{%- set _ = o.update({'sysctl_parameters': {'analysis': analysis, 'collected_count': (analysis | length)}}) -%}{%- endif -%}
      {%- set fwd = {} -%}
      {%- for name, key in [('ipv4_forwarding', 'net.ipv4.ip_forward'), ('ipv6_forwarding', 'net.ipv6.conf.all.forwarding')] if (sy.get(key, '') is match('^-?\d+$')) -%}
        {%- set _ = fwd.update({name: (sy[key] | int)}) -%}
      {%- endfor -%}
      {%- if (fwd | length) > 0 -%}{%- set _ = o.update({'ip_forwarding': fwd}) -%}{%- endif -%}
      {%- if 'ipv6' in _net_kv -%}
        {%- set st = _net_kv.ipv6[-1][0] | trim -%}
        {%- set n6 = ((_net_kv.ipv6_addresses | default([['']]))[-1][0] | trim) -%}
        {%- set _ = o.update({'ipv6': ({'status': st, 'disabled': st in ['disabled', 'disabled_kernel']}
                                         | combine({'address_count': (n6 | int)} if (n6 is match('^\d+$')) else {}))}) -%}
      {%- endif -%}
      {%- if 'firewall' in _net_kv -%}
        {%- set fw = _net_kv.firewall[-1][0] | trim -%}
        {%- set _ = o.update({'firewall': {'type': fw, 'active': fw != 'none'}}) -%}
      {%- endif -%}
      {%- if (_ok_net | bool) -%}
        {%- set w = _net_kv.get('wireless', []) | map('first') | list -%}
        {%- set _ = o.update({'wireless_interfaces': {'interfaces': w, 'count': (w | length), 'has_wireless': (w | length) > 0, 'compliant': (w | length) == 0}}) -%}
      {%- endif -%}
      {{ o if (_ok_net | bool) else {} }}

    # ── user_group (CIS 6.2.x) ─────────────────────────────────────────────
    _user_group: >-
      {%- set pw = [] -%}
      {%- for p in _ug_kv.get('pw', []) if (p | length) >= 5 -%}{%- set _ = pw.append(p) -%}{%- endfor -%}
      {%- set grp = [] -%}
      {%- for p in _ug_kv.get('grp', []) if (p | length) >= 2 -%}{%- set _ = grp.append(p) -%}{%- endfor -%}
      {%- set gids = grp | map(attribute=1) | list -%}
      {%- set uidmap = {} -%}{%- set namecnt = {} -%}{%- set gidmap = {} -%}{%- set gnamecnt = {} -%}
      {%- for p in pw -%}
        {%- set _ = uidmap.setdefault(p[1], []).append(p[0]) -%}
        {%- set _ = namecnt.update({p[0]: namecnt.get(p[0], 0) + 1}) -%}
      {%- endfor -%}
      {%- for p in grp -%}
        {%- set _ = gidmap.setdefault(p[1], []).append(p[0]) -%}
        {%- set _ = gnamecnt.update({p[0]: gnamecnt.get(p[0], 0) + 1}) -%}
      {%- endfor -%}
      {%- set dup_uids = {} -%}{%- set dup_gids = {} -%}{%- set dup_names = {} -%}{%- set dup_gnames = {} -%}
      {%- for k, v in uidmap.items() if (v | length) > 1 -%}{%- set _ = dup_uids.update({k: v}) -%}{%- endfor -%}
      {%- for k, v in gidmap.items() if (v | length) > 1 -%}{%- set _ = dup_gids.update({k: v}) -%}{%- endfor -%}
      {%- for k, v in namecnt.items() if v > 1 -%}{%- set _ = dup_names.update({k: v}) -%}{%- endfor -%}
      {%- for k, v in gnamecnt.items() if v > 1 -%}{%- set _ = dup_gnames.update({k: v}) -%}{%- endfor -%}
      {%- set missing_groups = [] -%}
      {%- for p in pw if p[2] not in gids and (p[0] ~ ':' ~ p[2]) not in missing_groups -%}{%- set _ = missing_groups.append(p[0] ~ ':' ~ p[2]) -%}{%- endfor -%}
      {%- set homes = _ug_kv.get('home', []) | selectattr('5', 'defined') | list -%}
      {%- set no_home = [] -%}{%- set not_owner = [] -%}{%- set wide = [] -%}
      {%- for h in homes -%}
        {%- if h[2] == 'no' -%}{%- set _ = no_home.append(h[0]) -%}
        {%- else -%}
          {%- if h[3] != h[0] -%}{%- set _ = not_owner.append({'user': h[0], 'home': h[1]}) -%}{%- endif -%}
          {%- if (h[5] | trim) == 'yes' -%}{%- set _ = wide.append({'user': h[0], 'home': h[1], 'mode': h[4]}) -%}{%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set rp = ((_ug_kv.root_path | default([['']]))[-1] | join('|')) -%}
      {%- set o = {
            'users_without_shadow': (_ug_kv.get('noshadow', []) | map('first') | list),
            'users_with_empty_password': (_ug_kv.get('emptypw', []) | map('first') | list),
            'passwd_groups_not_in_group_file': missing_groups,
            'duplicate_uids': dup_uids, 'duplicate_gids': dup_gids,
            'duplicate_usernames': dup_names, 'duplicate_groupnames': dup_gnames,
            'uid_zero_accounts': (pw | selectattr('1', 'equalto', '0') | map('first') | list),
            'gid_zero_accounts': (pw | selectattr('2', 'equalto', '0') | map('first') | list),
            'gid_zero_groups': (grp | selectattr('1', 'equalto', '0') | map('first') | list),
            'users_without_home_directory': no_home,
            'users_not_owning_home': not_owner,
            'home_dirs_too_permissive': wide,
            'users_with_netrc': [], 'users_with_forward': [], 'users_with_rhosts': [],
            'dotfiles_group_or_world_writable': [],
            'root_path': rp,
            'root_path_dirs': (_ug_kv.get('pathdir', []) | map('first') | list),
            'root_path_writable_dirs': [], 'root_path_nonexistent_dirs': [],
            'passwd_content': '', 'group_content': '', 'shadow_content': ''} -%}
      {%- for tag, key in [('dotnetrc', 'users_with_netrc'), ('dotforward', 'users_with_forward'), ('dotrhosts', 'users_with_rhosts')] -%}
        {%- for p in _ug_kv.get(tag, []) if (p | length) >= 2 -%}{%- set _ = o[key].append({'user': p[0], 'path': (p[1:] | join('|'))}) -%}{%- endfor -%}
      {%- endfor -%}
      {%- for p in _ug_kv.get('dotww', []) if (p | length) >= 3 -%}
        {%- set _ = o.dotfiles_group_or_world_writable.append({'user': p[0], 'mode': p[1], 'file': (p[2:] | join('|'))}) -%}
      {%- endfor -%}
      {%- for p in _ug_kv.get('pathdir', []) if (p | length) == 3 -%}
        {%- if p[1] == 'no' -%}{%- set _ = o.root_path_nonexistent_dirs.append(p[0]) -%}{%- endif -%}
        {%- if (p[2] | trim) == 'yes' -%}{%- set _ = o.root_path_writable_dirs.append(p[0]) -%}{%- endif -%}
      {%- endfor -%}
      {#- a user whose dotfile list was capped gets ONE failing entry naming the
          truncation; every other user's entries stay as collected -#}
      {%- for p in _ug_kv.get('truncated', []) if p[0] == 'dotww' and (p | length) >= 2 -%}
        {%- set _ = o.dotfiles_group_or_world_writable.append({'user': (p[1:] | join('|')), 'mode': 'unverified', 'truncated': true,
                      'file': 'TRUNCATED: more than 50 group/world-writable dot files; list not complete'}) -%}
      {%- endfor -%}
      {%- for f in ['passwd', 'group', 'shadow'] -%}
        {%- set _ = o.update({f ~ '_content': (_ug_kv.get('plus', []) | selectattr('0', 'equalto', f) | map(attribute=1) | join('\n'))}) -%}
      {%- endfor -%}
      {{ {'user_group': o} if ((_ok_ug | bool) and (pw | length) > 0 and 'root_path' in _ug_kv) else {} }}

    # ── pam extras (CIS 5.4.x, 5.5.x) ──────────────────────────────────────
    # password_auth: the password-auth section of the collected PAM text.
    # default_umask / tmout: the LEAST restrictive uncommented setting found
    # (bias closed): a umask is restrictive only when group lacks write and
    # other has nothing (027 or tighter); any TMOUT=0 wins, else the largest.
    _pam_pa: "{{ ((_cf.pam_config_raw | default('')).split('=== password-auth ===')[1] | default('')) | trim }}"
    _root_line: "{{ (_cf.users_raw | default('')) | regex_search('(?m)^root:[^\\n]*') }}"
    _pam_extra: >-
      {%- set o = {} -%}
      {%- if (_pam_pa | length) > 0 -%}{%- set _ = o.update({'password_auth': _pam_pa}) -%}{%- endif -%}
      {%- set rf = (_root_line or '').split(':') -%}
      {%- if (rf | length) >= 3 and rf[2] is match('^\d+$') -%}{%- set _ = o.update({'root_gid': (rf[2] | int)}) -%}{%- endif -%}
      {%- if (_ok_ap | bool) -%}
        {%- set um = _ap_kv.get('umask', []) | map('last') | map('trim') | select('match', '^[0-7]{3,4}$') | list -%}
        {%- set weak = [] -%}
        {%- for u in um -%}
          {%- set g = u[-2] | int -%}{%- set ot = u[-1] | int -%}
          {%- if not (g in [2, 3, 6, 7] and ot == 7) -%}{%- set _ = weak.append(u) -%}{%- endif -%}
        {%- endfor -%}
        {%- if (um | length) > 0 -%}{%- set _ = o.update({'default_umask': (weak + um) | first}) -%}{%- endif -%}
        {#- login.defs UMASK on its own (CIS 5.4.3.3); the last one wins, as in shadow-utils -#}
        {%- set ld = _ap_kv.get('umask', []) | selectattr('0', 'equalto', '/etc/login.defs') | map('last') | map('trim') | select('match', '^[0-7]{3,4}$') | list -%}
        {%- if (ld | length) > 0 -%}{%- set _ = o.update({'login_defs_umask': ld | last}) -%}{%- endif -%}
        {%- set tm = _ap_kv.get('tmout', []) | map('last') | map('trim') | select('match', '^\d+$') | map('int') | list -%}
        {#- no uncommented TMOUT anywhere: the shell never times out (0, fails) -#}
        {%- set _ = o.update({'tmout': (0 if ((tm | length) == 0 or 0 in tm) else (tm | max))}) -%}
        {%- set ia = _ap_kv.get('inactive', []) | map('last') | map('trim') | select('match', '^-?\d+$') | list -%}
        {%- if (ia | length) > 0 -%}{%- set _ = o.update({'inactive_days': (ia | last | int)}) -%}{%- endif -%}
      {%- endif -%}
      {{ {'pam': o} if (o | length) > 0 else {} }}

    # ── auditd file permissions (CIS 4.1.4.x) + service state (4.1.1.2) ────
    _audit_log: "{{ _fm.get(_fm._audit_log_file | default('-'), {}) }}"
    _audit_dir: "{{ _fm.get(_fm._audit_log_dir | default((_fm._audit_log_file | default('-')) | dirname), {}) }}"
    _auditd_extra: >-
      {%- set o = {} -%}
      {%- if 'mode' in _audit_log -%}{%- set _ = o.update({'log_permissions': {'mode': _audit_log.mode, 'pw_name': _audit_log.owner, 'gr_name': _audit_log.group}}) -%}{%- endif -%}
      {%- if 'mode' in _audit_dir -%}{%- set _ = o.update({'log_dir_permissions': {'mode': _audit_dir.mode, 'pw_name': _audit_dir.owner, 'gr_name': _audit_dir.group}}) -%}{%- endif -%}
      {%- if (_fm._audit_log_file is defined) and (_fm._auditcfg | length) > 0 -%}{%- set _ = o.update({'config_permissions': _fm._auditcfg}) -%}{%- endif -%}
      {{ {'auditd': o} if (o | length) > 0 else {} }}
    _svc_section: "{{ {'services': _svc} if (_svc | length > 0) else {} }}"

    # ── initial_setup extras (CIS 1.2.x, 1.7.x, 1.9) ───────────────────────
    # dnf defaults: a repo without enabled= is enabled; a repo without
    # gpgcheck= inherits [main]; [main] without gpgcheck= is NOT enabled.
    _initial_extra: >-
      {%- set o = {} -%}
      {%- for f, k in [('/etc/motd', 'motd'), ('/etc/issue', 'issue'), ('/etc/issue.net', 'issue_net')] if 'mode' in _fm.get(f, {}) -%}
        {%- set _ = o.update({k ~ '_mode': _fm[f].mode, k ~ '_owner': _fm[f].owner, k ~ '_group': _fm[f].group}) -%}
      {%- endfor -%}
      {%- set truthy = ['1', 'true', 'yes'] -%}
      {%- if (_ok_pt | bool) and ((_pt_kv.family | default([['']]))[-1][0] | trim) == 'rpm' -%}
        {%- set mg = ((_pt_kv.main_gpgcheck | default([['']]))[-1][0] | trim | lower) in truthy -%}
        {%- set enabled = [] -%}{%- set nogpg = [] -%}
        {%- for r in _pt_kv.get('repo', []) if (r | length) == 3 -%}
          {%- set en = r[1] | trim | lower -%}{%- set gc = r[2] | trim | lower -%}
          {%- if en == '' or en in truthy -%}
            {%- set _ = enabled.append(r[0]) -%}
            {%- if (gc == '' and not mg) or (gc != '' and gc not in truthy) -%}{%- set _ = nogpg.append(r[0]) -%}{%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set _ = o.update({'gpg_keys': (_pt_kv.get('gpgkey', []) | map('first') | list),
                              'enabled_repos': enabled, 'repos_without_gpgcheck': nogpg,
                              'global_gpgcheck_enabled': mg}) -%}
      {%- endif -%}
      {%- if (_crypto_policy | length) > 0 -%}{%- set _ = o.update({'crypto_policy': _crypto_policy}) -%}{%- endif -%}
      {{ {'initial_setup': o} if (o | length) > 0 else {} }}

    # ── cron file modes (CIS 5.1.2-5.1.9) ──────────────────────────────────
    _cron_extra: >-
      {%- set o = {} -%}
      {%- if (_fm._ok | bool) -%}
        {%- for f, k in [('/etc/crontab', 'crontab'), ('/etc/cron.hourly', 'cron_hourly'), ('/etc/cron.daily', 'cron_daily'), ('/etc/cron.weekly', 'cron_weekly'), ('/etc/cron.monthly', 'cron_monthly'), ('/etc/cron.d', 'cron_d')] if 'mode' in _fm.get(f, {}) -%}
          {%- set _ = o.update({k ~ '_mode': _fm[f].mode, k ~ '_owner': _fm[f].owner, k ~ '_group': _fm[f].group}) -%}
        {%- endfor -%}
        {%- for f, k in [('/etc/cron.allow', 'cron_allow'), ('/etc/cron.deny', 'cron_deny'), ('/etc/at.allow', 'at_allow'), ('/etc/at.deny', 'at_deny')] if f in _fm -%}
          {%- set _ = o.update({k ~ '_exists': ('mode' in _fm[f])}) -%}
          {%- if 'mode' in _fm[f] -%}{%- set _ = o.update({k ~ '_mode': _fm[f].mode, k ~ '_owner': _fm[f].owner, k ~ '_group': _fm[f].group}) -%}{%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {{ {'cron': o} if (o | length) > 0 else {} }}

    # ── storage_encryption (STIG RHEL-09-231xxx / 672xxx) ──────────────────
    # Data partitions = every mounted block filesystem except /boot and below.
    _storage: >-
      {%- set o = {'luks_volumes': [], 'unencrypted_data_partitions': [], 'crypttab_entries': [],
                   'crypttab_missing_devices': [], 'fstab_entries': [], 'fstab_unencrypted_data_mounts': []} -%}
      {%- set fips = ((_st_kv.fips | default([['']]))[-1][0] | trim) -%}
      {%- if fips in ['0', '1'] -%}{%- set _ = o.update({'fips_enabled': fips == '1'}) -%}{%- endif -%}
      {%- if (_crypto_policy | length) > 0 -%}{%- set _ = o.update({'crypto_policy': _crypto_policy}) -%}{%- endif -%}
      {%- for m in _st_kv.get('mnt', []) if (m | length) == 4 -%}
        {%- set data = not (m[1] == '/boot' or m[1].startswith('/boot/')) -%}
        {%- set enc = m[2] == 'yes' -%}
        {%- if data and not enc and m[0] not in o.unencrypted_data_partitions -%}{%- set _ = o.unencrypted_data_partitions.append(m[0]) -%}{%- endif -%}
      {%- endfor -%}
      {#- fstab fields come from the CONFIGURED entries (fstab| lines), never from
          the live mount's membership flag: an unmounted entry is listed, and the
          device and its encryption state are the configured one's. -#}
      {%- for f in _st_kv.get('fstab', []) if (f | length) == 4 -%}
        {%- set data = not (f[1] == '/boot' or f[1].startswith('/boot/')) -%}
        {%- set enc = f[2] == 'yes' -%}
        {%- set _ = o.fstab_entries.append({'device': f[0], 'mountpoint': f[1], 'encrypted': enc, 'device_present': (f[3] | trim) == 'yes'}) -%}
        {%- if data and not enc -%}{%- set _ = o.fstab_unencrypted_data_mounts.append({'device': f[0], 'mountpoint': f[1]}) -%}{%- endif -%}
      {%- endfor -%}
      {%- for v in _st_kv.get('luks', []) if (v | length) == 4 -%}
        {%- set _ = o.luks_volumes.append({'device': v[0], 'version': v[1], 'cipher': v[2], 'active_key_slots': (v[3] | trim).split(',') | reject('equalto', '') | list}) -%}
      {%- endfor -%}
      {%- for c in _st_kv.get('crypttab', []) if (c | length) >= 3 -%}
        {%- set _ = o.crypttab_entries.append({'name': c[0], 'device': c[1], 'options': ((c[2:] | join('|')) | trim).split(',') | reject('equalto', '') | list}) -%}
      {%- endfor -%}
      {%- for c in _st_kv.get('crypttab_missing', []) if (c | length) >= 2 -%}
        {%- set _ = o.crypttab_missing_devices.append({'name': c[0], 'device': (c[1:] | join('|'))}) -%}
      {%- endfor -%}
      {%- set sw = _st_kv.get('swap', []) | selectattr('1', 'defined') | list -%}
      {%- set _ = o.update({'swap_present': (sw | length) > 0}) -%}
      {%- if (sw | length) > 0 -%}{%- set _ = o.update({'swap_encrypted': (sw | map(attribute=1) | map('trim') | reject('equalto', 'yes') | list | length) == 0}) -%}{%- endif -%}
      {{ {'storage_encryption': o} if (_ok_st | bool) else {} }}

    # ── certificates (NIST SC-17 / IA-5), RPM family only ──────────────────
    _certificates: >-
      {%- set certs = [] -%}
      {%- for c in _cert_kv.get('cert', []) if (c | length) >= 6 -%}
        {%- set e = {'key_type': c[1], 'signature_algorithm': c[3], 'path': c[4], 'subject': (c[5:] | join('|'))} -%}
        {%- if c[0] is match('^-?\d+$') -%}{%- set _ = e.update({'days_until_expiry': (c[0] | int)}) -%}{%- endif -%}
        {%- if c[2] is match('^\d+$') -%}{%- set _ = e.update({'key_bits': (c[2] | int)}) -%}{%- endif -%}
        {%- set _ = certs.append(e) -%}
      {%- endfor -%}
      {%- set o = {'system_certs': certs,
                   'unexpected_cas': []} -%}
      {%- for c in _cert_kv.get('unexpected_ca', []) if (c | length) >= 2 -%}{%- set _ = o.unexpected_cas.append({'issuer': c[0], 'subject': (c[1:] | join('|'))}) -%}{%- endfor -%}
      {%- set ci = (_cert_kv.ca_bundle_intact | default([['']]))[-1][0] | trim -%}
      {%- if ci in ['yes', 'no'] -%}{%- set _ = o.update({'ca_bundle_intact': ci == 'yes'}) -%}{%- endif -%}
      {%- if (_crypto_policy | length) > 0 -%}{%- set _ = o.update({'crypto_policy': _crypto_policy}) -%}{%- endif -%}
      {{ {'certificates': o} if (_ok_cert | bool) else {} }}

    # ── authorized_keys (CIS 5.2 / STIG RHEL-09-255xxx) ────────────────────
    # ssh-keygen -lf prints "(RSA)" etc. and "no comment" for an empty one.
    _authorized_keys: >-
      {%- set tmap = {'RSA': 'ssh-rsa', 'ED25519': 'ssh-ed25519', 'DSA': 'ssh-dss', 'ED25519-SK': 'sk-ssh-ed25519@openssh.com', 'ECDSA-SK': 'sk-ecdsa-sha2-nistp256@openssh.com'} -%}
      {%- set keys = {} -%}
      {%- for k in _ak_kv.get('akkey', []) if (k | length) >= 5 -%}
        {%- set t = k[3] | trim -%}
        {%- set ty = tmap[t] if t in tmap else (('ecdsa-sha2-nistp' ~ k[1]) if t == 'ECDSA' else (t | lower)) -%}
        {%- set cm = (k[4:] | join('|')) | trim -%}
        {%- set e = {'type': ty, 'fingerprint': k[2], 'comment': ('' if cm == 'no comment' else cm)} -%}
        {%- if k[1] is match('^\d+$') -%}{%- set _ = e.update({'bits': (k[1] | int)}) -%}{%- endif -%}
        {%- set _ = keys.setdefault(k[0], []).append(e) -%}
      {%- endfor -%}
      {#- a file whose key list was capped (>100 keys or >1 MiB) keeps the keys
          read so far, is marked truncated, and carries a sentinel key with no
          comment, so the policy fails THAT file (IA-3: ownership cannot be
          determined); other files are unaffected -#}
      {%- set trunc_paths = _ak_kv.get('truncated', []) | selectattr('0', 'equalto', 'akkey') | map('last') | list -%}
      {%- set files = [] -%}
      {%- for f in _ak_kv.get('akfile', []) if (f | length) >= 4 -%}
        {%- set path = f[3:] | join('|') -%}
        {%- set e = {'path': path, 'user': f[0], 'expected_owner': f[0], 'owner': f[1], 'mode': f[2], 'keys': keys.get(path, []) | list} -%}
        {%- if path in trunc_paths -%}
          {%- set _ = e.update({'truncated': true, 'keys': e['keys'] + [{'type': 'unverified', 'fingerprint': 'TRUNCATED-key-list-not-fully-collected', 'comment': ''}]}) -%}
        {%- endif -%}
        {%- set _ = files.append(e) -%}
      {%- endfor -%}
      {%- set dirs = [] -%}
      {%- for d in _ak_kv.get('sshdir', []) if (d | length) >= 3 -%}{%- set _ = dirs.append({'user': d[0], 'mode': d[1], 'path': (d[2:] | join('|'))}) -%}{%- endfor -%}
      {{ {'authorized_keys': {'files': files, 'ssh_dirs': dirs}} if (_ok_ak | bool) else {} }}

    # ══ CIS RHEL 9 v3.0.0 sections (collector blocks of 2026-10-21) ════════
    # ── kernel modules (CIS 1.1.1.x, 3.2.x): available / disabled / loaded ──
    _v3_kmod: >-
      {%- set fsm = ['cramfs', 'freevxfs', 'hfs', 'hfsplus', 'jffs2', 'overlay', 'squashfs', 'udf', 'firewire-core', 'usb-storage'] -%}
      {%- set fs = [] -%}{%- set net = [] -%}
      {%- for k in _kmod_kv.get('kmod', []) if (k | length) == 4 -%}
        {#- compliant: kept for the v2-shaped consumers (AL2023, Rocky, Ubuntu)
            that read it; it is exactly the v3 "not available" test -#}
        {%- set e = {'module': k[0], 'available': k[1] == 'yes', 'disabled': k[2] == 'yes', 'loaded': (k[3] | trim) == 'yes',
                     'compliant': (k[1] == 'no' and (k[3] | trim) == 'no') or (k[2] == 'yes' and (k[3] | trim) == 'no')} -%}
        {%- set _ = (fs if k[0] in fsm else net).append(e) -%}
      {%- endfor -%}
      {#- CIS 3.1.2: driver modules of the wireless interfaces; a driver that
          could not be named is a module that cannot be shown unavailable -#}
      {%- set wl = [] -%}
      {%- for w in _kmod_kv.get('wmod', []) -%}
        {%- if (w | length) == 5 -%}
          {%- set _ = wl.append({'module': w[1], 'interface': w[0], 'available': w[2] == 'yes', 'disabled': w[3] == 'yes', 'loaded': (w[4] | trim) == 'yes'}) -%}
        {%- else -%}
          {%- set _ = wl.append({'module': 'unknown', 'interface': w[0], 'available': true, 'disabled': false, 'loaded': true}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'disabled_filesystem_modules': {'modules': fs,
            'all_compliant': ((fs | selectattr('available') | rejectattr('disabled') | list | length) == 0) and ((fs | selectattr('loaded') | list | length) == 0)},
          'disabled_network_modules': {'modules': net},
          'wireless_interfaces': {'modules': wl}} if (_ok_kmod | bool) else {} }}

    # ── kernel parameters (CIS 1.5.x, 3.3.x): running + persisted ──────────
    # persisted: the last assignment in systemd-sysctl order; a key set
    # nowhere is "unset", which fails the check (it is not missing evidence).
    _v3_sysctl: >-
      {%- set keys = ['fs.protected_hardlinks', 'fs.protected_symlinks', 'fs.suid_dumpable', 'kernel.dmesg_restrict', 'kernel.kptr_restrict',
                      'kernel.randomize_va_space', 'kernel.yama.ptrace_scope'] + _net_params + ['net.ipv4.conf.all.route_localnet', 'net.ipv4.conf.default.route_localnet'] -%}
      {%- set run = {} -%}{%- set per = {} -%}
      {%- for p in _sysctl_kv.get('run', []) if (p | length) >= 2 -%}{%- set _ = run.update({p[0]: (p[1:] | join('|') | trim)}) -%}{%- endfor -%}
      {%- for p in _sysctl_kv.get('persist', []) if (p | length) >= 2 -%}{%- set _ = per.update({p[0]: (p[1:] | join('|') | trim)}) -%}{%- endfor -%}
      {%- set analysis = [] -%}{%- set persisted = {} -%}
      {%- for k in keys | unique -%}
        {%- if k in run -%}{%- set _ = analysis.append({'parameter': k, 'current_value': run[k]}) -%}{%- endif -%}
        {%- set _ = persisted.update({k: per.get(k, 'unset')}) -%}
      {%- endfor -%}
      {{ {'sysctl_parameters': {'analysis': analysis, 'persisted': persisted, 'collected_count': (analysis | length)}} if (_ok_sysctl | bool) else {} }}

    # ── packages, versions and unit state (CIS 1.3.1.x, 2.x, 4.1.9, 5.3.1.x, 6.x)
    _v3_pkg_map: >-
      {%- set d = {} -%}
      {%- for p in _pkg_kv.get('pkg', []) if (p | length) == 2 -%}{%- set _ = d.update({p[0]: (p[1] | trim) == 'yes'}) -%}{%- endfor -%}
      {{ d if ((_ok_pkg | bool) and ((_pkg_kv.family | default([['']]))[-1][0] | trim) == 'rpm') else {} }}
    _v3_pkg: >-
      {%- set o = {} -%}
      {%- set pk = _v3_pkg_map -%}
      {%- if (pk | length) > 0 -%}
        {%- set _ = o.update({'packages': pk,
              'selinux': {'mcstrans_installed': pk.get('mcstrans', false), 'setroubleshoot_installed': pk.get('setroubleshoot', false)},
              'gui': {'environment_installed': (pk.get('gdm', false) or pk.get('gnome-shell', false) or pk.get('xorg-x11-server-Xorg', false) or pk.get('xorg-x11-server-common', false))},
              'chronyd': {'installed': pk.get('chrony', false)},
              'initial_setup': {'gdm_installed': pk.get('gdm', false)}}) -%}
        {%- set pv = {} -%}
        {%- for p in _pkg_kv.get('pkgver', []) if (p | length) == 2 -%}{%- set _ = pv.update({p[0]: (p[1] | trim)}) -%}{%- endfor -%}
        {%- set _ = o.update({'pam': {'package_versions': pv}}) -%}
      {%- endif -%}
      {%- if (_ok_pkg | bool) -%}
        {%- set dt = (_pkg_kv.default_target | default([['']]))[-1][0] | trim -%}
        {%- if dt != '' -%}{%- set _ = o.update({'gui': (o.get('gui', {}) | combine({'default_target': dt}))}) -%}{%- endif -%}
        {#- units service_facts did not report (sockets, not-found units);
            a unit service_facts reported keeps its service_facts record -#}
        {%- set units = {} -%}
        {%- for u in _pkg_kv.get('unit', []) if (u | length) == 4 and u[0] not in _svc -%}
          {%- set ls = u[1] | trim -%}{%- set as = u[2] | trim -%}{%- set fs = u[3] | trim -%}
          {%- set _ = units.update({u[0]: {'name': u[0], 'source': 'systemctl',
                'state': ('running' if (as == 'active' and u[0].endswith('.service')) else as),
                'status': (fs if fs != '' else ('not-found' if ls == 'not-found' else 'static'))}}) -%}
        {%- endfor -%}
        {%- if (units | length) > 0 -%}{%- set _ = o.update({'services': units}) -%}{%- endif -%}
      {%- endif -%}
      {{ o }}

    # ── configuration text and derived values (config block) ───────────────
    # txt|<tag>|<line>: the file's active lines; nofile|<tag>: no such file.
    _v3_txt: >-
      {%- set d = {} -%}
      {%- for p in _cfg_kv.get('txt', []) if (p | length) >= 2 -%}{%- set _ = d.setdefault(p[0], []).append(p[1:] | join('|')) -%}{%- endfor -%}
      {{ d }}
    _v3_nofile: "{{ _cfg_kv.get('nofile', []) | map('first') | map('trim') | list }}"
    _v3_cfg: >-
      {%- set o = {} -%}
      {%- if (_ok_cfg | bool) -%}
        {%- set one = {} -%}
        {%- for k in ['pq_module', 'authselect_profile', 'authselect_check', 'chrony_servers', 'chrony_pools', 'chrony_options', 'mta_probe', 'mta_inet', 'fw_backend', 'fw_log_denied', 'aide_conf'] if k in _cfg_kv -%}
          {%- set _ = one.update({k: (_cfg_kv[k][-1] | join('|') | trim)}) -%}
        {%- endfor -%}
        {%- set tx = _v3_txt -%}
        {%- set present = _cfg_kv.get('file', []) | map('first') | map('trim') | list -%}
        {#- crypto policy (CIS 1.6.x) -#}
        {%- set cp = {} -%}
        {%- if 'crypto_pol' in tx -%}{%- set _ = cp.update({'current_pol_raw': tx.crypto_pol | join('\n')}) -%}{%- endif -%}
        {%- if one.pq_module is defined -%}{%- set _ = cp.update({'pq_module_available': one.pq_module == 'yes'}) -%}{%- endif -%}
        {%- if (cp | length) > 0 -%}{%- set _ = o.update({'crypto_policy': cp}) -%}{%- endif -%}
        {%- if 'dnf' in tx -%}{%- set _ = o.update({'initial_setup': {'dnf_conf_raw': tx.dnf | join('\n')}}) -%}{%- endif -%}
        {#- PAM module configuration (CIS 5.3.x): an absent file is collected as a
            comment naming it, so the check reads "not met", not missing evidence -#}
        {%- set pam = {} -%}
        {%- for tag, key, path in [('faillock', 'faillock_conf_raw', '/etc/security/faillock.conf'), ('pwhistory', 'pwhistory_conf_raw', '/etc/security/pwhistory.conf')] -%}
          {%- if tag in tx -%}{%- set _ = pam.update({key: tx[tag] | join('\n')}) -%}
          {%- elif tag in present -%}{%- set _ = pam.update({key: '# ' ~ path ~ ': no active settings'}) -%}
          {%- elif tag in _v3_nofile -%}{%- set _ = pam.update({key: '# ' ~ path ~ ' not present'}) -%}{%- endif -%}
        {%- endfor -%}
        {%- if one.authselect_profile is defined -%}{%- set _ = pam.update({'authselect_profile': one.authselect_profile}) -%}{%- endif -%}
        {%- if one.authselect_check is defined -%}{%- set _ = pam.update({'authselect_check_valid': one.authselect_check == 'yes'}) -%}{%- endif -%}
        {%- if (pam | length) > 0 -%}{%- set _ = o.update({'pam': pam}) -%}{%- endif -%}
        {#- chrony (CIS 2.3.x) -#}
        {%- set ch = {} -%}
        {%- if (one.chrony_servers | default('x')) is match('^\d+$') -%}{%- set _ = ch.update({'servers_configured': one.chrony_servers | int}) -%}{%- endif -%}
        {%- if (one.chrony_pools | default('x')) is match('^\d+$') -%}{%- set _ = ch.update({'pools_configured': one.chrony_pools | int}) -%}{%- endif -%}
        {%- if one.chrony_options is defined -%}{%- set _ = ch.update({'sysconfig_options': one.chrony_options}) -%}{%- endif -%}
        {%- if (ch | length) > 0 -%}{%- set _ = o.update({'chronyd': ch}) -%}{%- endif -%}
        {#- MTA (CIS 2.1.19): mail-port listeners outside loopback -#}
        {%- if one.mta_probe | default('') == 'yes' -%}
          {%- set ls = _cfg_kv.get('mta_listen', []) | map('join', '|') | map('trim') | list -%}
          {%- set nl = ls | reject('match', '^(127\.|\[?::1\]?$|\[?::ffff:127\.|localhost)') | list -%}
          {%- set pk = _v3_pkg_map -%}
          {%- set m = {'non_loopback_listeners': nl,
                       'has_mta': ((ls | length) > 0) or pk.get('postfix', false) or pk.get('sendmail', false) or pk.get('exim', false) or (one.mta_inet is defined)} -%}
          {%- if one.mta_inet is defined -%}{%- set _ = m.update({'inet_interfaces': one.mta_inet}) -%}{%- endif -%}
          {%- set _ = o.update({'mta': m}) -%}
        {%- endif -%}
        {#- firewalld (CIS 4.1.x) -#}
        {%- set fw = {} -%}
        {%- if one.fw_backend is defined -%}{%- set _ = fw.update({'backend': one.fw_backend}) -%}{%- endif -%}
        {%- if one.fw_log_denied is defined -%}{%- set _ = fw.update({'log_denied': one.fw_log_denied}) -%}{%- endif -%}
        {%- set zones = [] -%}
        {%- for z in _cfg_kv.get('fwzone', []) if (z | length) == 6 -%}
          {%- set _ = zones.append({'name': z[0], 'target': z[1], 'permanent_target': z[2], 'icmp_block_inversion': (z[3] | trim) == 'yes',
                                    'icmp_blocks': (z[4] | trim).split() , 'interfaces': (z[5] | trim).split()}) -%}
        {%- endfor -%}
        {%- if (zones | length) > 0 -%}{%- set _ = fw.update({'zones': zones}) -%}{%- endif -%}
        {%- if (fw | length) > 0 -%}{%- set _ = o.update({'firewall': fw}) -%}{%- endif -%}
        {#- sudo / su (CIS 5.2.12): a pam_wheel group that exists and has no members -#}
        {%- if 'su_wheel' in _cfg_kv -%}
          {%- set sw = _cfg_kv.su_wheel[-1] -%}
          {%- set _ = o.update({'sudo': {'su_restricted': (sw | length) >= 2 and sw[0] != 'none' and (sw[1:] | join('|') | trim) == '0'}}) -%}
        {%- endif -%}
        {#- auditd (CIS 6.2.3.36) -#}
        {%- if 'augenrules' in tx -%}{%- set _ = o.update({'auditd': {'augenrules_check': tx.augenrules | join('\n')}}) -%}{%- endif -%}
        {#- AIDE (CIS 6.3.3 / 6.3.4): a tool listed twice keeps its WEAKEST line -#}
        {%- if one.aide_conf is defined -%}
          {%- set ao = {} -%}
          {%- for a in _cfg_kv.get('aideopt', []) if (a | length) >= 2 -%}
            {%- set v = a[1:] | join('|') | trim -%}
            {%- if a[0] not in ao or ((v.split('+') | length) < (ao[a[0]].split('+') | length)) -%}{%- set _ = ao.update({a[0]: v}) -%}{%- endif -%}
          {%- endfor -%}
          {%- set _ = o.update({'boot_security': {'aide_audit_tool_options': ao, 'aide_report_urls': (_cfg_kv.get('aide_report', []) | map('join', '|') | map('trim') | list)}}) -%}
        {%- endif -%}
        {#- GDM (CIS 1.8.x), only when gdm is installed: every occurrence of a
            key must hold the wanted value; "override allowed" = key not locked -#}
        {%- if _v3_pkg_map.get('gdm', false) -%}
          {%- set dv = {} -%}
          {%- for p in _cfg_kv.get('dconf', []) if (p | length) >= 2 -%}{%- set _ = dv.setdefault(p[0], []).append((p[1:] | join('|') | trim | lower).split() | last | default('')) -%}{%- endfor -%}
          {%- set locks = _cfg_kv.get('dlock', []) | map('join', '|') | map('trim') | list -%}
          {%- set gc = {} -%}
          {%- for p in _cfg_kv.get('gdmconf', []) if (p | length) >= 2 -%}{%- set _ = gc.update({p[0]: (p[1:] | join('|') | trim | lower)}) -%}{%- endfor -%}
          {%- set g = {
                'gdm_banner_configured': (dv.get('banner-message-enable', []) | length > 0) and (dv.get('banner-message-enable', []) | reject('equalto', 'true') | list | length == 0),
                'gdm_banner_override_allowed': '/org/gnome/login-screen/banner-message-enable' not in locks,
                'gdm_disable_user_list': (dv.get('disable-user-list', []) | length > 0) and (dv.get('disable-user-list', []) | reject('equalto', 'true') | list | length == 0),
                'gdm_disable_user_list_override_allowed': '/org/gnome/login-screen/disable-user-list' not in locks,
                'gdm_lock_override_allowed': ('/org/gnome/desktop/session/idle-delay' not in locks) or ('/org/gnome/desktop/screensaver/lock-delay' not in locks),
                'gdm_automount_disabled': (dv.get('automount', []) | length > 0) and (dv.get('automount', []) | reject('equalto', 'false') | list | length == 0),
                'gdm_automount_open_disabled': (dv.get('automount-open', []) | length > 0) and (dv.get('automount-open', []) | reject('equalto', 'false') | list | length == 0),
                'gdm_automount_override_allowed': ('/org/gnome/desktop/media-handling/automount' not in locks) or ('/org/gnome/desktop/media-handling/automount-open' not in locks),
                'gdm_autorun_never_enabled': (dv.get('autorun-never', []) | length > 0) and (dv.get('autorun-never', []) | reject('equalto', 'true') | list | length == 0),
                'gdm_autorun_override_allowed': '/org/gnome/desktop/media-handling/autorun-never' not in locks,
                'gdm_xdmcp_enabled': gc.get('xdmcp_enable', 'false') in ['true', '1', 'yes'],
                'gdm_wayland_disabled': gc.get('wayland_enable', 'true') in ['false', '0', 'no']} -%}
          {%- set idl = dv.get('idle-delay', []) | select('match', '^\d+$') | map('int') | list -%}
          {%- set lkd = dv.get('lock-delay', []) | select('match', '^\d+$') | map('int') | list -%}
          {#- idle-delay set in no system database: the screen never locks on an
              administrator setting, reported as 0 (fails 1.8.3); lock-delay
              unset is the GNOME default 0 -#}
          {%- set _ = g.update({'gdm_idle_delay': (0 if ((idl | length) == 0 or 0 in idl) else (idl | max))}) -%}
          {%- set _ = g.update({'gdm_lock_delay': ((lkd | max) if (lkd | length) > 0 else 0)}) -%}
          {%- set _ = o.update({'initial_setup': (o.get('initial_setup', {}) | combine(g))}) -%}
        {%- endif -%}
      {%- endif -%}
      {{ o }}

    # ── file modes (perms block): tag -> [{path, mode, owner, group}] ──────
    _v3_pf: >-
      {%- set d = {'_absent': {}} -%}
      {%- if (_ok_perms | bool) -%}
        {%- for p in _perms_kv.get('f', []) if (p | length) >= 5 -%}
          {%- set _ = d.setdefault(p[0], []).append({'mode': p[1], 'owner': p[2], 'group': p[3], 'path': (p[4:] | join('|'))}) -%}
        {%- endfor -%}
        {%- for p in _perms_kv.get('absent', []) if (p | length) >= 2 -%}
          {%- set _ = d._absent.setdefault(p[0], []).append(p[1:] | join('|')) -%}
        {%- endfor -%}
      {%- endif -%}
      {{ d }}
    _v3_perms: >-
      {%- set o = {} -%}
      {%- if (_ok_perms | bool) -%}
        {%- set pf = _v3_pf -%}{%- set tr = _perms_kv._trunc -%}
        {%- set st = {} -%}
        {#- SSH (CIS 5.1.1-5.1.4) -#}
        {%- set ssh = {'dropin_permissions': [], 'private_key_permissions': [], 'public_key_permissions': []} -%}
        {%- for f in pf.get('ssh_config', []) -%}{%- set _ = ssh.update({'config_permissions': {'mode': f.mode, 'pw_name': f.owner, 'gr_name': f.group}}) -%}{%- endfor -%}
        {%- for f in pf.get('ssh_dropin_dir', []) -%}{%- set _ = ssh.update({'dropin_dir_permissions': {'mode': f.mode, 'pw_name': f.owner, 'gr_name': f.group}}) -%}{%- endfor -%}
        {%- for f in pf.get('ssh_dropin', []) -%}{%- set _ = ssh.dropin_permissions.append({'path': f.path, 'mode': f.mode, 'pw_name': f.owner, 'gr_name': f.group}) -%}{%- endfor -%}
        {%- for f in pf.get('ssh_hostkey', []) -%}{%- set _ = ssh.private_key_permissions.append({'stat': {'path': f.path, 'mode': f.mode, 'pw_name': f.owner, 'gr_name': f.group}}) -%}{%- endfor -%}
        {%- for f in pf.get('ssh_hostpub', []) -%}{%- set _ = ssh.public_key_permissions.append({'path': f.path, 'mode': f.mode, 'pw_name': f.owner, 'gr_name': f.group}) -%}{%- endfor -%}
        {%- set _ = o.update({'ssh': ssh}) -%}
        {#- sudo (CIS 5.2.2, 5.2.3) -#}
        {%- set su = {'sudoers_d_files': (pf.get('sudoers_d', []) | list)} -%}
        {%- for f in pf.get('sudoers', []) -%}{%- set _ = su.update({'sudoers_mode': f.mode, 'sudoers_owner': f.owner, 'sudoers_group': f.group}) -%}{%- endfor -%}
        {%- for f in pf.get('sudoers_d_dir', []) -%}{%- set _ = su.update({'sudoers_d_dir': {'mode': f.mode, 'owner': f.owner, 'group': f.group}}) -%}{%- endfor -%}
        {%- set _ = o.update({'sudo': su}) -%}
        {#- critical files (CIS 7.1.1-7.1.10) -#}
        {%- set cf = [] -%}
        {%- for f in pf.get('critical', []) -%}{%- set _ = cf.append({'file': f.path, 'exists': true, 'actual_mode': f.mode, 'actual_owner': f.owner, 'actual_group': f.group}) -%}{%- endfor -%}
        {%- for p in pf._absent.get('critical', []) -%}{%- set _ = cf.append({'file': p, 'exists': false}) -%}{%- endfor -%}
        {%- set _ = o.update({'critical_files': {'analysis': cf}}) -%}
        {#- cron.yearly (CIS 2.4.1.7) -#}
        {%- for f in pf.get('cron_yearly', []) -%}{%- set _ = o.update({'cron': {'cron_yearly_exists': true, 'cron_yearly_mode': f.mode, 'cron_yearly_owner': f.owner, 'cron_yearly_group': f.group}}) -%}{%- endfor -%}
        {%- if (pf._absent.get('cron_yearly', []) | length) > 0 -%}{%- set _ = o.update({'cron': {'cron_yearly_exists': false}}) -%}{%- endif -%}
        {#- GRUB files (CIS 1.4.2), unless the list was capped -#}
        {%- if 'grub' not in tr -%}{%- set _ = o.update({'boot_security': {'grub_files': pf.get('grub', []) | list}}) -%}{%- endif -%}
        {#- rsyslog files (CIS 6.1.2.4-6.1.2.6) -#}
        {%- set rs = {} -%}
        {%- if (pf.get('rsyslog_conf', []) | length) > 0 -%}{%- set _ = rs.update({'config_files': pf.rsyslog_conf}) -%}{%- endif -%}
        {%- for f in pf.get('rsyslog_d', []) -%}{%- set _ = rs.update({'d_dir': {'mode': f.mode, 'owner': f.owner, 'group': f.group}}) -%}{%- endfor -%}
        {%- for f in pf.get('rsyslog_work', []) -%}{%- set _ = rs.update({'work_dir': {'mode': f.mode, 'owner': f.owner, 'group': f.group}}) -%}{%- endfor -%}
        {%- if (rs | length) > 0 -%}{%- set _ = o.update({'rsyslog': rs}) -%}{%- endif -%}
        {#- audit tools (CIS 6.2.4.8-6.2.4.10) -#}
        {%- set at = [] -%}
        {%- for f in pf.get('audit_tool', []) -%}{%- set _ = at.append({'stat': {'path': f.path, 'mode': f.mode, 'pw_name': f.owner, 'gr_name': f.group}}) -%}{%- endfor -%}
        {%- if (at | length) > 0 -%}{%- set _ = o.update({'auditd': {'tools_permissions': at}}) -%}{%- endif -%}
        {#- /var/log files (CIS 6.1.3.1), unless the sweep was capped -#}
        {%- if 'logf' not in tr -%}
          {%- set lf = [] -%}
          {%- for f in pf.get('logf', []) -%}{%- set _ = lf.append({'file': f.path, 'actual_mode': f.mode, 'actual_owner': f.owner, 'actual_group': f.group}) -%}{%- endfor -%}
          {%- set _ = o.update({'log_file_permissions': {'analysis': lf}}) -%}
        {%- endif -%}
      {%- endif -%}
      {{ o }}

    # ── accounts (CIS 5.4.x): shadow state and aging, shells, root umask/PATH
    _v3_acc: >-
      {%- set o = {} -%}
      {%- if (_ok_acc | bool) -%}
        {%- set one = {} -%}
        {%- for k in ['uid_min', 'encrypt_method', 'root_umask'] if k in _acc_kv -%}{%- set _ = one.update({k: (_acc_kv[k][-1] | join('|') | trim)}) -%}{%- endfor -%}
        {%- set sh = [] -%}{%- set state = {} -%}
        {%- for s in _acc_kv.get('sh', []) if (s | length) == 6 -%}
          {%- set e = {'user': s[0], 'has_password': s[1] == 'P', 'locked': s[1] == 'L'} -%}
          {%- for i, k in [(2, 'last_change'), (3, 'max_days'), (4, 'warn_days'), (5, 'inactive')] -%}
            {%- set _ = e.update({k: ((s[i] | trim | int) if ((s[i] | trim) is match('^-?\d+$')) else none)}) -%}
          {%- endfor -%}
          {%- set _ = sh.append(e) -%}{%- set _ = state.update({s[0]: s[1]}) -%}
        {%- endfor -%}
        {%- set shells = _acc_kv.get('shell', []) | map('join', '|') | map('trim') | list -%}
        {%- set valid = shells | reject('search', 'nologin') | list -%}
        {%- set ug = {'shadow_entries': sh, 'shells_content': (shells | join('\n'))} -%}
        {%- if 'root' in state -%}{%- set _ = ug.update({'root_password_status': {'P': 'PS', 'L': 'LK', 'NP': 'NP'}.get(state.root, state.root)}) -%}{%- endif -%}
        {%- if one.root_umask is defined -%}{%- set _ = ug.update({'root_umask': one.root_umask}) -%}{%- endif -%}
        {%- set pe = [] -%}
        {%- for p in _acc_kv.get('pathent', []) if (p | length) >= 3 -%}{%- set _ = pe.append({'owner': p[0], 'mode': p[1], 'path': (p[2:] | join('|'))}) -%}{%- endfor -%}
        {%- set _ = ug.update({'root_path_entries': pe}) -%}
        {%- set pam = {} -%}
        {%- if one.encrypt_method is defined -%}{%- set _ = pam.update({'encrypt_method': one.encrypt_method}) -%}{%- endif -%}
        {%- set _ = pam.update({'tmout_readonly_exported': ('tmout_ro' in _acc_kv) and ('tmout_export' in _acc_kv)}) -%}
        {#- with the passwd list of the user/group block: accounts below UID_MIN
            holding a valid login shell (5.4.2.7), and accounts without a valid
            shell whose password is not locked (5.4.2.8) -#}
        {%- if (_ok_ug | bool) and (shells | length) > 0 -%}
          {%- set umin = (one.uid_min | default('1000') | int) -%}
          {%- set sys_login = [] -%}{%- set unlocked = [] -%}
          {%- for p in _ug_kv.get('pw', []) if (p | length) >= 5 and (p[1] is match('^\d+$')) -%}
            {%- set shl = p[4:] | join('|') | trim -%}
            {%- if p[0] not in ['root', 'halt', 'sync', 'shutdown', 'nfsnobody'] and ((p[1] | int) < umin or (p[1] | int) == 65534) and shl in valid -%}{%- set _ = sys_login.append(p[0]) -%}{%- endif -%}
            {%- if p[0] != 'root' and shl not in valid and state.get(p[0], '') != 'L' -%}{%- set _ = unlocked.append(p[0]) -%}{%- endif -%}
          {%- endfor -%}
          {%- set _ = pam.update({'system_accounts_with_login_shell': sys_login}) -%}
          {%- set _ = ug.update({'unlocked_accounts_without_shell': unlocked}) -%}
        {%- endif -%}
        {#- user_group fields join the section only beside a usable user/group
            block: a forged or truncated passwd list must not leave a section -#}
        {%- set _ = o.update({'pam': pam}) -%}
        {%- if (_ok_ug | bool) -%}{%- set _ = o.update({'user_group': ug}) -%}{%- endif -%}
      {%- endif -%}
      {{ o }}

    # ── filesystem sweep (CIS 6.2.3.10, 7.1.11, 7.1.12) ────────────────────
    # A capped or incomplete list (truncated) keeps its count as a LOWER
    # bound: a known non-zero count is enough to fail, so it is emitted
    # (truncated: true); only "0 found, but the sweep was incomplete" is not
    # collected. The privileged-command list is checked item by item, so an
    # incomplete one carries a sentinel command no audit rule can match.
    _v3_sweep: >-
      {%- set o = {} -%}
      {%- if (_ok_sweep | bool) -%}
        {%- set tr = _sweep_kv._trunc -%}
        {%- set n = {} -%}{%- set cs = {} -%}
        {%- for c in _sweep_kv.get('count', []) if (c | length) == 2 and ((c[1] | trim) is match('^\d+$')) -%}{%- set _ = n.update({c[0]: (c[1] | trim | int)}) -%}{%- endfor -%}
        {%- for c in _sweep_kv.get('container_storage', []) if (c | length) == 2 and ((c[1] | trim) is match('^\d+$')) -%}{%- set _ = cs.update({c[0]: (c[1] | trim | int)}) -%}{%- endfor -%}
        {%- for tag, key in [('unowned', 'unowned_files'), ('ungrouped', 'ungrouped_files'), ('nosticky', 'sticky_bit')] if tag in n and (tag not in tr or n[tag] > 0) -%}
          {%- set files = _sweep_kv.get(tag, []) | map('join', '|') | list -%}
          {%- set e = ({'world_writable_without_sticky': files} if tag == 'nosticky' else {'files': files}) | combine({'count': n[tag], 'container_storage_count': cs.get(tag, 0)}) -%}
          {%- if tag in tr -%}{%- set _ = e.update({'truncated': true}) -%}{%- endif -%}
          {%- set _ = o.update({key: e}) -%}
        {%- endfor -%}
        {%- set pc = _sweep_kv.get('priv', []) | map('join', '|') | list -%}
        {%- if 'priv' in tr -%}{%- set pc = pc + ['TRUNCATED: privileged command list not fully collected'] -%}{%- endif -%}
        {%- set _ = o.update({'auditd': {'privileged_commands': pc}}) -%}
      {%- endif -%}
      {{ o }}
  set_fact:
    # recursive: the supplement sections extend pam / auditd / cron /
    # initial_setup rather than replacing them.
    opa_input: >-
      {{ _base | combine(_ssh, _pam, _auditd, _packages, _sudo, _selinux, _bootloader, _rsyslog, _journald,
                         _services, _initial, _fsmods, _mounts, _ww,
                         _boot_security, _network, _user_group, _pam_extra, _auditd_extra, _svc_section,
                         _initial_extra, _cron_extra, _storage, _certificates, _authorized_keys,
                         _v3_kmod, _v3_sysctl, _v3_pkg, _v3_cfg, _v3_perms, _v3_acc, _v3_sweep, _integrity, recursive=True) }}

- name: Append built input to the evaluation list (loop mode)
  set_fact:
    eval_inputs: "{{ (eval_inputs | default([])) + [{'m': m, 'input': opa_input}] }}"
  when: m is defined
