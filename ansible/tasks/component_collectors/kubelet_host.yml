---
# kubelet_host.yml — Kubernetes node (kubelet and kube-proxy), host side (layer 2).
#
# Collector contract: docs/reference/COMPONENT_COLLECTOR_CONTRACT.md.
# Receives lc_target, sets lc_result. Read-only. No cluster API call.
#
# Collects the kubelet flags and its configuration file (settings only), the
# mode and owner of the kubelet unit file, kubeconfig, client CA file,
# configuration file and configuration directory, and for kube-proxy whether
# it runs, its flags, its metrics bind address and the mode and owner of its
# kubeconfig. kube-proxy runs in a container: its files are read through the
# process's own root (/proc/<pid>/root), which needs root on the host.
#
# Not collected, on purpose: kubeconfig contents, certificates and keys.

- name: Kubelet | read process flags
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      for name in kubelet kube-proxy; do
        for c in /proc/[0-9]*/comm; do
          [ "$(cat "$c" 2>/dev/null)" = "$name" ] || continue
          printf 'PROC\t%s\t%s\n' "$name" "${c%/comm}"
          tr '\0' '\n' < "${c%/comm}/cmdline" 2>/dev/null | head -n 400 \
            | awk -v n="$name" '/^--/ {print "ARG\t" n "\t" substr($0, 1, 2000)}'
          break
        done
      done
      exit 0
  register: kubelet_proc
  changed_when: false

- name: Kubelet | parse process flags
  ansible.builtin.set_fact:
    kubelet_found: >-
      {%- set out = {} -%}
      {%- for l in kubelet_proc.stdout_lines if l.startswith('PROC\t') -%}
      {%- set p = l.split('\t') -%}
      {%- if p | length == 3 and p[2] is match('^/proc/[0-9]+$') -%}{%- set _ = out.update({p[1]: p[2]}) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
    kubelet_flags: >-
      {%- set out = {'kubelet': {}, 'kube-proxy': {}} -%}
      {%- for l in kubelet_proc.stdout_lines if l.startswith('ARG\t') -%}
      {%- set p = l.split('\t', 2) -%}
      {%- set a = p[2][2:] -%}
      {%- set k = a.split('=', 1)[0] -%}
      {%- set v = a.split('=', 1)[1] if '=' in a else 'true' -%}
      {%- set secret = (k is search('password|secret|token')) and not (k is search('(-file|-auth|-ttl|-dir|-path)$')) -%}
      {%- set _ = out[p[1]].update({k: ('<redacted>' if secret else v)}) -%}
      {%- endfor -%}
      {{ out }}

- name: Kubelet | read the kubelet configuration file
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      case "$CFG" in
        /var/lib/kubelet/*|/etc/kubernetes/*) ;;
        *) echo outside; exit 0 ;;
      esac
      case "$CFG" in *..*) echo outside; exit 0 ;; esac
      [ -f "$CFG" ] || { echo missing; exit 0; }
      echo ok
      head -c 262144 -- "$CFG" | base64 -w0
  environment:
    CFG: "{{ kubelet_flags.kubelet.config | default('') }}"
  when: kubelet_flags.kubelet.config | default('') | length > 0
  register: kubelet_cfg
  changed_when: false

- name: Kubelet | parse the kubelet configuration file
  ansible.builtin.set_fact:
    kubelet_config: >-
      {%- set lines = kubelet_cfg.stdout_lines | default([]) -%}
      {%- if lines | length == 2 and lines[0] == 'ok' -%}
      {%- set doc = lines[1] | b64decode | from_yaml -%}
      {{ doc if doc is mapping else {} }}
      {%- else -%}
      {{ {} }}
      {%- endif -%}
    kubelet_config_state: "{{ (kubelet_cfg.stdout_lines | default(['no --config flag']))[0] | default('failed') }}"

- name: Kubelet | read file modes and owners
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      st() { g="$1"; shift; for f in "$@"; do
        [ -n "$f" ] && [ -e "$f" ] && stat --printf "FILE\t$g\t%n\t%a\t%U\t%G\n" "$f"; done; }
      st kubelet_service /usr/lib/systemd/system/kubelet.service /etc/systemd/system/kubelet.service \
         /usr/lib/systemd/system/kubelet.service.d/*.conf /etc/systemd/system/kubelet.service.d/*.conf
      st kubelet_kubeconfig "${KUBECONFIG_PATH:-/etc/kubernetes/kubelet.conf}"
      st kubelet_client_ca "$CLIENT_CA"
      st kubelet_config_yaml "$CONFIG_PATH"
      if [ -n "$CONFIG_DIR" ] && [ -d "$CONFIG_DIR" ]; then
        find "${CONFIG_DIR%/}" -xdev -maxdepth 1 -printf 'FILE\tkubelet_config_dir\t%p\t%m\t%u\t%g\n' 2>/dev/null | head -n 200
      fi
      if [ -n "$PROXY_PROC" ] && [ -d "$PROXY_PROC/root" ]; then
        for f in "$PROXY_KUBECONFIG" /var/lib/kube-proxy/kubeconfig.conf; do
          [ -n "$f" ] && [ -e "$PROXY_PROC/root$f" ] || continue
          stat --printf "FILE\tkube_proxy_kubeconfig\t$f\t%a\t%U\t%G\n" "$PROXY_PROC/root$f"
          break
        done
        if [ -n "$PROXY_CONFIG" ] && [ -f "$PROXY_PROC/root$PROXY_CONFIG" ]; then
          printf 'PROXYCFG\tread\n'
          awk '$1 == "metricsBindAddress:" {gsub(/["\047]/, "", $2); print "PROXYCFG\tmetricsBindAddress\t" $2}' \
            "$PROXY_PROC/root$PROXY_CONFIG" | head -n 1
        fi
      fi
      exit 0
  environment:
    # Values read from the host are passed as data, never written into the script.
    KUBECONFIG_PATH: "{{ kubelet_flags.kubelet.kubeconfig | default('') }}"
    CLIENT_CA: >-
      {{ kubelet_flags.kubelet['client-ca-file']
         | default(((kubelet_config.authentication | default({})).x509 | default({})).clientCAFile | default(''), true) }}
    CONFIG_PATH: "{{ kubelet_flags.kubelet.config | default('') }}"
    CONFIG_DIR: "{{ kubelet_flags.kubelet['config-dir'] | default('') }}"
    PROXY_PROC: "{{ kubelet_found['kube-proxy'] | default('') }}"
    PROXY_KUBECONFIG: "{{ kubelet_flags['kube-proxy'].kubeconfig | default('') }}"
    PROXY_CONFIG: "{{ kubelet_flags['kube-proxy'].config | default('') }}"
  register: kubelet_files
  changed_when: false

- name: Kubelet | assemble the result
  ansible.builtin.set_fact:
    lc_result: >-
      {%- set files = {} -%}
      {%- set proxy_cfg = {} -%}
      {%- set proxy_cfg_read = [] -%}
      {%- for l in kubelet_files.stdout_lines -%}
      {%- set p = l.split('\t') -%}
      {%- if p[0] == 'FILE' and p | length == 6 -%}
      {%- set _ = files.update({p[1]: (files[p[1]] | default([])) + [{'path': p[2], 'mode': p[3], 'owner': p[4], 'group': p[5]}]}) -%}
      {%- elif p[0] == 'PROXYCFG' and p | length == 2 -%}
      {%- set _ = proxy_cfg_read.append(true) -%}
      {%- elif p[0] == 'PROXYCFG' and p | length == 3 -%}
      {%- set _ = proxy_cfg.update({p[1]: p[2]}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set proxy = {'running': 'kube-proxy' in kubelet_found} -%}
      {%- if proxy.running -%}
      {%- set _ = proxy.update({'flags': kubelet_flags['kube-proxy']}) -%}
      {%- if proxy_cfg_read -%}{%- set _ = proxy.update({'config': proxy_cfg}) -%}{%- endif -%}
      {%- endif -%}
      {%- set kubelet = {'flags': kubelet_flags.kubelet} -%}
      {%- if kubelet_config -%}{%- set _ = kubelet.update({'config': kubelet_config}) -%}{%- endif -%}
      {%- if 'kubelet' not in kubelet_found -%}
      {{ {'status': 'not_collected', 'reason': 'no running kubelet process found on this host'} }}
      {%- else -%}
      {{ {'status': 'collected',
          'facts': {'kubelet': kubelet, 'kube_proxy': proxy, 'files': files,
                    'collection': {'kubelet_config_file': kubelet_config_state}}} }}
      {%- endif -%}
