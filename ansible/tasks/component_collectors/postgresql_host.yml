---
# postgresql_host.yml — PostgreSQL server, host side (layer 2).
#
# Collector contract: docs/reference/COMPONENT_COLLECTOR_CONTRACT.md.
# Receives lc_target, sets lc_result. Read-only. Opens no database session.
#
# Finds the running postmaster, takes its data directory from the process
# (its working directory) and reads files through the process's own root, so a
# server in a container is read the same way as one on the host. Collects the
# settings in postgresql.conf and postgresql.auto.conf, the rules in
# pg_hba.conf, and the mode and owner of the data directory and those files.
#
# Not collected, on purpose: table data, role passwords, .pgpass, key files.
# Values of settings and pg_hba options that can hold a secret are replaced
# on the host, before anything leaves it. Files named by `include` directives
# are not followed; the result says so when one is present.

- name: PostgreSQL | read the postmaster, its files and its settings
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      main=""; others=0
      for c in /proc/[0-9]*/comm; do
        n="$(cat "$c" 2>/dev/null)"
        [ "$n" = postgres ] || [ "$n" = postmaster ] || continue
        d="${c%/comm}"
        ppid="$(awk '/^PPid:/ {print $2}' "$d/status" 2>/dev/null)"
        pn="$(cat "/proc/$ppid/comm" 2>/dev/null)"
        [ "$pn" = postgres ] || [ "$pn" = postmaster ] && continue
        if [ -z "$main" ]; then main="$d"; else others=$((others + 1)); fi
      done
      [ -n "$main" ] || { echo "NONE"; exit 0; }
      root="$main/root"
      data="$(readlink "$main/cwd" 2>/dev/null)"
      [ -n "$data" ] && [ -f "$root$data/PG_VERSION" ] || { printf 'NODATA\t%s\n' "$data"; exit 0; }
      conf="$(tr '\0' '\n' < "$main/cmdline" | sed -n 's/^config_file=//p' | head -n 1)"
      [ -n "$conf" ] || conf="$data/postgresql.conf"
      printf 'OTHERS\t%s\n' "$others"
      printf 'USER\t%s\n' "$(stat -c %U "$main" 2>/dev/null)"
      printf 'DATA\t%s\n' "$data"
      printf 'VERSION\t%s\n' "$(head -c 16 "$root$data/PG_VERSION" | head -n 1)"
      lines() {  # tag file: setting lines, comments removed, secrets replaced
        [ -f "$root$2" ] || return 0
        printf 'SOURCE\t%s\n' "$2"
        sed -E -e 's/^[[:space:]]+//' -e '/^(#|$)/d' "$root$2" | head -n 2000 | cut -c1-1000 \
          | sed -E "s/^([A-Za-z_.]*(passphrase|secret)[A-Za-z_.]*[[:space:]]*=?[[:space:]]*).*/\1'<redacted>'/" \
          | awk -v t="$1" '{print t "\t" $0}'
      }
      lines CONF "$conf"
      lines CONF "$data/postgresql.auto.conf"
      hba="$( { cat "$root$conf" "$root$data/postgresql.auto.conf"; } 2>/dev/null \
              | sed -n -E "s/^[[:space:]]*hba_file[[:space:]]*=?[[:space:]]*'?([^'#]*[^'# ]).*/\1/p" | tail -n 1)"
      [ -n "$hba" ] || hba="$data/pg_hba.conf"
      printf 'HBAFILE\t%s\n' "$hba"
      if [ -f "$root$hba" ]; then
        sed -E -e 's/^[[:space:]]+//' -e '/^(#|$)/d' -e 's/[[:space:]]+#.*$//' "$root$hba" | head -n 2000 | cut -c1-1000 \
          | sed -E 's/((ldapbindpasswd|radiussecrets?)=)("[^"]*"|[^[:space:]]+)/\1<redacted>/g' \
          | awk '{print "HBA\t" $0}'
      fi
      for f in "$data" "$conf" "$data/postgresql.auto.conf" "$hba"; do
        [ -e "$root$f" ] && stat --printf "FILE\t$f\t%a\t%U\t%G\n" "$root$f"
      done
      exit 0
  register: pg_raw
  changed_when: false

- name: PostgreSQL | assemble the result
  ansible.builtin.set_fact:
    lc_result: >-
      {%- set one = {} -%}
      {%- set settings = {} -%}
      {%- set sources = [] -%}
      {%- set hba = [] -%}
      {%- set files = [] -%}
      {%- set notes = [] -%}
      {%- for l in pg_raw.stdout_lines -%}
      {%- set p = l.split('\t', 1) -%}
      {%- if p | length < 2 -%}
      {%- elif p[0] in ['OTHERS', 'USER', 'DATA', 'VERSION', 'HBAFILE', 'NODATA'] -%}
      {%- set _ = one.update({p[0]: p[1]}) -%}
      {%- elif p[0] == 'SOURCE' -%}
      {%- set _ = sources.append(p[1]) -%}
      {%- elif p[0] == 'CONF' -%}
      {%- set m = p[1] | regex_search('^([A-Za-z_][A-Za-z0-9_.]*)\s*=?\s*(.*)$', '\\1', '\\2') -%}
      {%- if m -%}
      {%- if m[0] | lower in ['include', 'include_if_exists', 'include_dir'] -%}
      {%- set _ = notes.append('an ' ~ (m[0] | lower) ~ ' directive is present; included files were not read') -%}
      {%- else -%}
      {%- set v = m[1] | regex_replace('\s+#.*$', '') | trim -%}
      {%- set v = (v[1:-1] if (v | length >= 2 and v[0] == "'" and v[-1] == "'") else v) -%}
      {%- set _ = settings.update({m[0] | lower: v}) -%}
      {%- endif -%}
      {%- endif -%}
      {%- elif p[0] == 'HBA' -%}
      {%- set f = p[1].split() -%}
      {%- if f | length >= 3 and f[0] | lower in ['local'] -%}
      {%- set _ = hba.append({'type': f[0] | lower, 'database': f[1], 'user': f[2], 'address': '',
                               'method': f[3] | default(''), 'options': f[4:]}) -%}
      {%- elif f | length >= 5 -%}
      {%- set netmask = f[4] is match('^[0-9]+\.[0-9.]+$|^[0-9a-fA-F:]+$') and f | length >= 6 -%}
      {%- set _ = hba.append({'type': f[0] | lower, 'database': f[1], 'user': f[2],
                               'address': (f[3] ~ ' ' ~ f[4]) if netmask else f[3],
                               'method': f[5] if netmask else f[4],
                               'options': f[6:] if netmask else f[5:]}) -%}
      {%- else -%}
      {%- set _ = hba.append({'type': 'unparsed', 'line_fields': f | length}) -%}
      {%- endif -%}
      {%- elif p[0] == 'FILE' -%}
      {%- set f = p[1].split('\t') -%}
      {%- if f | length == 4 -%}
      {%- set _ = files.append({'path': f[0], 'mode': f[1], 'owner': f[2], 'group': f[3]}) -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if (one.OTHERS | default('0')) != '0' -%}
      {%- set _ = notes.append(one.OTHERS ~ ' more postmaster process(es) on this host were not collected') -%}
      {%- endif -%}
      {%- if 'NODATA' in one or (pg_raw.stdout_lines | select('match', '^NODATA') | list | length > 0) -%}
      {{ {'status': 'not_collected',
          'reason': 'a postmaster is running but its data directory could not be read: root on the host is needed'} }}
      {%- elif 'DATA' not in one -%}
      {{ {'status': 'not_collected', 'reason': 'no running postmaster found on this host'} }}
      {%- else -%}
      {{ {'status': 'collected',
          'instance': {'identity': ('host/' ~ lc_target.host ~ '/port/' ~ (settings.port | default('5432')))
                                   | regex_replace('[^A-Za-z0-9._:/@-]', '_'),
                       'name': 'PostgreSQL ' ~ (one.VERSION | default(''))},
          'facts': {'version': one.VERSION | default(''), 'data_directory': one.DATA,
                    'hba_file': one.HBAFILE | default(''), 'postmaster_user': one.USER | default(''),
                    'settings': settings, 'settings_sources': sources,
                    'hba_rules': hba, 'files': files},
          'notes': notes} }}
      {%- endif -%}
