---
# collect_linux_compliance_facts.yml — the ONE Linux compliance fact collector.
#
# Shared by collect_all_facts.yml (stores to compliance_facts) and by the
# direct assessment playbooks (cis_rhel9_assessment.yml), so both paths feed
# OPA the same facts. Carved out of collect_all_facts.yml on 2026-10-12 after
# the per-platform cis_*_assessment.yml playbooks were found to send an
# ansible_facts-only payload (1 of the 59 input sections the RHEL 9 modules
# read) and score 100% on it.
#
# Requires: gather_facts: yes and become: yes in the calling play.
# Sets:     combined_facts  ({schema_version, collection_timestamp,
#                             ansible_facts: {...}, custom_facts: {...}})
#           facts_checksum  (sha256 of combined_facts)
#
# Every task is read-only on the managed host (changed_when: false).

- name: Gather service facts (populates ansible_facts.services)
  ansible.builtin.service_facts:

- name: Gather SSH daemon effective configuration
  shell: sshd -T 2>/dev/null || cat /etc/ssh/sshd_config 2>/dev/null || echo ""
  register: sshd_config_raw
  changed_when: false
  failed_when: false

- name: Gather PAM password quality configuration
  shell: cat /etc/security/pwquality.conf 2>/dev/null || echo ""
  register: pwquality_raw
  changed_when: false
  failed_when: false

- name: Gather password aging policy from login.defs
  shell: >
    grep -E "^PASS_MAX_DAYS|^PASS_MIN_DAYS|^PASS_WARN_AGE|^PASS_MIN_LEN"
    /etc/login.defs 2>/dev/null || echo ""
  register: password_aging_raw
  changed_when: false
  failed_when: false

- name: Gather PAM common-password and system-auth configuration
  shell: |
    echo "=== common-password ===" && cat /etc/pam.d/common-password 2>/dev/null || true
    echo "=== system-auth ===" && cat /etc/pam.d/system-auth 2>/dev/null || true
    echo "=== password-auth ===" && cat /etc/pam.d/password-auth 2>/dev/null || true
  register: pam_config_raw
  changed_when: false
  failed_when: false

- name: Gather auditd rules
  shell: auditctl -l 2>/dev/null || cat /etc/audit/rules.d/*.rules 2>/dev/null || echo ""
  register: auditd_rules_raw
  changed_when: false
  failed_when: false

- name: Gather auditd daemon configuration
  shell: cat /etc/audit/auditd.conf 2>/dev/null || echo ""
  register: auditd_conf_raw
  changed_when: false
  failed_when: false

- name: Gather sudo configuration
  shell: cat /etc/sudoers 2>/dev/null || echo ""; cat /etc/sudoers.d/* 2>/dev/null || true
  register: sudoers_raw
  changed_when: false
  failed_when: false

- name: Gather disabled kernel modules
  shell: |
    for mod in cramfs freevxfs jffs2 hfs hfsplus squashfs udf usb-storage; do
      result=$(modprobe -n -v $mod 2>&1)
      if echo "$result" | grep -q "install /bin/true\|install /bin/false"; then
        echo "$mod:disabled"
      else
        echo "$mod:enabled"
      fi
    done
  register: kernel_modules_raw
  changed_when: false
  failed_when: false

- name: Gather filesystem mount options
  shell: findmnt -J 2>/dev/null || cat /proc/mounts 2>/dev/null || echo ""
  register: findmnt_raw
  changed_when: false
  failed_when: false

- name: Gather GRUB bootloader configuration
  shell: cat /etc/default/grub 2>/dev/null || echo ""
  register: grub_raw
  changed_when: false
  failed_when: false

- name: Gather system login banners
  shell: |
    for path in /etc/motd /etc/issue /etc/issue.net; do
      if [ -e "$path" ]; then
        echo "=== $path ==="
        cat "$path" 2>/dev/null || true
      fi
    done
  register: banners_raw
  changed_when: false
  failed_when: false

- name: Gather cron access controls
  shell: |
    echo "=== cron.allow ===" && cat /etc/cron.allow 2>/dev/null || echo "not_present"
    echo "=== cron.deny ===" && cat /etc/cron.deny 2>/dev/null || echo "not_present"
    echo "=== at.allow ===" && cat /etc/at.allow 2>/dev/null || echo "not_present"
  register: cron_access_raw
  changed_when: false
  failed_when: false

# The lists stay capped at 100 paths (stored-facts schema), but the cap is no
# longer silent: the last line is __count__|<true total>, or __count__|timeout
# when the sweep did not finish, and the payload carries the total and a
# truncated flag (see "Derive true totals" below).
- name: Gather world-writable files (first 100 + true total)
  shell: |
    timeout 80 find / -xdev -type f -perm -0002 2>/dev/null | awk 'NR <= 100 {print} END {print "__count__|" NR}'
    [ "${PIPESTATUS[0]}" = 124 ] && echo "__count__|timeout"
    true
  args:
    executable: /bin/bash
  register: world_writable_raw
  changed_when: false
  failed_when: false
  timeout: 90

- name: Gather SUID and SGID files (first 100 + true total)
  shell: |
    timeout 80 find / -xdev \( -perm -4000 -o -perm -2000 \) -type f 2>/dev/null | awk 'NR <= 100 {print} END {print "__count__|" NR}'
    [ "${PIPESTATUS[0]}" = 124 ] && echo "__count__|timeout"
    true
  args:
    executable: /bin/bash
  register: suid_files_raw
  changed_when: false
  failed_when: false
  timeout: 90

# total = null when unknown (sweep timed out or did not run); truncated = the
# list holds fewer paths than exist, or the total is unknown.
- name: Derive true totals for the capped world-writable and SUID/SGID sweeps
  set_fact:
    _ww_counts: "{{ world_writable_raw.stdout_lines | default([]) | select('match', '^__count__[|]') | map('regex_replace', '^__count__[|]', '') | list }}"
    _suid_counts: "{{ suid_files_raw.stdout_lines | default([]) | select('match', '^__count__[|]') | map('regex_replace', '^__count__[|]', '') | list }}"

- name: Gather user accounts with UID >= 1000 and root
  shell: |
    awk -F: '($3 == 0 || $3 >= 1000) {print $1":"$3":"$4":"$6":"$7}' /etc/passwd
  register: users_raw
  changed_when: false
  failed_when: false

- name: Gather firewall state
  shell: |
    if command -v firewall-cmd &>/dev/null; then
      echo "type:firewalld"
      firewall-cmd --state 2>/dev/null || echo "inactive"
      firewall-cmd --list-all 2>/dev/null || true
    elif command -v ufw &>/dev/null; then
      echo "type:ufw"
      ufw status verbose 2>/dev/null || echo "inactive"
    else
      echo "type:iptables"
      iptables -L -n 2>/dev/null | head -30 || echo "inactive"
    fi
  register: firewall_raw
  changed_when: false
  failed_when: false

- name: Gather SELinux / AppArmor status
  shell: |
    if command -v sestatus &>/dev/null; then
      echo "type:selinux" && sestatus 2>/dev/null
    elif command -v aa-status &>/dev/null; then
      echo "type:apparmor" && aa-status 2>/dev/null | head -20
    else
      echo "type:none"
    fi
  register: mac_status_raw
  changed_when: false
  failed_when: false

# Whole files plus the drop-in directories: rules and remote targets commonly
# live in /etc/rsyslog.d/*.conf and journald settings in journald.conf.d/.
# The previous `head -50` of rsyslog.conf alone made a host look unconfigured.
- name: Gather rsyslog / journald configuration
  shell: |
    echo "=== rsyslog ===" && cat /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null || echo ""
    echo "=== journald ===" && cat /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf 2>/dev/null || echo ""
  register: logging_raw
  changed_when: false
  failed_when: false

# ── CIS supplement (2026-10-19) ─────────────────────────────────────────────
# Each block below prints tagged lines and ends with "end:ok". The mapper
# (cis_linux_build_opa_input.yml) emits a section only when that marker is
# present, so a block that did not run, or a stored-facts row older than this
# change, is NOT ASSESSED rather than an empty object read as clean. Modes are
# printed four digits wide (%04a). No password hash, private key or GRUB
# password line ever leaves the host: only names, counts, modes and
# fingerprints.
#
# EVIDENCE INTEGRITY: a host-controlled string (file name, home, mount source,
# certificate subject, key comment, ...) is never printed raw if it contains a
# control character or '|' -- a newline there could forge a tagged line or a
# false "end:ok". Only the NAME is replaced, by unsafe:<16 hex of its sha256>;
# the record (mode, owner, ...) is printed as usual so the policy still judges
# the item, and an "unsafe_name|<tag>" line records the substitution. Names
# owned by unprivileged users are read NUL-delimited (find -print0), which needs
# bash: these blocks run under /bin/bash, not /bin/sh (dash on Ubuntu).
# Every block also: runs under LC_ALL=C; is killed by a 60 s watchdog (and the
# task by a 120 s Ansible timeout) before it can print end:ok; prints
# missing_cmd|<cmd> when a command it depends on is absent; never caps a list
# silently (truncated|<tag>); never reads a user-owned file through a symlink
# (symlink|<tag> is recorded with the link's own mode); and bounds every read
# of a user-owned file with head -c. The mapper treats missing_cmd and
# truncated as "not collected" -- never as an empty, passing list.

# Line format: stat|<mode>|<owner>|<group>|<path>  or  absent|<path>
- name: Gather mode and ownership of boot, banner, cron and audit files
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 60 s is killed before end:ok
    ( sleep 60; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    need stat
    s() { for p in "$@"; do
      if [ -e "$p" ]; then m=$(stat -c '%04a|%U|%G' "$p" 2>/dev/null) && echo "stat|$m|$(nm "$p" path)"; else echo "absent|$(nm "$p" path)"; fi
    done; }
    s /boot/grub2/grub.cfg /boot/grub/grub.cfg /boot/grub2/user.cfg
    s /etc/motd /etc/issue /etc/issue.net
    s /etc/crontab /etc/cron.hourly /etc/cron.daily /etc/cron.weekly /etc/cron.monthly /etc/cron.d
    s /etc/cron.allow /etc/cron.deny /etc/at.allow /etc/at.deny
    if [ -f /etc/audit/auditd.conf ]; then
      logf=$(awk -F'=' '/^[[:space:]]*log_file[[:space:]]*=/{gsub(/[[:space:]]/,"",$2); print $2}' /etc/audit/auditd.conf | tail -1)
      logf=${logf:-/var/log/audit/audit.log}
      echo "audit_log_file|$(nm "$logf" audit_log_file)"
      echo "audit_log_dir|$(nm "$(dirname "$logf")" audit_log_dir)"
      s "$logf" "$(dirname "$logf")"
      for f in /etc/audit/auditd.conf /etc/audit/audit.rules /etc/audit/rules.d/*.rules; do
        [ -e "$f" ] || continue
        m=$(stat -c '%04a|%U|%G' "$f" 2>/dev/null) && echo "auditcfg|$m|$(nm "$f" auditcfg)"
      done
    fi
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 120
  args:
    executable: /bin/bash
  register: file_modes_raw
  changed_when: false
  failed_when: false

# CIS 1.3-1.5. GRUB password lines are COUNTED, never printed.
- name: Gather AIDE, bootloader password, single-user auth and core dump state
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 60 s is killed before end:ok
    ( sleep 60; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    # "rpm -q rpm" succeeds only where the RPM database manages the system, so
    # a RHEL host that merely has dpkg installed (EPEL) is still queried via rpm.
    need sysctl systemctl stat
    pkg() { if rpm -q rpm >/dev/null 2>&1; then rpm -q "$1" >/dev/null 2>&1 && echo yes || echo no
            else dpkg-query -W -f='${Status}' "$1" 2>/dev/null | grep -q 'install ok installed' && echo yes || echo no; fi; }
    en() { [ "$(systemctl is-enabled "$1" 2>/dev/null)" = enabled ] && echo yes || echo no; }
    echo "pkg|aide|$(pkg aide)"; echo "pkg|prelink|$(pkg prelink)"; echo "pkg|abrt|$(pkg abrt)"
    if [ -e /var/lib/aide/aide.db.gz ] || [ -e /var/lib/aide/aide.db ]; then echo "aide_db|yes"; else echo "aide_db|no"; fi
    # Only root-OWNED, non-group/other-writable schedules count (crond rejects
    # the rest, and anyone able to write the file could forge a schedule), never
    # a crontab of another user, only an uncommented "aide --check|-C" command,
    # or Ubuntu's executable cron.daily/aide.
    ac=no
    for f in /etc/crontab /etc/cron.d/* /etc/cron.daily/* /etc/cron.weekly/* /var/spool/cron/root /var/spool/cron/crontabs/root; do
      [ -f "$f" ] && [ ! -L "$f" ] || continue
      [ "$(stat -c %u "$f" 2>/dev/null)" = 0 ] || continue
      # ... and not writable by group or others: anyone could edit it otherwise
      [ -z "$(find "$f" -maxdepth 0 -perm /022 2>/dev/null)" ] || continue
      case "$f" in /etc/cron.daily/*|/etc/cron.weekly/*) [ -x "$f" ] || continue
        case "${f##*/}" in aide|aide.sh|dailyaidecheck) ac=yes ;; esac ;; esac
      head -c 1048576 -- "$f" | grep -vE '^[[:space:]]*#' | grep -qE '(^|[[:space:]/])aide[[:space:]]+(--check|-C)([[:space:]]|$)' && ac=yes
    done
    echo "aide_cron|$ac"
    if [ "$(en aidecheck.timer)" = yes ] || [ "$(en dailyaidecheck.timer)" = yes ]; then echo "aide_timer|yes"; else echo "aide_timer|no"; fi
    gu=$(cat /boot/grub2/user.cfg /boot/efi/EFI/*/user.cfg 2>/dev/null | grep -E '^GRUB2_PASSWORD=')
    # RHEL's generated grub.cfg always carries "password_pbkdf2 root ${GRUB2_PASSWORD}"
    # (sourced from user.cfg); that template line is not a password and is excluded.
    gc=$(cat /boot/grub2/grub.cfg /boot/grub/grub.cfg 2>/dev/null | grep -E '^[[:space:]]*password(_pbkdf2)?[[:space:]]' | grep -vF '${GRUB2_PASSWORD}')
    echo "grub_pw_hashed|$(printf '%s\n%s\n' "$gu" "$gc" | grep -cE '^GRUB2_PASSWORD=grub\.pbkdf2\.|^[[:space:]]*password_pbkdf2[[:space:]]')"
    echo "grub_pw_plain|$(printf '%s\n%s\n' "$gu" "$gc" | grep -E '^GRUB2_PASSWORD=|^[[:space:]]*password[[:space:]]' | grep -cvF 'grub.pbkdf2.')"
    for u in rescue.service emergency.service; do
      if systemctl show -p ExecStart "$u" 2>/dev/null | grep -q sulogin; then echo "sulogin|$u|yes"; else echo "sulogin|$u|no"; fi
    done
    for k in fs.suid_dumpable kernel.randomize_va_space kernel.kptr_restrict kernel.dmesg_restrict; do
      v=$(sysctl -n "$k" 2>/dev/null) && echo "sysctl|$k|$v"
    done
    grep -hE '^[[:space:]]*\*[[:space:]]+hard[[:space:]]+core[[:space:]]+' /etc/security/limits.conf /etc/security/limits.d/*.conf 2>/dev/null | awk '{print "hard_core|"$4}'
    if [ -x /usr/lib/systemd/systemd-coredump ] || [ -x /lib/systemd/systemd-coredump ]; then
      echo "coredump_present|yes"
      # cat-config prints in precedence order: keep the last (effective) line per key
      systemd-analyze cat-config systemd/coredump.conf 2>/dev/null | grep -E '^[[:space:]]*(Storage|ProcessSizeMax)=' | sed 's/^[[:space:]]*/coredump|/; s/=/|/' | awk -F'|' '{v[$2]=$0} END{for (k in v) print v[k]}'
    else echo "coredump_present|no"; fi
    echo "enabled|abrtd|$(en abrtd.service)"; echo "enabled|kdump|$(en kdump.service)"
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 120
  args:
    executable: /bin/bash
  register: boot_raw
  changed_when: false
  failed_when: false

# CIS 3.x. Effective (running) kernel values, not sysctl.conf text. Only the
# all/default forms are printed; the mapper keeps an exact whitelist.
- name: Gather network kernel parameters, IPv6, wireless and firewall state
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 60 s is killed before end:ok
    ( sleep 60; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    need sysctl ip
    sysctl -a 2>/dev/null | grep -E '^net\.ipv(4|6)\.(conf\.(all|default)\.[a-z_]+|ip_forward|icmp_[a-z_]+|tcp_syncookies) = ' | sed 's/ = /|/; s/^/sysctl|/'
    if grep -qw 'ipv6.disable=1' /proc/cmdline 2>/dev/null; then echo "ipv6|disabled_kernel"
    elif [ ! -d /proc/sys/net/ipv6 ]; then echo "ipv6|disabled"
    else echo "ipv6|enabled"; fi
    echo "ipv6_addresses|$(ip -6 -o addr show 2>/dev/null | grep -c inet6)"
    for d in /sys/class/net/*; do [ -d "$d/wireless" ] && echo "wireless|$(basename "$d")"; done
    fw=none
    # ufw.service stays "active" while ufw itself is disabled; ask ufw instead.
    if systemctl is-active --quiet firewalld 2>/dev/null; then fw=firewalld
    elif systemctl is-active --quiet nftables 2>/dev/null; then fw=nftables
    elif command -v ufw >/dev/null 2>&1 && ufw status 2>/dev/null | grep -q '^Status: active'; then fw=ufw
    elif systemctl is-active --quiet iptables 2>/dev/null; then fw=iptables; fi
    echo "firewall|$fw"
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 120
  args:
    executable: /bin/bash
  register: network_raw
  changed_when: false
  failed_when: false

# CIS 6.2.x. /etc/shadow is read only for the NAMES of accounts with an empty
# password field and for legacy "+" entries; no hash leaves the host.
# Interactive users = UID >= 1000 (not 65534) or UID 0, with a shell other than
# nologin/false: root's home, dotfiles and .rhosts are judged like any other.
- name: Gather local user and group hygiene (names, homes, dotfiles, root PATH)
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 60 s is killed before end:ok
    ( sleep 60; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    need find stat
    # a reader that fails (file unreadable or missing) is reported as truncated|<file>:
    # the block is then "not collected" instead of an empty, passing list
    awk -F: '/\|/ {print "unsafe_name|pw"; gsub(/\|/, "%7C")} {print "pw|"$1"|"$3"|"$4"|"$6"|"$7} $2 != "x" {print "noshadow|"$1} /^\+/ {print "plus|passwd|"$1}' /etc/passwd 2>/dev/null | cap 5000 pw
    [ "${PIPESTATUS[0]}" -eq 0 ] || echo "truncated|pw"
    awk -F: '/\|/ {print "unsafe_name|group"; gsub(/\|/, "%7C")} {print "grp|"$1"|"$3} /^\+/ {print "plus|group|"$1}' /etc/group 2>/dev/null | cap 5000 group
    [ "${PIPESTATUS[0]}" -eq 0 ] || echo "truncated|group"
    awk -F: '$1 ~ /\|/ {print "unsafe_name|shadow"; gsub(/\|/, "%7C", $1)} $2 == "" {print "emptypw|"$1} /^\+/ {print "plus|shadow|"$1}' /etc/shadow 2>/dev/null | cap 5000 shadow
    [ "${PIPESTATUS[0]}" -eq 0 ] || echo "truncated|shadow"
    # the login PATH of root: a failed or timed-out probe (or an empty PATH, which no
    # login shell yields) is truncated|root_path, never an empty, passing PATH
    if rp=$(timeout 10 env -i HOME=/root bash -lc 'printf "%s" "$PATH"' 2>/dev/null) && [ -n "$rp" ]; then
      echo "root_path|$(nm "$rp" root_path)"
    else echo "truncated|root_path"; rp=""; fi
    IFS=: read -r -d '' -a dirs < <(printf '%s' "$rp")
    for d in "${dirs[@]}"; do
      [ -z "$d" ] && continue
      if [ -d "$d" ]; then
        # -H: the directory a symlink points to (usr-merge: /bin -> usr/bin), not the 0777 link
        if [ -n "$(find -H "$d" -maxdepth 0 -perm -0002 2>/dev/null)" ]; then ww=yes; else ww=no; fi
        echo "pathdir|$(nm "$d" pathdir)|yes|$ww"
      else echo "pathdir|$(nm "$d" pathdir)|no|no"; fi
    done
    awk -F: '(($3 >= 1000 || $3 == 0) && $3 != 65534 && $7 !~ /(nologin|false)$/) {print $1":"$6}' /etc/passwd 2>/dev/null | cap 1000 home | while IFS=: read -r u h; do
      if [ "$u" = "truncated|home" ]; then echo "$u"; continue; fi
      su=$(nm "$u" home); sh=$(nm "$h" home)
      if [ ! -d "$h" ]; then echo "home|$su|$sh|no|||"; continue; fi
      if [ -n "$(find -H "$h" -maxdepth 0 -perm /027 2>/dev/null)" ]; then wide=yes; else wide=no; fi
      echo "home|$su|$sh|yes|$(stat -L -c '%U|%04a' "$h" 2>/dev/null)|$wide"
      for f in .netrc .forward .rhosts; do { [ -e "$h/$f" ] || [ -L "$h/$f" ]; } && echo "dot${f#.}|$su|$(nm "$h/$f" dotfile)"; done
      # names here are user-controlled: NUL-delimited; an unsafe name is
      # replaced by its placeholder and the record is still reported
      # (-type f never matches a symlink; stat reads metadata only)
      timeout 30 find "$h" -maxdepth 1 -type f -name '.*' -perm /022 -print0 2>/dev/null | {
        n=0
        while IFS= read -r -d '' f; do
          n=$((n + 1)); if [ "$n" -gt 50 ]; then echo "truncated|dotww|$su"; break; fi
          echo "dotww|$su|$(stat -c '%04a' "$f" 2>/dev/null)|$(nm "$f" dotww)"
        done; }
      # find failed or hit its 30 s timeout: the list is not the whole truth
      [ "${PIPESTATUS[0]}" -eq 0 ] || echo "truncated|dotww|$su"
    done
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 120
  args:
    executable: /bin/bash
  register: user_group_raw
  changed_when: false
  failed_when: false

# CIS 5.5.1.4, 5.5.4, 5.5.5. Every UNCOMMENTED setting is printed with its file;
