# CIS 1.2.x / 1.9. RPM family only: repo files are parsed (no dnf call, so no
# metadata refresh over the network). Raw enabled/gpgcheck values are printed
# as written (empty = not set); the mapper applies dnf's defaults.
- name: Gather package signing keys, repositories, global gpgcheck and crypto policy
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 60 s is killed before end:ok
    ( sleep 60; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    if rpm -q rpm >/dev/null 2>&1; then
      echo "family|rpm"
      rpm -q gpg-pubkey --qf 'gpgkey|%{NAME}-%{VERSION}-%{RELEASE}\n' 2>/dev/null | grep -E '^gpgkey\|gpg-pubkey-[0-9a-f]+-[0-9a-f]+$' | cap 200 gpgkey
      awk 'FNR==1{sec=""} /^[[:space:]]*\[.*\][[:space:]]*$/{gsub(/[][[:space:]]/,""); sec=$0; seen[sec]=1; next}
           sec!="" && /^[[:space:]]*enabled[[:space:]]*=/{v=$0; sub(/^[^=]*=[[:space:]]*/,"",v); sub(/[[:space:]]+$/,"",v); en[sec]=v}
           sec!="" && /^[[:space:]]*gpgcheck[[:space:]]*=/{v=$0; sub(/^[^=]*=[[:space:]]*/,"",v); sub(/[[:space:]]+$/,"",v); gc[sec]=v}
           END{for (s in seen) { id = s; e = en[s]; g = gc[s]; if ((id e g) ~ /\|/) { print "unsafe_name|repo"; gsub(/\|/, "%7C", id); gsub(/\|/, "%7C", e); gsub(/\|/, "%7C", g) } print "repo|"id"|"e"|"g }}' /etc/yum.repos.d/*.repo 2>/dev/null | cap 1000 repo
      awk '/^[[:space:]]*\[/{m=($0 ~ /\[main\]/); next} m && /^[[:space:]]*gpgcheck[[:space:]]*=/{v=$0; sub(/^[^=]*=[[:space:]]*/,"",v); sub(/[[:space:]]+$/,"",v); print "main_gpgcheck|"v}' /etc/dnf/dnf.conf 2>/dev/null
    else
      echo "family|other"
    fi
    cp=$(update-crypto-policies --show 2>/dev/null) && echo "crypto_policy|$cp"
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 120
  args:
    executable: /bin/bash
  register: pkg_trust_raw
  changed_when: false
  failed_when: false

# Storage encryption (STIG RHEL-09-231xxx / NIST SC-28). "encrypted" means a
# dm-crypt layer (lsblk TYPE crypt) somewhere under the device; nothing else
# counts. Every mounted block filesystem is listed; the mapper excludes /boot.
- name: Gather FIPS mode, LUKS volumes, crypttab, mounted filesystems and swap encryption
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 60 s is killed before end:ok
    ( sleep 60; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    need findmnt lsblk swapon
    enc() { lsblk -nso TYPE "$1" 2>/dev/null | grep -qx crypt && echo yes || echo no; }
    echo "fips|$(cat /proc/sys/crypto/fips_enabled 2>/dev/null)"
    findmnt -rn -o SOURCE,TARGET -t xfs,ext4,ext3,ext2,btrfs 2>/dev/null | cap 500 mnt | while read -r src tgt; do
      if [ "$src" = "truncated|mnt" ]; then echo "$src"; continue; fi
      src=${src%%\[*}
      if findmnt --fstab -rn -o TARGET 2>/dev/null | grep -qxF "$tgt"; then inf=yes; else inf=no; fi
      echo "mnt|$(nm "$src" mnt)|$(nm "$tgt" mnt)|$(enc "$src")|$inf"
    done
    # fstab as CONFIGURED (what the next boot mounts), separate from the live
    # mounts: source resolved from its UUID/LABEL (-e), target, encryption of
    # that device, and whether the device exists now. An unmounted entry is
    # listed; a live mount absent from fstab is not. A failed read of fstab
    # invalidates the block.
    findmnt --fstab -e -rn -o SOURCE,TARGET -t xfs,ext4,ext3,ext2,btrfs 2>/dev/null | cap 500 fstab | while read -r src tgt; do
      if [ "$src" = "truncated|fstab" ]; then echo "$src"; continue; fi
      if [ -e "$src" ]; then pr=yes; e=$(enc "$src"); else pr=no; e=no; fi
      echo "fstab|$(nm "$src" fstab)|$(nm "$tgt" fstab)|$e|$pr"
    done
    [ "${PIPESTATUS[0]}" -eq 0 ] || echo "truncated|fstab"
    lsblk -nrpo NAME,FSTYPE 2>/dev/null | awk '$2=="crypto_LUKS"{print $1}' | cap 100 luks | while read -r dev; do
      if [ "$dev" = "truncated|luks" ]; then echo "$dev"; continue; fi
      need cryptsetup || continue
      d=$(nm "$dev" luks)
      # a failed or timed-out luksDump is truncated|luks|<device>: the block is
      # then "not collected", never a volume with empty cipher and no key slots
      dump=$(timeout 20 cryptsetup luksDump "$dev" 2>/dev/null) || { echo "truncated|luks|$d"; continue; }
      printf '%s\n' "$dump" | awk -v d="$d" '
        /^Version:/ {ver=$2}
        /^Cipher name:/ {cn=$3} /^Cipher mode:/ {cm=$3}
        /^Key Slot [0-7]: ENABLED/ {sub(":","",$3); sl=sl (sl==""?"":",") $3}
        /^Keyslots:/ {ks=1; next} /^[A-Z]/ {ks=0}
        ks && /^  [0-9]+: / {s=$1; sub(":","",s); sl=sl (sl==""?"":",") s}
        /^[[:space:]]+cipher:/ && c2=="" {c2=$2}
        END {c=(c2!=""?c2:(cn!=""?cn"-"cm:"")); print "luks|"d"|"ver"|"c"|"sl}'
    done
    if [ -f /etc/crypttab ]; then
      grep -vE '^[[:space:]]*(#|$)' /etc/crypttab | cap 200 crypttab | while read -r name dev _key opts; do
        if [ "$name" = "truncated|crypttab" ]; then echo "$name"; continue; fi
        echo "crypttab|$(nm "$name" crypttab)|$(nm "$dev" crypttab)|$(nm "$opts" crypttab)"
        case "$dev" in
          UUID=*) p="/dev/disk/by-uuid/${dev#UUID=}" ;;
          PARTUUID=*) p="/dev/disk/by-partuuid/${dev#PARTUUID=}" ;;
          LABEL=*) p="/dev/disk/by-label/${dev#LABEL=}" ;;
          *) p="$dev" ;;
        esac
        [ -e "$p" ] || echo "crypttab_missing|$(nm "$name" crypttab)|$(nm "$dev" crypttab)"
      done
    fi
    swapon --show=NAME --noheadings 2>/dev/null | while read -r sw; do
      if [ -b "$sw" ]; then b="$sw"; else b=$(findmnt -nro SOURCE -T "$sw" 2>/dev/null); b=${b%%\[*}; fi
      echo "swap|$(nm "$sw" swap)|$(enc "$b")"
    done
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 120
  args:
    executable: /bin/bash
  register: storage_raw
  changed_when: false
  failed_when: false

# Certificates (NIST SC-17 / IA-5). RPM family only (/etc/pki layout). System
# certs = regular .crt/.pem files in /etc/pki/tls/certs (the CA bundles there
# are symlinks and are skipped). Local trust anchors not owned by any package
# are reported as unexpected CAs. Free-text fields (subject) are printed last.
- name: Gather service certificate expiry and strength, local CA anchors and CA bundle integrity
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 60 s is killed before end:ok
    ( sleep 60; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    if [ ! -d /etc/pki/tls/certs ] || ! rpm -q rpm >/dev/null 2>&1; then kill "$wd" 2>/dev/null; echo "end:skipped"; exit 0; fi
    # without openssl nothing can be judged, and without find nothing is
    # enumerated: missing_cmd, and no end:ok
    need openssl find || { kill "$wd" 2>/dev/null; echo "end:skipped"; exit 0; }
    now=$(date +%s)
    # a file openssl cannot parse is reported as an unparsable item (no expiry),
    # which the policy flags as evidence missing -- never skipped
    n=0
    while IFS= read -r -d '' f; do
      n=$((n + 1)); if [ "$n" -gt 200 ]; then echo "truncated|cert"; break; fi
      sf=$(nm "$f" cert)
      t=$(timeout 10 openssl x509 -in "$f" -noout -text 2>/dev/null) || { echo "cert|unparsable|unparsable||unparsable|$sf|$sf"; continue; }
      end=$(date -d "$(timeout 10 openssl x509 -in "$f" -noout -enddate 2>/dev/null | cut -d= -f2)" +%s 2>/dev/null) || { echo "cert|unparsable|unparsable||unparsable|$sf|$sf"; continue; }
      days=$(( (end - now) / 86400 )); [ "$end" -lt "$now" ] && [ "$days" -eq 0 ] && days=-1
      alg=$(printf '%s\n' "$t" | awk -F': ' '/Public Key Algorithm:/{print $2; exit}')
      case "$alg" in rsaEncryption) kt=RSA ;; id-ecPublicKey) kt=EC ;; dsaEncryption) kt=DSA ;; *) kt=$alg ;; esac
      bits=$(printf '%s\n' "$t" | sed -n 's/.*Public-Key: (\([0-9]*\) bit).*/\1/p' | head -1)
      sig=$(printf '%s\n' "$t" | awk -F': ' '/Signature Algorithm:/{print $2; exit}')
      subj=$(openssl x509 -in "$f" -noout -subject -nameopt RFC2253 2>/dev/null | sed 's/^subject=//')
      case "$bits" in *[!0-9]*) bits="" ;; esac
      echo "cert|$days|$(nm "$kt" cert)|$bits|$(nm "$sig" cert)|$sf|$(nm "$subj" cert)"
    done < <(find /etc/pki/tls/certs -maxdepth 1 -type f \( -name '*.crt' -o -name '*.pem' \) -print0 2>/dev/null)
    for f in /etc/pki/ca-trust/source/anchors/*; do
      [ -f "$f" ] || continue
      rpm -qf "$f" >/dev/null 2>&1 && continue
      iss=$(openssl x509 -in "$f" -noout -issuer -nameopt RFC2253 2>/dev/null | sed 's/^issuer=//')
      subj=$(openssl x509 -in "$f" -noout -subject -nameopt RFC2253 2>/dev/null | sed 's/^subject=//')
      echo "unexpected_ca|$(nm "$iss" unexpected_ca)|$(nm "$subj" unexpected_ca)"
    done
    if [ -z "$(rpm -V ca-certificates 2>&1)" ]; then echo "ca_bundle_intact|yes"; else echo "ca_bundle_intact|no"; fi
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 120
  args:
    executable: /bin/bash
  register: certs_raw
  changed_when: false
  failed_when: false

# SSH authorized keys (CIS 5.2 / STIG RHEL-09-255xxx). Keys are reported as
# `ssh-keygen -lf` fingerprints (bits, SHA256, comment, type); the key material
# itself never leaves the host. Default AuthorizedKeysFile locations only.
- name: Gather .ssh directory modes and authorized_keys fingerprints
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 60 s is killed before end:ok
    ( sleep 60; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    need ssh-keygen stat
    awk -F: '{print $1":"$6}' /etc/passwd 2>/dev/null | cap 5000 akuser | while IFS=: read -r u h; do
      if [ "$u" = "truncated|akuser" ]; then echo "$u"; continue; fi
      [ -n "$h" ] || continue
      d="$h/.ssh"; su=$(nm "$u" akfile); sd=$(nm "$d" akfile)
      # symlinks are never followed: the link's own mode (0777) is the record
      if [ -L "$d" ]; then echo "symlink|sshdir|$sd"; m=$(stat -c '%04a' "$d" 2>/dev/null) && echo "sshdir|$su|$m|$sd"; continue; fi
      [ -d "$d" ] || continue
      m=$(stat -c '%04a' "$d" 2>/dev/null) && echo "sshdir|$su|$m|$sd"
      for f in "$d/authorized_keys" "$d/authorized_keys2"; do
        [ -e "$f" ] || [ -L "$f" ] || continue
        sf=$(nm "$f" akfile)
        if [ -L "$f" ]; then echo "symlink|akfile|$sf"; m=$(stat -c '%U|%04a' "$f" 2>/dev/null) && echo "akfile|$su|$m|$sf"; continue; fi
        [ -f "$f" ] || continue
        m=$(stat -c '%U|%04a' "$f" 2>/dev/null) && echo "akfile|$su|$m|$sf"
        sz=$(stat -c '%s' "$f" 2>/dev/null); [ "${sz:-0}" -gt 1048576 ] && echo "truncated|akkey|$sf"
        # stdin, not the path: "ssh-keygen -lf FILE" stops at a non-key first
        # line (e.g. "PRIVATE KEY") and would hide every key after it
        # "<bits> <fingerprint> <comment ...> (<TYPE>)"; the comment is user text
        head -c 1048576 -- "$f" | timeout 30 ssh-keygen -lf - 2>/dev/null | {
          n=0
          while IFS= read -r line; do
            n=$((n + 1)); if [ "$n" -gt 100 ]; then echo "truncated|akkey|$sf"; break; fi
            bits=${line%% *}; rest=${line#* }; fp=${rest%% *}; rest=${rest#* }
            t=${rest##* }; t=${t#(}; t=${t%)}; c=${rest% *}; [ "$c" = "$rest" ] && c=""
            echo "akkey|$sf|$(nm "$bits" akkey)|$(nm "$fp" akkey)|$(nm "$t" akkey)|$(nm "$c" akkey)"
          done; }
        # head could not read the file, or ssh-keygen hit its 30 s timeout (124):
        # the key list is not the whole truth. ssh-keygen's own non-zero exit on a
        # file holding no keys is not a failure.
        hs=${PIPESTATUS[0]}; ks=${PIPESTATUS[1]}
        if [ "$hs" -ne 0 ] || [ "$ks" -eq 124 ]; then echo "truncated|akkey|$sf"; fi
      done
    done
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 120
  args:
    executable: /bin/bash
  register: authorized_keys_raw
  changed_when: false
  failed_when: false

# ── CIS RHEL 9 v3.0.0 supplement (2026-10-21) ──────────────────────────────
# Same contract as the blocks above (tagged lines, end:ok last, LC_ALL=C,
# watchdog, missing_cmd / truncated never read as a pass). Every list of names
# below is a fixed literal in this file; no host string is ever passed to a
# shell unquoted.

# CIS 1.1.1.x / 3.2.x. Per module: available (modinfo finds it for the running
# kernel), disabled (an "install <mod> /bin/false|/bin/true" line AND a
# "blacklist <mod>" line in the effective modprobe configuration) and loaded
# (/sys/module/<mod> exists, which also covers a built-in module).
# Line format: kmod|<module>|<available yes/no>|<disabled yes/no>|<loaded yes/no>
- name: Gather kernel module availability, deny-listing and load state
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 60 s is killed before end:ok
    ( sleep 60; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    need modprobe modinfo
    # an empty effective configuration means the read failed: not collected
    cfg=$(modprobe --showconfig 2>/dev/null | tr '-' '_')
    [ -n "$cfg" ] || echo "truncated|showconfig"
    # no module tree for the running kernel (a container, a broken install):
    # modinfo would call every module unavailable, so nothing is collected
    [ -d "/lib/modules/$(uname -r)" ] || echo "truncated|modules_dir"
    for m in cramfs freevxfs hfs hfsplus jffs2 overlay squashfs udf firewire-core usb-storage dccp tipc rds sctp atm can; do
      u=${m//-/_}
      if modinfo -n "$m" >/dev/null 2>&1; then av=yes; else av=no; fi
      if printf '%s\n' "$cfg" | grep -qE "^install[[:space:]]+$u[[:space:]]+(/usr)?/bin/(false|true)([[:space:]]|$)" \
         && printf '%s\n' "$cfg" | grep -qE "^blacklist[[:space:]]+$u([[:space:]]|$)"; then dis=yes; else dis=no; fi
      if [ -d "/sys/module/$u" ]; then ld=yes; else ld=no; fi
      echo "kmod|$m|$av|$dis|$ld"
    done
    # CIS 3.1.2: the driver module of every wireless interface, same three facts.
    # Only a plain module name is used (it goes into a grep pattern).
    for d in /sys/class/net/*; do
      [ -d "$d/wireless" ] || [ -d "$d/phy80211" ] || continue
      i=$(nm "$(basename "$d")" wmod)
      w=$(basename "$(readlink -f "$d/device/driver/module" 2>/dev/null)" 2>/dev/null)
      case "$w" in ''|*[!A-Za-z0-9_-]*) echo "wmod|$i|unknown"; continue ;; esac
      u=${w//-/_}
      if modinfo -n "$w" >/dev/null 2>&1; then av=yes; else av=no; fi
      if printf '%s\n' "$cfg" | grep -qE "^install[[:space:]]+$u[[:space:]]+(/usr)?/bin/(false|true)([[:space:]]|$)" \
         && printf '%s\n' "$cfg" | grep -qE "^blacklist[[:space:]]+$u([[:space:]]|$)"; then dis=yes; else dis=no; fi
      if [ -d "/sys/module/$u" ]; then ld=yes; else ld=no; fi
      echo "wmod|$i|$w|$av|$dis|$ld"
    done
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 120
  args:
    executable: /bin/bash
  register: kmod_raw
  changed_when: false
  failed_when: false

# CIS 1.5.x / 3.3.x. The running value (sysctl -n) and the PERSISTED value:
# the last assignment of the key in systemd-sysctl precedence order
# (systemd-analyze cat-config sysctl.d covers /etc/sysctl.conf through
# /etc/sysctl.d/99-sysctl.conf, /etc, /run, /usr/local/lib and /usr/lib).
# A key set nowhere prints no persist line; the mapper reports it "unset".
# Line format: run|<key>|<value>  persist|<key>|<value>
- name: Gather running and persisted kernel parameters for the CIS whitelist
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 60 s is killed before end:ok
    ( sleep 60; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    need sysctl systemd-analyze
    keys="fs.protected_hardlinks fs.protected_symlinks fs.suid_dumpable kernel.dmesg_restrict kernel.kptr_restrict kernel.randomize_va_space kernel.yama.ptrace_scope
      net.ipv4.ip_forward net.ipv4.conf.all.forwarding net.ipv4.conf.default.forwarding net.ipv4.conf.all.send_redirects net.ipv4.conf.default.send_redirects
      net.ipv4.icmp_ignore_bogus_error_responses net.ipv4.icmp_echo_ignore_broadcasts net.ipv4.conf.all.accept_redirects net.ipv4.conf.default.accept_redirects
      net.ipv4.conf.all.secure_redirects net.ipv4.conf.default.secure_redirects net.ipv4.conf.all.rp_filter net.ipv4.conf.default.rp_filter
      net.ipv4.conf.all.accept_source_route net.ipv4.conf.default.accept_source_route net.ipv4.conf.all.log_martians net.ipv4.conf.default.log_martians
      net.ipv4.tcp_syncookies net.ipv4.conf.all.route_localnet net.ipv4.conf.default.route_localnet
      net.ipv6.conf.all.forwarding net.ipv6.conf.default.forwarding net.ipv6.conf.all.accept_redirects net.ipv6.conf.default.accept_redirects
      net.ipv6.conf.all.accept_source_route net.ipv6.conf.default.accept_source_route net.ipv6.conf.all.accept_ra net.ipv6.conf.default.accept_ra"
    for k in $keys; do
      v=$(sysctl -n "$k" 2>/dev/null) && echo "run|$k|$v"
    done
    # a failed cat-config is truncated: never an "unset" (failing) or empty (passing) list
    conf=$(timeout 20 systemd-analyze cat-config sysctl.d 2>/dev/null) || echo "truncated|persist"
    printf '%s\n' "$conf" | awk -v keys="$keys" '
      BEGIN { n = split(keys, a, /[[:space:]]+/); for (i = 1; i <= n; i++) if (a[i] != "") want[a[i]] = 1 }
      /^[[:space:]]*[#;]/ || index($0, "=") == 0 { next }
      { k = substr($0, 1, index($0, "=") - 1); v = substr($0, index($0, "=") + 1)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", k); gsub(/^[[:space:]]+|[[:space:]]+$/, "", v)
        sub(/^-/, "", k); gsub(/\//, ".", k)
        if (k in want) last[k] = v }
      END { for (k in last) { v = last[k]; gsub(/\|/, "%7C", v); print "persist|" k "|" v } }'
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 120
  args:
    executable: /bin/bash
  register: sysctl_raw
  changed_when: false
  failed_when: false

# CIS 1.3.1.x, 2.x, 3.1.3, 4.1.9, 5.3.1.x, 6.1.x, 6.2.1.1. Package state is
# printed only where the RPM database manages the system (family|rpm): package
# names differ on Debian, and a dpkg "not installed" for an RPM name would be a
# false pass. Unit state comes from systemctl for a fixed list, because
# service_facts does not report .socket units or units that do not exist.
# Line format: pkg|<name>|yes/no  pkgver|<name>|<version-release>
#              unit|<name>|<LoadState>|<ActiveState>|<UnitFileState>  default_target|<target>
- name: Gather package installation, versions and unit state for the CIS service checks
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 60 s is killed before end:ok
    ( sleep 60; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    need systemctl
    if rpm -q rpm >/dev/null 2>&1; then
      echo "family|rpm"
      for p in aide at audit audit-libs authselect autofs avahi bind bluez chrony cockpit-ws cronie cups cyrus-imapd dhcp-server dnsmasq dovecot exim \
               firewalld ftp gdm gnome-shell httpd iptables-services libpwquality mcstrans net-snmp nfs-utils nginx openldap-clients pam postfix rpcbind \
               rsync-daemon rsyslog rsyslog-gnutls rsyslog-openssl samba sendmail setroubleshoot squid sudo telnet telnet-server tftp tftp-server ufw vsftpd \
               xorg-x11-server-common xorg-x11-server-Xorg xorg-x11-server-Xwayland; do
        if rpm -q "$p" >/dev/null 2>&1; then echo "pkg|$p|yes"; else echo "pkg|$p|no"; fi
      done
      for p in pam authselect libpwquality; do
        rpm -q "$p" >/dev/null 2>&1 || continue
        v=$(rpm -q --qf '%{VERSION}-%{RELEASE}\n' "$p" 2>/dev/null | tail -1)
        [ -n "$v" ] && echo "pkgver|$p|$(nm "$v" pkgver)"
      done
    else
      echo "family|other"
    fi
    for u in avahi-daemon.socket avahi-daemon.service cockpit.socket cockpit.service dhcpd.service dhcpd6.service named.service dnsmasq.service \
             smb.service vsftpd.service dovecot.socket dovecot.service cyrus-imapd.service nfs-server.service cups.socket cups.service \
             rpcbind.socket rpcbind.service rsyncd.socket rsyncd.service snmpd.service telnet.socket tftp.socket tftp.service squid.service \
             httpd.socket httpd.service nginx.service bluetooth.service nftables.service iptables.service ufw.service firewalld.service \
             systemd-journal-remote.socket systemd-journal-remote.service autofs.service; do
      # a unit systemd cannot be asked about is left out (its control is then
      # evidence missing); it never reads as a stopped unit
      sh=$(systemctl show -p LoadState -p ActiveState -p UnitFileState "$u" 2>/dev/null) || { echo "unit_unknown|$u"; continue; }
      ls=$(printf '%s\n' "$sh" | sed -n 's/^LoadState=//p'); as=$(printf '%s\n' "$sh" | sed -n 's/^ActiveState=//p'); fs=$(printf '%s\n' "$sh" | sed -n 's/^UnitFileState=//p')
      echo "unit|$u|$(nm "$ls" unit)|$(nm "$as" unit)|$(nm "$fs" unit)"
    done
    dt=$(systemctl get-default 2>/dev/null) && echo "default_target|$(nm "$dt" default_target)"
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 120
  args:
    executable: /bin/bash
  register: pkg_state_raw
  changed_when: false
  failed_when: false

# Configuration the v3 checks read as text or as derived values. Text lines are
# printed as txt|<tag>|<line> (comments and blank lines dropped, each file read
# through head -c), so no file line can stand alone as a tagged line or a forged
# end:ok. nofile|<tag> = the file does not exist (a fact, not a failure).
- name: Gather crypto policy, dnf, PAM module, chrony, MTA, firewalld, GDM, su, auditd and AIDE configuration
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 60 s is killed before end:ok
    ( sleep 60; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    # file|<tag> announces a present file even when every line is a comment
    # (no txt lines then means "no active settings", not "not collected")
    tx() { if [ -f "$2" ]; then echo "file|$1"; head -c 262144 -- "$2" | grep -vE '^[[:space:]]*(#|$)' | sed "s/^/txt|$1|/" | cap 2000 "$1"; else echo "nofile|$1"; fi; }
    tx crypto_pol /etc/crypto-policies/state/CURRENT.pol
    if [ -e /usr/share/crypto-policies/policies/modules/PQ.pmod ]; then echo "pq_module|yes"; else echo "pq_module|no"; fi
    tx dnf /etc/dnf/dnf.conf
    tx faillock /etc/security/faillock.conf
    tx pwhistory /etc/security/pwhistory.conf
    # authselect: the profile id is the first word of "authselect current -r";
    # "authselect check" exits 0 only when the PAM files match the profile
    if command -v authselect >/dev/null 2>&1; then
      ap=$(authselect current -r 2>/dev/null | awk 'NR==1{print $1}')
      echo "authselect_profile|$(nm "$ap" authselect)"
      if authselect check >/dev/null 2>&1; then echo "authselect_check|yes"; else echo "authselect_check|no"; fi
    else echo "authselect|absent"; fi
    # chrony: server/pool lines of chrony.conf and its drop-ins; OPTIONS of the unit
    if [ -f /etc/chrony.conf ]; then
      cf=$(cat /etc/chrony.conf /etc/chrony.d/*.conf 2>/dev/null | head -c 1048576)
      echo "chrony_servers|$(printf '%s\n' "$cf" | grep -cE '^[[:space:]]*server[[:space:]]+[^[:space:]]')"
      echo "chrony_pools|$(printf '%s\n' "$cf" | grep -cE '^[[:space:]]*pool[[:space:]]+[^[:space:]]')"
    else echo "nofile|chrony_conf"; fi
    co=$(sed -nE 's/^[[:space:]]*OPTIONS[[:space:]]*=[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/p' /etc/sysconfig/chronyd 2>/dev/null | tail -1)
    echo "chrony_options|$(nm "$co" chrony)"
    # MTA: TCP listeners on the mail ports, and postfix inet_interfaces
    if command -v ss >/dev/null 2>&1; then
      echo "mta_probe|yes"
      ss -Hlnt 2>/dev/null | awk '{a=$4; p=a; sub(/.*:/, "", p); if (p == "25" || p == "465" || p == "587") {sub(/:[0-9]+$/, "", a); gsub(/\|/, "%7C", a); print "mta_listen|" a}}' | cap 50 mta
    else echo "mta_probe|no"; fi
    if command -v postconf >/dev/null 2>&1; then ii=$(postconf -h inet_interfaces 2>/dev/null) && echo "mta_inet|$(nm "$ii" mta)"; fi
    # firewalld: backend and LogDenied from firewalld.conf (firewalld defaults when
    # unset), the zones from the running daemon (runtime and permanent target)
    if [ -f /etc/firewalld/firewalld.conf ]; then
      be=$(sed -nE 's/^[[:space:]]*FirewallBackend[[:space:]]*=[[:space:]]*([^[:space:]]+).*/\1/p' /etc/firewalld/firewalld.conf | tail -1)
      echo "fw_backend|$(nm "${be:-nftables}" fw)"
      ld=$(sed -nE 's/^[[:space:]]*LogDenied[[:space:]]*=[[:space:]]*([^[:space:]]+).*/\1/p' /etc/firewalld/firewalld.conf | tail -1)
      echo "fw_log_denied|$(nm "${ld:-off}" fw)"
    fi
    if command -v firewall-cmd >/dev/null 2>&1 && [ "$(firewall-cmd --state 2>/dev/null)" = running ]; then
      zi() { printf '%s\n' "$1" | sed -nE "s/^[[:space:]]+$2:[[:space:]]*(.*)$/\1/p" | head -1; }
      firewall-cmd --get-active-zones 2>/dev/null | grep -vE '^[[:space:]]' | awk '{print $1}' | cap 50 fwzone | while IFS= read -r z; do
        if [ "$z" = "truncated|fwzone" ]; then echo "$z"; continue; fi
        rt=$(firewall-cmd --info-zone="$z" 2>/dev/null) && pt=$(firewall-cmd --permanent --info-zone="$z" 2>/dev/null) || { echo "truncated|fwzone"; continue; }
        echo "fwzone|$(nm "$z" fw)|$(nm "$(zi "$rt" target)" fw)|$(nm "$(zi "$pt" target)" fw)|$(nm "$(zi "$rt" icmp-block-inversion)" fw)|$(nm "$(zi "$rt" icmp-blocks)" fw)|$(nm "$(zi "$rt" interfaces)" fw)"
      done
    fi
    # GDM (CIS 1.8.x): keys of the system dconf databases and their locks, and
    # custom.conf. Read only when gdm is installed.
    if rpm -q gdm >/dev/null 2>&1; then
      for f in /etc/dconf/db/*.d/*; do
        [ -f "$f" ] || continue
        head -c 262144 -- "$f" | grep -E '^[[:space:]]*(banner-message-enable|disable-user-list|idle-delay|lock-delay|automount|automount-open|autorun-never)[[:space:]]*=' \
          | sed -E 's/^[[:space:]]*([a-z-]+)[[:space:]]*=[[:space:]]*/dconf|\1|/; s/[[:space:]]+$//' | tr -d '\r' | cap 200 dconf
      done
      for f in /etc/dconf/db/*.d/locks/*; do
        [ -f "$f" ] || continue
        head -c 65536 -- "$f" | grep -E '^[[:space:]]*/org/gnome/' | sed -E 's/^[[:space:]]*/dlock|/; s/[[:space:]]+$//' | cap 200 dlock
      done
      head -c 65536 -- /etc/gdm/custom.conf 2>/dev/null | awk '/^[[:space:]]*\[/{s=$0; gsub(/[][[:space:]]/, "", s); next}
        s=="xdmcp" && /^[[:space:]]*Enable[[:space:]]*=/{v=$0; sub(/^[^=]*=[[:space:]]*/, "", v); print "gdmconf|xdmcp_enable|" v}
        s=="daemon" && /^[[:space:]]*WaylandEnable[[:space:]]*=/{v=$0; sub(/^[^=]*=[[:space:]]*/, "", v); print "gdmconf|wayland_enable|" v}' | tr -d '\r|'
    fi
    # su (CIS 5.2.12): the pam_wheel group of an uncommented "auth required
    # pam_wheel.so use_uid group=G" line, and how many members G has
    sg=$(grep -E '^[[:space:]]*auth[[:space:]]+(required|requisite)[[:space:]]+pam_wheel\.so([[:space:]]|$)' /etc/pam.d/su 2>/dev/null | grep -w use_uid | sed -nE 's/.*[[:space:]]group=([^[:space:]]+).*/\1/p' | tail -1)
    if [ -n "$sg" ]; then
      if gl=$(getent group "$sg" 2>/dev/null); then mem=$(printf '%s' "$gl" | cut -d: -f4); echo "su_wheel|$(nm "$sg" su)|$(printf '%s' "$mem" | awk -F, '{print ($0 == "" ? 0 : NF)}')"
      else echo "su_wheel|$(nm "$sg" su)|nogroup"; fi
    else echo "su_wheel|none|0"; fi
    # auditd: the merged rules compared with the running ones (CIS 6.2.3.36)
    if command -v augenrules >/dev/null 2>&1; then augenrules --check 2>&1 | head -5 | sed 's/^/txt|augenrules|/'; else echo "nofile|augenrules"; fi
    # AIDE (CIS 6.3.3 / 6.3.4): the rule line of each audit tool and report_url
    if [ -f /etc/aide.conf ]; then
      echo "aide_conf|yes"
      head -c 1048576 /etc/aide.conf | grep -E '^[[:space:]]*/(usr/)?s?bin/(auditctl|auditd|ausearch|aureport|autrace|augenrules)[[:space:]]+[^[:space:]]' \
        | awk '{t=$1; sub(/.*\//, "", t); print "aideopt|" t "|" $2}' | tr -d '\r' | cap 50 aideopt
      head -c 1048576 /etc/aide.conf | sed -nE 's/^[[:space:]]*report_url[[:space:]]*=[[:space:]]*([^[:space:]]+).*/aide_report|\1/p' | tr -d '\r' | cap 20 aide_report
    else echo "aide_conf|no"; fi
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 120
  args:
    executable: /bin/bash
  register: config_raw
  changed_when: false
  failed_when: false

# File modes and owners the v3 checks read (CIS 1.4.2, 2.4.1.7, 5.1.1-5.1.4,
# 5.2.2-5.2.3, 6.1.2.4-6.1.2.6, 6.1.3.1, 6.2.4.8-6.2.4.10, 7.1.1-7.1.10).
# Line format: f|<tag>|<mode>|<owner>|<group>|<path>  or  absent|<tag>|<path>
# (owner/group UNKNOWN = no such user/group). /var/log is swept with a cap.
- name: Gather mode and ownership of SSH, sudo, critical, GRUB, rsyslog, audit tool and log files
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 100 s is killed before end:ok
    ( sleep 100; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    need stat find
    s() { local t=$1; shift; for p in "$@"; do
      if [ -e "$p" ] || [ -L "$p" ]; then m=$(stat -c '%04a|%U|%G' "$p" 2>/dev/null) && echo "f|$t|$m|$(nm "$p" "$t")"; else echo "absent|$t|$(nm "$p" "$t")"; fi
    done; }
    g() { local t=$1; shift; for p in "$@"; do [ -e "$p" ] || [ -L "$p" ] || continue; s "$t" "$p"; done; }
    s ssh_config /etc/ssh/sshd_config
    s ssh_dropin_dir /etc/ssh/sshd_config.d
    g ssh_dropin /etc/ssh/sshd_config.d/*.conf
    g ssh_hostkey /etc/ssh/ssh_host_*_key
    g ssh_hostpub /etc/ssh/ssh_host_*_key.pub
    s sudoers /etc/sudoers
    s sudoers_d_dir /etc/sudoers.d
    g sudoers_d /etc/sudoers.d/*
    s critical /etc/passwd /etc/passwd- /etc/group /etc/group- /etc/shadow /etc/shadow- /etc/gshadow /etc/gshadow- /etc/shells /etc/security/opasswd /etc/security/opasswd.old
    s cron_yearly /etc/cron.yearly
    s rsyslog_conf /etc/rsyslog.conf
    g rsyslog_conf /etc/rsyslog.d/*.conf
    s rsyslog_d /etc/rsyslog.d
    wdir=$(cat /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null | grep -vE '^[[:space:]]*#' | sed -nE 's/.*workDirectory[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p; s/^[[:space:]]*\$WorkDirectory[[:space:]]+([^[:space:]]+).*/\1/p' | tail -1)
    [ -f /etc/rsyslog.conf ] && s rsyslog_work "${wdir:-/var/lib/rsyslog}"
    g audit_tool /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules
    # GRUB files under /boot (including /boot/efi): grub*, user.cfg
    timeout 20 find /boot \( -name 'grub*' -o -name 'user.cfg' \) -type f -print0 2>/dev/null | {
      n=0; while IFS= read -r -d '' f; do n=$((n + 1)); if [ "$n" -gt 100 ]; then echo "truncated|grub"; break; fi; s grub "$f"; done; }
    [ "${PIPESTATUS[0]}" -eq 0 ] || echo "truncated|grub"
    # /var/log regular files (names may be user-chosen: NUL-delimited)
    timeout 30 find /var/log -xdev -type f -print0 2>/dev/null | {
      n=0; while IFS= read -r -d '' f; do n=$((n + 1)); if [ "$n" -gt 2000 ]; then echo "truncated|logf"; break; fi; s logf "$f"; done; }
    [ "${PIPESTATUS[0]}" -eq 0 ] || echo "truncated|logf"
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 150
  args:
    executable: /bin/bash
  register: perms_raw
  changed_when: false
  failed_when: false

# CIS 5.4.1.x, 5.4.2.4-5.4.2.8, 5.4.3.1-5.4.3.3. /etc/shadow is read for the
# account NAME, the password STATE (P = a crypt hash, L = locked or no usable
# hash, NP = empty) and the aging fields; no hash or hash prefix leaves the host.
# Line format: sh|<user>|<P/L/NP>|<lastchg>|<max>|<warn>|<inactive>
- name: Gather password aging, account lock state, shells, root umask and root PATH ownership
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 60 s is killed before end:ok
    ( sleep 60; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    need stat
    awk -F: '$1 ~ /\|/ {print "unsafe_name|shadow"; gsub(/\|/, "%7C", $1)}
      {st = ($2 ~ /^\$/) ? "P" : (($2 == "") ? "NP" : "L"); print "sh|" $1 "|" st "|" $3 "|" $5 "|" $6 "|" $7}' /etc/shadow 2>/dev/null | cap 5000 shadow
    [ "${PIPESTATUS[0]}" -eq 0 ] || echo "truncated|shadow"
    um=$(awk '/^[[:space:]]*UID_MIN[[:space:]]+[0-9]+/{v=$2} END{print v}' /etc/login.defs 2>/dev/null)
    echo "uid_min|${um:-1000}"
    em=$(awk '/^[[:space:]]*ENCRYPT_METHOD[[:space:]]+[A-Za-z0-9]+/{v=$2} END{print v}' /etc/login.defs 2>/dev/null)
    [ -n "$em" ] && echo "encrypt_method|$em"
    if [ -f /etc/shells ]; then
      grep -vE '^[[:space:]]*(#|$)' /etc/shells | cap 200 shells | while IFS= read -r l; do
        if [ "$l" = "truncated|shells" ]; then echo "$l"; continue; fi; echo "shell|$(nm "$l" shells)"; done
    else echo "nofile|shells"; fi
    # readonly / export of TMOUT in the login profile (CIS 5.4.3.2)
    for f in /etc/profile /etc/profile.d/*.sh /etc/bashrc /etc/bash.bashrc; do
      [ -f "$f" ] || continue
      grep -qE '^[[:space:]]*(readonly[[:space:]]+([^#]*[[:space:]])?TMOUT\b|declare[[:space:]]+-[a-zA-Z]*r[a-zA-Z]*[[:space:]]+TMOUT\b|typeset[[:space:]]+-[a-zA-Z]*r[a-zA-Z]*[[:space:]]+TMOUT\b)' "$f" && echo "tmout_ro|$(nm "$f" tmout)"
      grep -qE '^[[:space:]]*(export[[:space:]]+([^#]*[[:space:]])?TMOUT\b|declare[[:space:]]+-[a-zA-Z]*x[a-zA-Z]*[[:space:]]+TMOUT\b|readonly[[:space:]]+-[a-zA-Z]*x[a-zA-Z]*[[:space:]]+TMOUT\b)' "$f" && echo "tmout_export|$(nm "$f" tmout)"
    done
    # root login shell umask and PATH (same probe as the user/group block)
    if ru=$(timeout 10 env -i HOME=/root bash -lc umask 2>/dev/null) && [ -n "$ru" ]; then echo "root_umask|$(nm "$ru" root_umask)"; else echo "truncated|root_umask"; fi
    if rp=$(timeout 10 env -i HOME=/root bash -lc 'printf "%s" "$PATH"' 2>/dev/null) && [ -n "$rp" ]; then
      IFS=: read -r -d '' -a dirs < <(printf '%s' "$rp")
      for d in "${dirs[@]}"; do
        [ -n "$d" ] && [ -d "$d" ] || continue
        m=$(stat -L -c '%U|%04a' "$d" 2>/dev/null) && echo "pathent|$m|$(nm "$d" pathent)"
      done
    else echo "truncated|pathent"; fi
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 120
  args:
    executable: /bin/bash
  register: accounts_raw
  changed_when: false
  failed_when: false

# CIS 6.2.3.10, 7.1.11, 7.1.12. One traversal per local filesystem (xfs, ext*,
# btrfs; -xdev) lists unowned / ungrouped files, world-writable directories
# without the sticky bit and, on filesystems mounted without noexec and nosuid,
# SUID/SGID executables (the privileged commands auditd must watch). Lists are
# capped (truncated|<tag>) and the true totals printed (count|<tag>|<n>); a find
# that fails or times out is truncated|<tag> for every list.
- name: Sweep local filesystems for unowned files, non-sticky world-writable directories and privileged commands
  shell: |
    # ── common prologue (see EVIDENCE INTEGRITY above) ──
    export LC_ALL=C
    exec 3>&1
    # watchdog: a block still running after 240 s is killed before end:ok
    ( sleep 240; kill -TERM $$ ) >/dev/null 2>&1 3>&- &
    wd=$!
    # nm VALUE TAG: VALUE, or unsafe:<16 hex of its sha256> if it holds '|' or
    # any byte outside printable ASCII (control chars, invalid UTF-8, ...)
    nm() { case "$1" in *[![:print:]]*|*'|'*) echo "unsafe_name|$2" >&3; printf 'unsafe:%s' "$(printf '%s' "$1" | sha256sum | cut -c1-16)" ;; *) printf '%s' "$1" ;; esac; }
    # need CMD...: print missing_cmd|CMD for each absent command (block then invalid)
    need() { local r=0 c; for c in "$@"; do command -v "$c" >/dev/null 2>&1 || { echo "missing_cmd|$c"; r=1; }; done; return $r; }
    # cap N TAG: pass N lines, then print truncated|TAG and stop (never a silent cap)
    cap() { awk -v n="$1" -v t="$2" 'NR <= n {print; next} {print "truncated|" t; exit}'; }
    need find findmnt
    # lastpipe: the while loop below runs in this shell, so its counts survive
    shopt -s lastpipe
    declare -A cnt=([unowned]=0 [ungrouped]=0 [nosticky]=0 [priv]=0)
    declare -A lim=([unowned]=100 [ungrouped]=100 [nosticky]=100 [priv]=1000)
    # records under container image storage (rootless or root podman), counted
    # apart for the report; they are NOT excluded from the totals
    declare -A cst=([unowned]=0 [ungrouped]=0 [nosticky]=0 [priv]=0)
    swept=0
    while IFS=' ' read -r tgt opts; do
      tgt=$(printf '%b' "$tgt"); swept=$((swept + 1))
      args=(\( -nouser -printf 'unowned|%p\0' \) , \( -nogroup -printf 'ungrouped|%p\0' \) , \( -type d -perm -0002 ! -perm -1000 -printf 'nosticky|%p\0' \))
      case ",$opts," in *,noexec,*|*,nosuid,*) ;; *) args+=(, \( -type f -perm /6000 -printf 'priv|%p\0' \)) ;; esac
      timeout 50 find "$tgt" -xdev "${args[@]}" 2>/dev/null | while IFS= read -r -d '' rec; do
        t=${rec%%|*}; p=${rec#*|}
        cnt[$t]=$(( ${cnt[$t]} + 1 ))
        case "$p" in */.local/share/containers/storage/*|/var/lib/containers/storage/*) cst[$t]=$(( ${cst[$t]} + 1 )) ;; esac
        if [ "${cnt[$t]}" -le "${lim[$t]}" ]; then echo "$t|$(nm "$p" "$t")"; elif [ "${cnt[$t]}" -eq $(( ${lim[$t]} + 1 )) ]; then echo "truncated|$t"; fi
      done
      # find failed (some path unreadable) or hit its 50 s timeout (124): no list
      # is the whole truth, and every count is then only a lower bound
      rc=${PIPESTATUS[0]}
      if [ "$rc" -ne 0 ]; then echo "sweep_rc|$swept|$rc"; for t in unowned ungrouped nosticky priv; do echo "truncated|$t"; done; fi
    done < <(findmnt -rn -o TARGET,OPTIONS -t xfs,ext4,ext3,ext2,btrfs 2>/dev/null)
    # no local filesystem found (root on an unlisted type): nothing was swept,
    # which must not read as "no unowned files"
    [ "$swept" -gt 0 ] || for t in unowned ungrouped nosticky priv; do echo "truncated|$t"; done
    for t in unowned ungrouped nosticky priv; do echo "count|$t|${cnt[$t]}"; echo "container_storage|$t|${cst[$t]}"; done
    kill "$wd" 2>/dev/null; echo "end:ok"
  timeout: 300
  args:
    executable: /bin/bash
  register: fs_sweep_raw
  changed_when: false
  failed_when: false

- name: Build combined facts payload
  set_fact:
    combined_facts:
      schema_version: "{{ facts_schema_version | default('2.0') }}"
      collection_timestamp: "{{ ansible_date_time.iso8601 }}"
      # Standard ansible facts — everything OPA needs for basic OS checks
      ansible_facts:
        hostname: "{{ ansible_hostname }}"
        fqdn: "{{ ansible_fqdn }}"
        os_family: "{{ ansible_os_family }}"
        distribution: "{{ ansible_distribution }}"
        distribution_version: "{{ ansible_distribution_version }}"
        distribution_major_version: "{{ ansible_distribution_major_version }}"
        kernel: "{{ ansible_kernel }}"
        architecture: "{{ ansible_architecture }}"
        default_ipv4: "{{ ansible_default_ipv4 | default({}) }}"
        interfaces: "{{ ansible_interfaces | default([]) }}"
        mounts: "{{ ansible_mounts | default([]) }}"
        selinux: "{{ ansible_selinux | default({}) }}"
        selinux_python_present: "{{ ansible_selinux_python_present | default(false) }}"
        service_mgr: "{{ ansible_service_mgr | default('') }}"
        pkg_mgr: "{{ ansible_pkg_mgr | default('') }}"
        processor_cores: "{{ ansible_processor_cores | default(0) }}"
        memtotal_mb: "{{ ansible_memtotal_mb | default(0) }}"
        services: "{{ ansible_facts.services | default({}) }}"
      # Specialized facts that ansible_facts doesn't include
      custom_facts:
        sshd_config_raw: "{{ sshd_config_raw.stdout | default('') }}"
        pwquality_conf_raw: "{{ pwquality_raw.stdout | default('') }}"
        password_aging_raw: "{{ password_aging_raw.stdout | default('') }}"
        pam_config_raw: "{{ pam_config_raw.stdout | default('') }}"
        auditd_rules_raw: "{{ auditd_rules_raw.stdout | default('') }}"
        auditd_conf_raw: "{{ auditd_conf_raw.stdout | default('') }}"
        sudoers_raw: "{{ sudoers_raw.stdout | default('') }}"
        kernel_modules_raw: "{{ kernel_modules_raw.stdout | default('') }}"
        findmnt_raw: "{{ findmnt_raw.stdout | default('') }}"
        grub_raw: "{{ grub_raw.stdout | default('') }}"
        banners_raw: "{{ banners_raw.stdout | default('') }}"
        cron_access_raw: "{{ cron_access_raw.stdout | default('') }}"
        world_writable_files: "{{ world_writable_raw.stdout_lines | default([]) | reject('match', '^__count__[|]') | list }}"
        world_writable_count: "{{ (_ww_counts | last | int) if ((_ww_counts | length) > 0 and 'timeout' not in _ww_counts and (_ww_counts | last) is match('^[0-9]+$')) else none }}"
        world_writable_truncated: "{{ (_ww_counts | length) == 0 or 'timeout' in _ww_counts or ((_ww_counts | last) is match('^[0-9]+$') and (_ww_counts | last | int) > 100) }}"
        suid_sgid_files: "{{ suid_files_raw.stdout_lines | default([]) | reject('match', '^__count__[|]') | list }}"
        suid_sgid_count: "{{ (_suid_counts | last | int) if ((_suid_counts | length) > 0 and 'timeout' not in _suid_counts and (_suid_counts | last) is match('^[0-9]+$')) else none }}"
        suid_sgid_truncated: "{{ (_suid_counts | length) == 0 or 'timeout' in _suid_counts or ((_suid_counts | last) is match('^[0-9]+$') and (_suid_counts | last | int) > 100) }}"
        users_raw: "{{ users_raw.stdout | default('') }}"
        firewall_raw: "{{ firewall_raw.stdout | default('') }}"
        mac_status_raw: "{{ mac_status_raw.stdout | default('') }}"
        logging_raw: "{{ logging_raw.stdout | default('') }}"
        file_modes_raw: "{{ file_modes_raw.stdout | default('') }}"
        boot_raw: "{{ boot_raw.stdout | default('') }}"
        network_raw: "{{ network_raw.stdout | default('') }}"
        user_group_raw: "{{ user_group_raw.stdout | default('') }}"
        account_policy_raw: "{{ account_policy_raw.stdout | default('') }}"
        pkg_trust_raw: "{{ pkg_trust_raw.stdout | default('') }}"
        storage_raw: "{{ storage_raw.stdout | default('') }}"
        certs_raw: "{{ certs_raw.stdout | default('') }}"
        authorized_keys_raw: "{{ authorized_keys_raw.stdout | default('') }}"
        kmod_raw: "{{ kmod_raw.stdout | default('') }}"
        sysctl_raw: "{{ sysctl_raw.stdout | default('') }}"
        pkg_state_raw: "{{ pkg_state_raw.stdout | default('') }}"
        config_raw: "{{ config_raw.stdout | default('') }}"
        perms_raw: "{{ perms_raw.stdout | default('') }}"
        accounts_raw: "{{ accounts_raw.stdout | default('') }}"
        fs_sweep_raw: "{{ fs_sweep_raw.stdout | default('') }}"

- name: Compute facts checksum
  set_fact:
    facts_checksum: "{{ combined_facts | to_json | hash('sha256') }}"
