    grep -HE '^[[:space:]]*umask[[:space:]]+[0-7]{3,4}([[:space:]]|$)' /etc/profile /etc/profile.d/*.sh /etc/bashrc /etc/bash.bashrc 2>/dev/null | awk -F: '{split($2,a," "); for(i=1;i<=length(a);i++) if (a[i]=="umask") {print "umask|"$1"|"a[i+1]; break}}'
    grep -E '^[[:space:]]*UMASK[[:space:]]+[0-7]+' /etc/login.defs 2>/dev/null | awk '{print "umask|/etc/login.defs|"$2}'
    grep -HoE '^[[:space:]]*(readonly[[:space:]]+|export[[:space:]]+|declare[[:space:]]+-[a-z]+[[:space:]]+)*TMOUT=[0-9]+' /etc/profile /etc/profile.d/*.sh /etc/bashrc /etc/bash.bashrc 2>/dev/null | sed -E 's/^([^:]*):.*TMOUT=([0-9]+)$/tmout|\1|\2/'
    need useradd
    useradd -D 2>/dev/null | sed -n 's/^INACTIVE=\(-\{0,1\}[0-9]*\)$/inactive|\1/p'
