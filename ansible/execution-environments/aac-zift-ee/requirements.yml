---
# Minimal collection set for the Zift demo playbook.
# Only what's actually called from zift_sentinel_demo.yml:
#   - ansible.builtin.*                       (command, file, uri, debug, set_fact)
#   - community.postgresql.postgresql_query   (optional — record findings to DB)
#
# We intentionally do NOT pull in infra.aap_configuration, amazon.aws,
# ansible.windows, etc. — those are AAC-core EE concerns and would bloat
# this image without adding value to the code-to-policy migration flow.
collections:
  - name: community.postgresql
    version: ">=3.0.0"
  - name: community.general
    version: ">=8.0.0"
