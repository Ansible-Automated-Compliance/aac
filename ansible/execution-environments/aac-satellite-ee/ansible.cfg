[defaults]
host_key_checking = False
retry_files_enabled = False

[inventory]
# The foreman plugin must be explicitly enabled; it is not on by default.
# This is the reason this file is copied into the final image at all.
enable_plugins = redhat.satellite.foreman, host_list, script, auto, yaml, ini

# No [galaxy] section on purpose.
#
# Certified content is resolved during the BUILD, by the galaxy stage, from
# build args (see execution-environment.yml). Repeating a server list here would
# put an Automation Hub URL with no token into the shipped image, so any runtime
# `ansible-galaxy install` would fail against a hub it cannot authenticate to —
# and it is the obvious place for someone to later paste a token that would then
# ship inside the image.
