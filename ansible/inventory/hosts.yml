---
all:
  children:
    federal_systems:
      hosts:
        federal-web-01:
          ansible_host: 192.168.1.10
          system_categorization:
            confidentiality_impact: "moderate"
            integrity_impact: "high"
            availability_impact: "moderate"
            overall_impact: "high"
          organization:
            name: "Department of Federal Services"
            entity_type: "federal_agency"
            authorizing_official: "Sarah Johnson"
            senior_agency_iso: "Michael Chen"
            system_owner: "Jennifer Davis"
        federal-db-01:
          ansible_host: 192.168.1.11
          system_categorization:
            confidentiality_impact: "high"
            integrity_impact: "high"
            availability_impact: "high"
            overall_impact: "high"
    
    utility_systems:
      hosts:
        scada-hmi-01:
          ansible_host: 192.168.2.10
          nerc_organization:
            name: "Electric Utility Company"
            entity_type: "transmission_operator"
            nerc_registration: "TOP-001"
          bes_cyber_systems:
            - system_id: "BCS-001"
              system_name: "Energy Management System"
              impact_categorization: "high"
              functional_obligations: ["real_time_operations"]
    
    commercial_systems:
      hosts:
        web-app-01:
          ansible_host: 192.168.3.10
          service_organization:
            name: "Cloud Services Inc"
            type: "saas_provider"
            services_provided: ["customer_portal", "data_processing"]
        payment-gateway-01:
          ansible_host: 192.168.3.11
          merchant_info:
            name: "E-commerce Platform"
            merchant_level: "level_2"
            transaction_volume: 500000

  vars:
    # Global OPA configuration
    opa_server_url: "http://localhost:8181"
    assessment_output_dir: "/tmp/compliance_assessments"
    
    # Global compliance settings
    generate_report: true
    send_notifications: false
    auto_remediate: false