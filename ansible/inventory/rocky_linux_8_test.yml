---
# Test inventory for Rocky Linux 8 CIS compliance assessment
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_become: yes

    # Add your Rocky Linux 8 hosts here
    # rocky_linux_8-server-01:
    #   ansible_host: 192.168.1.10
    #   ansible_user: admin
    #   ansible_become: yes

  vars:
    # OPA configuration
    opa_server_url: "http://localhost:8181"

    # Target platform
    target_platform: "rocky_linux_8"

    # Compliance framework
    compliance_framework: "cis"

    # Report generation
    generate_report: true
    report_format: "json"
    assessment_output_dir: "/tmp/compliance_assessments"
