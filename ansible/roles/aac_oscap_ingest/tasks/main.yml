---
# aac_oscap_ingest/tasks/main.yml
# Parse (scripts/openscap_xccdf_parse.py — the single, tested parser) and
# record via aac_store_results. Faithful extraction of the ingest half of
# openscap_assess.yml (#536), plus a zero-evaluated-rules guard.

- name: Validate the results file is set and present
  ansible.builtin.stat:
    path: "{{ oscap_results_file | mandatory }}"
  register: _oscap_results_stat
  failed_when: not _oscap_results_stat.stat.exists

- name: Parse the XCCDF results (deterministic)
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/../../../scripts/openscap_xccdf_parse.py"
      - "{{ oscap_results_file }}"
  register: _parsed_raw
  changed_when: false

- name: Load parsed results
  ansible.builtin.set_fact:
    _scap: "{{ _parsed_raw.stdout | from_json }}"

- name: Refuse to store an empty evaluation (green-but-empty guard)
  ansible.builtin.assert:
    that: _scap.total_evaluated | int > 0
    fail_msg: >-
      aac_oscap_ingest: {{ oscap_results_file }} contains zero evaluated
      rules — refusing to store a meaningless row. Check the profile id and
      datastream used for the scan.

- name: Derive framework label when none supplied
  ansible.builtin.set_fact:
    # Stored in compliance_results.framework (VARCHAR(100) NOT NULL) — keep
    # it short and column-safe. Uses the profile parsed from the file itself.
    framework_label: >-
      {{ ('openscap_' + ((profile_id | default(_scap.profile, true))
          | regex_replace('^.*_profile_', '')
          | regex_replace('[^A-Za-z0-9]', '_'))) | truncate(90, true, '') }}
  when: (framework_label | default('', true)) | length == 0

- name: Summary
  ansible.builtin.debug:
    msg:
      - "OpenSCAP ingest — {{ inventory_hostname }}"
      - "  profile:    {{ profile_id | default(_scap.profile, true) }}"
      - "  framework:  {{ (framework_label | default('', true)) }}"
      - "  evaluated:  {{ _scap.total_evaluated }}  (passed {{ _scap.passed }}, failed {{ _scap.failed }})"
      - "  score:      {{ _scap.compliance_pct }}%   oscap score: {{ _scap.score | default('n/a') }}"
      - "  {{ '✓ COMPLIANT' if _scap.compliant else '✗ NON-COMPLIANT' }}"

- name: Record OpenSCAP result to compliance_results (waiver-aware)
  ansible.builtin.include_role:
    name: aac_store_results
  vars:
    aac_result_hostname:        "{{ inventory_hostname }}"
    aac_result_policy_name:     "OpenSCAP {{ (framework_label | default('', true)) }}"
    aac_result_framework:       "{{ (framework_label | default('', true)) }}"
    aac_result_policy_version:  "{{ _scap.benchmark_id | default('xccdf', true) }}"
    aac_result_total_controls:  "{{ _scap.total_evaluated | int }}"
    aac_result_passed_controls: "{{ _scap.passed | int }}"
    aac_result_failed_controls: "{{ _scap.failed | int }}"
    aac_result_compliance_pct:  "{{ _scap.compliance_pct | float }}"
    aac_result_violations: "{{ _scap.failed_rules }}"
    aac_result_metadata:
      tool: "{{ oscap_tool }}"
      tool_version: "{{ oscap_version | default('?', true) }}"
      evaluation_engine: "OpenSCAP oscap (ingested by AAC)"
      profile: "{{ profile_id | default(_scap.profile, true) }}"
      benchmark_id: "{{ _scap.benchmark_id }}"
      datastream: "{{ datastream_path | default('', true) }}"
      tailoring: "{{ tailoring_path | default('', true) }}"
      oscap_score: "{{ _scap.score }}"
      by_status: "{{ _scap.by_status }}"
      framework: "{{ (framework_label | default('', true)) }}"
      compliant: "{{ _scap.compliant }}"
    aac_result_opa_server: "{{ opa_security_url | default(opa_server_url | default('', true), true) }}"
  when: record_to_db | bool

- name: Clean up the fetched result file
  ansible.builtin.file:
    path: "{{ oscap_results_file }}"
    state: absent
  when: oscap_cleanup_fetched | bool
