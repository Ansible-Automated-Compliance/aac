---
# Reload the user systemd daemon and enable the Compliance-State API unit.

- name: reload_and_enable_eauth_unit
  shell: |
    systemctl --user daemon-reload
    systemctl --user enable container-{{ aac_eauth_container_name }}.service
  delegate_to: "{{ aac_host }}"
  become: true
  become_user: "{{ aac_eauth_run_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ lookup('pipe', 'id -u ' + aac_eauth_run_user) }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ lookup('pipe', 'id -u ' + aac_eauth_run_user) }}/bus"
