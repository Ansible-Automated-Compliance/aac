---
# Stop any existing Compliance-State API container and start a fresh one.
# DB credentials are read from compliance-state.env at runtime — never embedded in
# the command, so they don't appear in `podman inspect` or job logs.

- name: Stop and remove existing container
  shell: |
    podman stop {{ aac_eauth_container_name }} 2>/dev/null || true
    podman rm   {{ aac_eauth_container_name }} 2>/dev/null || true
  delegate_to: "{{ aac_host }}"
  become: true
  become_user: "{{ aac_eauth_run_user }}"
  changed_when: false

- name: Start Compliance-State API container
  shell: |
    podman run -d \
      --name {{ aac_eauth_container_name }} \
      -p {{ aac_eauth_port }}:{{ aac_eauth_port }} \
      --restart=always \
      --env-file {{ aac_eauth_app_dir }}/compliance-state.env \
      {{ aac_eauth_image }}
  delegate_to: "{{ aac_host }}"
  become: true
  become_user: "{{ aac_eauth_run_user }}"
  changed_when: true
