---
# linux_processes.yml — Collect running process and resource facts

- name: Get running processes
  shell: |
    ps axo pid,ppid,user,pcpu,pmem,vsz,rss,stat,start,comm --no-headers 2>/dev/null \
      | head -100 || echo ""
  register: processes_raw
  changed_when: false
  failed_when: false

# The list above keeps its first 100 lines (existing key, unchanged). On most
# hosts those lines are kernel threads, so the names that identify a workload
# never reach it. The distinct command names of every process are stored
# beside it, capped, and the cap is stated when it is reached.
- name: Get the distinct command names of every running process
  ansible.builtin.shell: |
    set -o pipefail
    ps axo comm --no-headers 2>/dev/null | awk 'NF {print $1}' | sort -u
  args:
    executable: /bin/bash
  register: process_names_raw
  changed_when: false
  failed_when: false

- name: Count running processes
  ansible.builtin.shell: |
    set -o pipefail
    ps axo pid --no-headers 2>/dev/null | wc -l
  args:
    executable: /bin/bash
  register: process_total_raw
  changed_when: false
  failed_when: false

- name: Check for known malicious process patterns
  shell: |
    for pattern in xmrig xmr-stak minerd cpuminer cgminer bfgminer \
                   ncrack hydra masscan zmap sqlmap metasploit; do
      pgrep -la "$pattern" 2>/dev/null && echo "SUSPECT:$pattern" || true
    done || echo ""
  register: suspect_processes_raw
  changed_when: false
  failed_when: false

- name: Get processes listening on unusual ports
  shell: |
    ss -tlnpu 2>/dev/null | awk 'NR>1 {print $5,$6}' \
      | grep -v "0.0.0.0:22\b\|:::22\b\|0.0.0.0:443\b\|0.0.0.0:80\b" \
      | head -30 || echo ""
  register: unusual_listeners_raw
  changed_when: false
  failed_when: false

- name: Set process facts
  set_fact:
    aac_processes:
      count:              "{{ processes_raw.stdout_lines | default([]) | length }}"
      processes_raw:      "{{ processes_raw.stdout | default('') }}"
      # New keys. `count` and `processes_raw` above keep their old meaning (first 100 lines).
      process_total:        "{{ process_total_raw.stdout | default('0') | trim | int }}"
      command_names:        "{{ (process_names_raw.stdout_lines | default([]) | select | list)[: aac_processes_max_command_names | int] }}"
      command_names_total:  "{{ process_names_raw.stdout_lines | default([]) | select | list | length }}"
      command_names_capped: "{{ (process_names_raw.stdout_lines | default([]) | select | list | length) > (aac_processes_max_command_names | int) }}"
      command_names_collected: "{{ (process_names_raw.rc | default(1)) == 0 }}"
      suspect_processes:  "{{ suspect_processes_raw.stdout_lines | default([]) | select | list }}"
      unusual_listeners:  "{{ unusual_listeners_raw.stdout_lines | default([]) | select | list }}"
