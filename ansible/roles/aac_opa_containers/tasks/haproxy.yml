---
# Deploy HAProxy load balancers for container types with replicas > 1.
# HAProxy sits on the canonical port (8181/8182/8183) and round-robins
# across backend replica containers — callers see no change.
#
# Always cleans up existing haproxy containers first, handles scale-down
# (replicas back to 1 removes HAProxy and restores the canonical port).

# ── Identify which types are scaled ─────────────────────────────────────────

- name: Identify scaled container types (replicas > 1)
  set_fact:
    _aac_opa_scaled: >-
      {{ aac_opa_containers
         | selectattr('replicas', 'defined')
         | selectattr('replicas', 'gt', 1)
         | list }}

# ── Always remove stale HAProxy containers (handles scale-down) ──────────────

- name: Stop and remove haproxy containers for all container types
  shell: |
    podman stop haproxy-{{ item.name }} 2>/dev/null || true
    podman rm   haproxy-{{ item.name }} 2>/dev/null || true
  loop: "{{ aac_opa_containers }}"
  loop_control:
    label: "haproxy-{{ item.name }}"
  delegate_to: "{{ aac_host }}"
  changed_when: false

# ── Deploy HAProxy for scaled types only ─────────────────────────────────────

- name: Deploy HAProxy for scaled container types
  when: _aac_opa_scaled | length > 0
  block:

    - name: Create HAProxy config directory
      file:
        path: "{{ aac_opa_haproxy_config_dir }}"
        state: directory
        mode: "0755"
      delegate_to: "{{ aac_host }}"
      become: true

    - name: Set SELinux context on HAProxy config directory
      command: "chcon -R -t container_file_t {{ aac_opa_haproxy_config_dir }}"
      delegate_to: "{{ aac_host }}"
      become: true
      ignore_errors: true
      changed_when: false

    - name: Write HAProxy config for each scaled container type
      copy:
        dest: "{{ aac_opa_haproxy_config_dir }}/haproxy-{{ item.name }}.cfg"
        mode: "0644"
        content: |
          # HAProxy config for {{ item.name }} — {{ item.description }}
          # Auto-generated by aac_opa_containers role. Do not edit manually.
          # Replicas: {{ item.replicas }}  Backend ports: {{ item.backend_base_port }}–{{ item.backend_base_port + item.replicas - 1 }}

          global
              maxconn 4096
              log stdout format raw local0

          defaults
              mode http
              timeout connect 5s
              timeout client 30s
              timeout server 30s
              option http-server-close
              log global

          frontend opa_{{ item.policy_subdir }}_frontend
              bind *:{{ item.port }}
              default_backend opa_{{ item.policy_subdir }}_backends

          backend opa_{{ item.policy_subdir }}_backends
              balance roundrobin
              option httpchk GET /health
              {% for i in range(1, item.replicas + 1) %}
              server {{ item.name }}-{{ i }} host.containers.internal:{{ item.backend_base_port + i - 1 }} check
              {% endfor %}
      loop: "{{ _aac_opa_scaled }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: "{{ aac_host }}"
      become: true

    - name: Pull HAProxy image
      command: "podman pull {{ aac_opa_haproxy_image }}"
      delegate_to: "{{ aac_host }}"
      changed_when: false

    - name: Start HAProxy containers for scaled types
      # Binds on the canonical OPA port — callers need no reconfiguration.
      # host.containers.internal resolves to the host from inside podman containers.
      command: >
        podman run -d
        --name haproxy-{{ item.name }}
        -p {{ item.port }}:{{ item.port }}
        --restart=always
        -v {{ aac_opa_haproxy_config_dir }}/haproxy-{{ item.name }}.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,z
        {{ aac_opa_haproxy_image }}
      loop: "{{ _aac_opa_scaled }}"
      loop_control:
        label: "haproxy-{{ item.name }} (canonical port {{ item.port }})"
      delegate_to: "{{ aac_host }}"

    - name: Wait for HAProxy instances to be healthy
      uri:
        use_proxy: false
        url: "http://{{ aac_host }}:{{ item.port }}/health"
        method: GET
        status_code: 200
      loop: "{{ _aac_opa_scaled }}"
      loop_control:
        label: "haproxy-{{ item.name }}"
      register: haproxy_health
      until: haproxy_health is succeeded
      retries: 12
      delay: 5
