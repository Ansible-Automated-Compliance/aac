---
# apply_remediation.yml — Apply generated remediation tasks to a host
#
# Fetches the generated task list from remediation_actions (stored by
# 'AAC - Generate Remediation Playbook'), writes it as an Ansible playbook,
# and includes it for execution on the target host.
#
# Two-play structure:
#   Play 1: Fetch action record from PostgreSQL (localhost)
#   Play 2: Write and apply tasks on target host (SSH)
#
# Safety gates:
#   dry_run=true  — print what WOULD be changed, no actual changes
#   dry_run=false — apply the tasks with ansible --check=false
#
# After application, collects facts again and runs a new comparison to
# verify the host now matches baseline.
#
# AAP Job Template: "AAC - Apply Remediation"
# Credentials: Ansible Vault + managed host SSH credential
# EE: AAC Compliance EE
# Survey:
#   action_id       — remediation_actions.id from 'Generate Remediation Playbook' (required)
#   dry_run         — true=preview only, false=apply (default: true)

- name: Fetch remediation plan from database
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - [ "../vars/vault_secrets.yml", "../vars/empty_fallback.yml" ]
    - ../vars/site_config.yml

  vars:
    pg_password: "{{ compliance_db_password }}"
    # dry_run: <set via extra_vars / survey / inventory>   # default 'true'

  tasks:

    # dry_run is a survey / extra-var input and may arrive as a boolean, a string
    # ('false'), null, or be absent. Resolve it ONCE into a real boolean that
    # fails closed: changes are applied only on an explicit false-ish value.
    # (A plain default('true', true) would turn boolean false into 'true' and
    # silently skip the apply.)
    - name: Resolve dry_run (apply only on an explicit false)
      ansible.builtin.set_fact:
        _apply_live: "{{ dry_run is defined and dry_run is not none and ((dry_run | string | trim | lower) in ['false', 'no', 'off', '0']) }}"

    - name: Validate inputs
      fail:
        msg: "action_id is required. Get it from 'AAC - Generate Remediation Playbook' output."
      when: action_id is not defined

    - name: Fetch remediation action record
      community.postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port | default(5433) }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        query: |
          SELECT
            id, hostname, action_type, performed_by,
            notes, generated_playbook,
            facts_before_id, facts_after_id,
            performed_at
          FROM remediation_actions
          WHERE id = %s
            AND action_type = 'generate_playbook'
        positional_args:
          - "{{ action_id | int }}"
      register: action_record

    - name: Fail if action not found
      fail:
        msg: "No generate_playbook action found with ID={{ action_id }}. Check the ID from Generate Remediation Playbook output."
      when: action_record.query_result | length == 0

    - name: Parse remediation plan
      set_fact:
        rplan: "{{ action_record.query_result[0].generated_playbook }}"
        target_hostname: "{{ action_record.query_result[0].hostname }}"

    - name: Fail if no auto tasks to apply
      fail:
        msg: >
          No auto-remediation tasks in action {{ action_id }}.
          This plan has {{ rplan.stats.auto }} auto-tasks.
          {% if rplan.stats.manual > 0 %}
          There are {{ rplan.stats.manual }} manual-review tasks — see the Generate output.
          {% endif %}
      when: rplan.auto_tasks | length == 0

    - name: Show plan summary before applying
      debug:
        msg: |
          ── Remediation Plan: Action ID {{ action_id }} ───────────────────
          Target host:    {{ target_hostname }}
          Baseline:       {{ rplan.baseline_label }}
          Generated at:   {{ rplan.generated_at }}
          Auto-tasks:     {{ rplan.stats.auto }}
          Manual-review:  {{ rplan.stats.manual }}
          Dry run:        {{ not (_apply_live | bool) }}
          ─────────────────────────────────────────────────────────────────
          {% for t in rplan.auto_tasks %}
          [{{ t.severity | upper }}] {{ t.name }}
          {% endfor %}
          ─────────────────────────────────────────────────────────────────
          {% if not (_apply_live | bool) %}
          DRY RUN MODE — no changes will be made.
          Re-run with dry_run=false to apply.
          {% else %}
          LIVE MODE — changes will be applied to {{ target_hostname }}
          {% endif %}

    # Write the generated tasks as an includable task file
    - name: Write generated tasks to temp file
      copy:
        dest: "/tmp/aac_remediation_tasks_{{ action_id }}.yml"
        content: |
          ---
          # Generated by AAC - Generate Remediation Playbook
          # Action ID: {{ action_id }}
          # Host:      {{ target_hostname }}
          # Baseline:  {{ rplan.baseline_label }}
          # Tasks:     {{ rplan.stats.auto }} auto-remediation tasks
          {% for t in rplan.auto_tasks %}
          - name: "[AAC {{ t.severity | upper }}] {{ t.name }}"
            {{ t.task | to_yaml | indent(2) }}
          {% endfor %}
      when: _apply_live | bool

    # Store target in fact for Play 2
    - name: Set target fact for Play 2
      set_fact:
        remediation_target: "{{ target_hostname }}"
        remediation_action_id: "{{ action_id }}"
        remediation_baseline: "{{ rplan.baseline_label }}"
        remediation_task_count: "{{ rplan.stats.auto }}"


# ─────────────────────────────────────────────────────────────────────────────
# Play 2: Apply tasks on target host
# ─────────────────────────────────────────────────────────────────────────────

- name: Apply remediation tasks on target host
  hosts: "{{ hostvars['localhost']['remediation_target'] | default('none') }}"
  gather_facts: false
  become: true

  vars:
    _apply_live:   "{{ hostvars['localhost']['_apply_live'] | default(false) | bool }}"
    action_id:     "{{ hostvars['localhost']['remediation_action_id'] }}"
    task_count:    "{{ hostvars['localhost']['remediation_task_count'] }}"
    baseline_label: "{{ hostvars['localhost']['remediation_baseline'] }}"

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Restart auditd
      ansible.builtin.service:
        name: auditd
        state: restarted

  tasks:

    - name: Skip if dry run
      debug:
        msg: "DRY RUN: Would apply {{ task_count }} remediation tasks from action {{ action_id }}. Set dry_run=false to apply."
      when: not (_apply_live | bool)

    - name: Apply generated remediation tasks
      ansible.builtin.include_tasks:
        file: "/tmp/aac_remediation_tasks_{{ action_id }}.yml"
      when: _apply_live | bool

    - name: Collect updated SELinux status
      ansible.builtin.command: getenforce
      register: selinux_post
      changed_when: false
      failed_when: false
      when: _apply_live | bool

    - name: Verify sshd config syntax
      ansible.builtin.command: sshd -t
      register: sshd_test
      changed_when: false
      failed_when: sshd_test.rc != 0
      when: _apply_live | bool


# ─────────────────────────────────────────────────────────────────────────────
# Play 3: Log completion and prompt for re-collect
# ─────────────────────────────────────────────────────────────────────────────

- name: Log remediation completion
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - [ "../vars/vault_secrets.yml", "../vars/empty_fallback.yml" ]
    - ../vars/site_config.yml

  vars:
    pg_password:    "{{ compliance_db_password }}"
    _apply_live:    "{{ hostvars['localhost']['_apply_live'] | default(false) | bool }}"
    action_id:      "{{ hostvars['localhost']['remediation_action_id'] }}"
    target_hostname: "{{ hostvars['localhost']['remediation_target'] }}"
    task_count:     "{{ hostvars['localhost']['remediation_task_count'] }}"

  tasks:

    - name: Log remediation applied to audit trail
      community.postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port | default(5433) }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        query: |
          INSERT INTO remediation_actions
            (hostname, action_type, performed_by, notes)
          VALUES
            (%s, 'manual_fix', 'aap_admin',
             %s)
        positional_args:
          - "{{ target_hostname }}"
          - "Remediation applied from action {{ action_id }} ({{ task_count }} tasks, dry_run={{ not (_apply_live | bool) }})"
      when: _apply_live | bool

    - name: Update remediation_status to in_progress
      community.postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port | default(5433) }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        query: |
          UPDATE remediation_status
          SET status       = 'in_progress',
              owner        = 'aap_admin',
              updated_at   = now(),
              notes        = COALESCE(notes, '') || ' [Remediation applied ' || now()::date::text || ' action=' || %s || ']'
          WHERE hostname   = %s
            AND status NOT IN ('resolved', 'accepted_risk')
        positional_args:
          - "{{ action_id }}"
          - "{{ target_hostname }}"
      when: _apply_live | bool

    - name: Clean up temp task file
      file:
        path: "/tmp/aac_remediation_tasks_{{ action_id }}.yml"
        state: absent
      when: _apply_live | bool

    - name: Print completion message
      debug:
        msg: |
          ══════════════════════════════════════════════════════════════════
          AAC REMEDIATION {% if not (_apply_live | bool) %}DRY RUN COMPLETE{% else %}APPLIED{% endif %}

          Host:          {{ target_hostname }}
          Action ID:     {{ action_id }}
          Tasks:         {{ task_count }}
          {% if not (_apply_live | bool) %}

          No changes were made. This was a dry run.
          To apply: Re-run with dry_run=false
          {% else %}

          ✅ Remediation tasks applied.
          Remediation_status updated to 'in_progress'.

          ── IMPORTANT: Next Steps ─────────────────────────────────────────
          1. Run 'AAC - Collect Facts' for {{ target_hostname }}
             This captures the post-remediation state.

          2. Run 'AAC - Compare to Baseline' for {{ target_hostname }}
             Verify the host now matches baseline.

          3. Run 'AAC - Evaluate Stored Facts' for {{ target_hostname }}
             Update compliance scores.

          If the host still shows violations after re-collection:
          - The generated tasks may need adjustment
          - Some controls require a system restart to take effect
          - Manual remediation may be needed for remaining items
          {% endif %}
          ══════════════════════════════════════════════════════════════════
