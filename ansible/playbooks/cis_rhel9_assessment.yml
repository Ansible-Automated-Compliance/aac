---
# CIS RHEL 9 Compliance Assessment using OPA
#
# Collects the full Linux compliance fact set (the same collector the stored-
# facts path uses), maps it to the CIS input shape (the same mapper), evaluates
# it at the gated /main/compliance_report endpoint, and stores what OPA
# reports — never a locally computed score.
#
# History (2026-10-12): the previous version sent an ansible_facts-only payload
# (1 of the 59 input sections the RHEL 9 modules read), computed the score in
# the playbook as (338 - violations) / 338, and treated an unreachable OPA as
# zero violations — so a connection failure stored as a 100% result. All three
# are gone: shared collector, shared mapper, gated report, fail closed.

- name: CIS RHEL 9 Compliance Assessment
  hosts: all
  gather_facts: yes
  become: yes

  vars_files:
    - [ "../vars/vault_secrets.yml", "../vars/empty_fallback.yml" ]
    - ../vars/site_config.yml

  vars:
    opa_server_url: "{{ opa_security_url }}"
    policy_package: "cis_rhel9"
    report_dir: "{{ playbook_dir }}/../../reports"
    timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
    facts_schema_version: "2.0"
    pg_db: "compliance"
    pg_user: "postgres"
    pg_password: "{{ compliance_db_password | mandatory }}"

  tasks:
    - name: Ensure report directory exists
      file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: no
      run_once: true

    # ── Collect: the shared Linux compliance fact collector ──────────────────
    - name: Collect Linux compliance facts (shared collector)
      include_tasks: ../tasks/collect_linux_compliance_facts.yml

    # ── Map: the shared facts → OPA input mapper (no fabricated values) ───────
    - name: Build OPA input from collected facts (shared mapper)
      include_tasks: ../tasks/cis_linux_build_opa_input.yml
      vars:
        facts_data: "{{ combined_facts }}"
        opa_hostname: "{{ inventory_hostname }}"

    - name: Save OPA input to local file
      copy:
        content: "{{ opa_input | to_nice_json }}"
        dest: "{{ report_dir }}/{{ inventory_hostname }}_facts_{{ timestamp }}.json"
      delegate_to: localhost
      become: no

    # ── Evaluate: the gated report endpoint ──────────────────────────────────
    - name: Query OPA — CIS RHEL 9 compliance report
      uri:
        use_proxy: false
        url: "{{ opa_server_url }}/v1/data/{{ policy_package }}/main/compliance_report"
        method: POST
        body_format: json
        body:
          input: "{{ opa_input }}"
        return_content: yes
        status_code: 200
      register: opa_response
      delegate_to: localhost
      become: no
      failed_when: false

    - name: Refuse to fabricate a result when OPA did not answer
      ansible.builtin.assert:
        that:
          - (opa_response.status | default(-1)) == 200
          - opa_response.json.result is defined
          - opa_response.json.result.total_controls is defined
          - opa_response.json.result.assessment_coverage_percentage is defined
          - opa_response.json.result.sections_not_assessed is defined
        fail_msg: >-
          OPA did not return an evaluation (status
          {{ opa_response.status | default('no connection') }} from
          {{ opa_server_url }}). Refusing to continue: no answer from the policy
          engine means NO ASSESSMENT, never a clean one.
          OPA said: {{ (opa_response.json | default(opa_response.content | default(opa_response.msg | default('nothing')))) | to_json | truncate(600) }}

    - name: Parse OPA report
      set_fact:
        compliance_result: "{{ opa_response.json.result }}"
        assessment_timestamp: "{{ ansible_date_time.iso8601 }}"

    - name: Extract report fields
      set_fact:
        violations: "{{ compliance_result.violations | default([]) }}"
        is_compliant: "{{ compliance_result.compliant | default(false) | bool }}"
        total_controls: "{{ compliance_result.total_controls | int }}"
        passed_controls: "{{ compliance_result.passed_controls | default(0) | int }}"
        failed_controls: "{{ compliance_result.failed_controls | default(0) | int }}"
        compliance_score: "{{ compliance_result.compliance_percentage | default(0) | float }}"
        sections_not_assessed: "{{ compliance_result.sections_not_assessed | default([]) }}"
        assessment_coverage_pct: "{{ compliance_result.assessment_coverage_percentage | default(0) | int }}"
        controls_basis: "{{ compliance_result.controls_basis | default('') }}"

    - name: Generate compliance report
      copy:
        content: "{{ {
            'assessment_metadata': {
              'hostname': inventory_hostname,
              'ip_address': ansible_default_ipv4.address | default('unknown'),
              'assessment_time': assessment_timestamp,
              'benchmark': compliance_result.benchmark | default('CIS Red Hat Enterprise Linux 9 Benchmark v3.0.0'),
              'policy_package': policy_package,
              'opa_server': opa_server_url,
              'controls_basis': controls_basis
            },
            'system_info': {
              'distribution': ansible_distribution,
              'distribution_version': ansible_distribution_version,
              'kernel': ansible_kernel,
              'architecture': ansible_architecture
            },
            'compliance_summary': {
              'is_compliant': is_compliant,
              'total_controls': total_controls | int,
              'passed_controls': passed_controls | int,
              'failed_controls': failed_controls | int,
              'compliance_percentage': compliance_score | float,
              'assessment_coverage_percentage': assessment_coverage_pct | int,
              'sections_not_assessed': sections_not_assessed
            },
            'violations': violations
          } | to_nice_json }}"
        dest: "{{ report_dir }}/{{ inventory_hostname }}_compliance_report_{{ timestamp }}.json"
      delegate_to: localhost
      become: no

    - name: Display compliance summary
      debug:
        msg: |
          ========================================
          CIS RHEL 9 Compliance Assessment Results
          ========================================
          Hostname: {{ inventory_hostname }}
          Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_kernel }}, {{ ansible_architecture }})

          Compliance Status: {{ 'COMPLIANT' if is_compliant else 'NON-COMPLIANT' }}
          Controls ({{ controls_basis }}): {{ total_controls }}
          Passed / Failed: {{ passed_controls }} / {{ failed_controls }}
          Compliance: {{ compliance_score }}%
          Assessment coverage: {{ assessment_coverage_pct }}% of sections assessed
          Sections NOT assessed: {{ sections_not_assessed | join(', ') if sections_not_assessed else 'none' }}

          Report saved to: {{ report_dir }}/{{ inventory_hostname }}_compliance_report_{{ timestamp }}.json
          ========================================

    - name: List top 10 violations (if any)
      debug:
        msg: "{{ violations[:10] }}"
      when: violations | length > 0

    # -------------------------------------------------------------------------
    # Store results to PostgreSQL — plus a Certifiable Audit Artifact (CAA) row
    # in compliance_certifications for auditor evidence. See
    # docs/strategy/AAC_CERTIFIABLE_AUDIT_ARTIFACT_SPEC.md.
    # Every number below comes from OPA's report; nothing is computed here.
    # -------------------------------------------------------------------------
    - name: Store CIS RHEL 9 results to PostgreSQL
      include_role:
        name: aac_store_results
      vars:
        aac_result_framework:      "cis_rhel9"
        aac_result_policy_name:    "CIS RHEL 9"
        aac_result_policy_version: "{{ compliance_result.benchmark | default('CIS Red Hat Enterprise Linux 9 Benchmark v3.0.0') }}"
        aac_result_total_controls: "{{ total_controls | int }}"
        aac_result_violations:     "{{ violations }}"
        aac_result_failed_controls: "{{ failed_controls | int }}"
        aac_result_passed_controls: "{{ passed_controls | int }}"
        aac_result_compliance_pct:  "{{ compliance_score | float }}"
        aac_result_metadata: "{{ {'hostname': inventory_hostname, 'ip_address': ansible_default_ipv4.address | default('unknown'), 'distribution': ansible_distribution, 'distribution_version': ansible_distribution_version, 'kernel': ansible_kernel, 'architecture': ansible_architecture, 'assessment_time': assessment_timestamp, 'is_compliant': is_compliant, 'controls_basis': controls_basis, 'assessment_coverage_percentage': assessment_coverage_pct | int, 'sections_not_assessed': sections_not_assessed, 'evaluation_endpoint': 'main/compliance_report', 'facts_schema_version': facts_schema_version} }}"
        aac_result_opa_server: "{{ opa_server_url }}"
        # CAA opt-in — writes one compliance_certifications row per assessed host.
        # Pass-through vars use aac_result_caa_* naming to avoid Jinja recursion
        # in the wrapper role — see aac_store_results/tasks/main.yml for details.
        aac_caa_enabled: true
        aac_result_caa_framework_version: "v2.0.0"
        aac_result_caa_result:
          framework:             "cis_rhel9"
          benchmark:             "{{ compliance_result.benchmark | default('CIS Red Hat Enterprise Linux 9 Benchmark v3.0.0') }}"
          policy_package:        "{{ policy_package }}"
          compliant:             "{{ is_compliant | bool }}"
          compliance_percentage: "{{ compliance_score | float }}"
          total_controls:        "{{ total_controls | int }}"
          passed_controls:       "{{ passed_controls | int }}"
          failed_controls:       "{{ failed_controls | int }}"
          assessment_coverage_percentage: "{{ assessment_coverage_pct | int }}"
          sections_not_assessed: "{{ sections_not_assessed }}"
          violations:            "{{ violations }}"
        aac_result_caa_input: "{{ opa_input }}"

    - name: Results stored to PostgreSQL
      debug:
        msg: "Stored CIS RHEL 9 result for {{ inventory_hostname }}: {{ compliance_score }}% ({{ passed_controls }}/{{ total_controls }} controls, coverage {{ assessment_coverage_pct }}%)"

    - name: "📊 View results in Grafana"
      debug:
        msg: "{{ grafana_url | default('grafana_url not set in this environment', true) }}"
      run_once: true
