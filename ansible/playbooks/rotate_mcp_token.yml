---
# AAC — Rotate MCP Token
#
# Creates a new long-lived AAP token, updates the MCP server container,
# and writes the token to /opt/aap-mcp-server/mcp.env for systemd to use.
#
# After running this job:
#   1. MCP server on port 8004 will use the new token immediately
#   2. Update ~/.claude.json on your Mac with the new token printed below
#
# AAP Job Template: "AAC - Rotate MCP Token"
#
# Survey variables:
#   aap_admin_password:  AAP admin password (use AAP credential, not plaintext)

- name: Rotate AAP MCP Server Token
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/site_config.yml

  vars:
    # aap_host: <set via extra_vars / survey / inventory>   # default aac_host
    aap_user:    "{{ aap_ssh_user }}"
    token_desc:  "Claude Code MCP Token (auto-rotated {{ ansible_date_time.date | default('') }})"

  tasks:

    # -------------------------------------------------------------------------
    # 1. Create new AAP token (1 year expiry)
    # -------------------------------------------------------------------------
    - name: Create new AAP token
      uri:
        use_proxy: false
        url: "{{ aap_url }}/api/gateway/v1/tokens/"
        method: POST
        body_format: json
        body:
          description: "{{ token_desc }}"
          scope: "write"
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer {{ aap_token }}"
        status_code: 201
        validate_certs: false
      register: new_token_response

    - name: Extract new token value
      set_fact:
        new_token: "{{ new_token_response.json.token }}"
        new_token_id: "{{ new_token_response.json.id }}"

    # -------------------------------------------------------------------------
    # 2. Write token to mcp.env and restart container via AAP host SSH
    #    Note: delegate_to requires a machine credential in the job template.
    #    Template 40 must have the aapuser1 machine credential attached.
    # -------------------------------------------------------------------------
    - name: Write new token to /opt/aap-mcp-server/mcp.env
      ansible.builtin.copy:
        dest: /opt/aap-mcp-server/mcp.env
        owner: "{{ aap_user }}"
        group: "{{ aap_user }}"
        mode: "0600"
        content: |
          # AAP MCP Server environment variables
          # Auto-generated by rotate_mcp_token.yml
          AAP_TOKEN={{ new_token }}
      delegate_to: "{{ (aap_host | default(aac_host)) }}"
      become: true
      become_user: root
      no_log: true

    # -------------------------------------------------------------------------
    # 3. Restart MCP container with new token
    # -------------------------------------------------------------------------
    - name: Stop and remove existing MCP container
      ansible.builtin.shell: |
        podman stop aap-mcp 2>/dev/null || true
        podman rm aap-mcp 2>/dev/null || true
      delegate_to: "{{ (aap_host | default(aac_host)) }}"
      changed_when: false

    - name: Start MCP container with new token
      ansible.builtin.shell: |
        podman run -d \
          --name aap-mcp \
          -p 8004:8004 \
          --restart=always \
          -v /opt/aap-mcp-server:/app:rw \
          -e AAP_GATEWAY_URL=https://host.containers.internal \
          -e AAP_SERVICE_URL=https://host.containers.internal/api/controller/v2 \
          -e CONTROLLER_OPENAPI_SPEC_URL=file:///app/aap-controller-api.json \
          -e AAP_TOKEN={{ new_token }} \
          -e PYTHONPATH=/app \
          -e HOST=0.0.0.0 \
          -e PORT=8004 \
          {{ mcp_image }} \
          python /app/server.py
      delegate_to: "{{ (aap_host | default(aac_host)) }}"
      no_log: true

    # -------------------------------------------------------------------------
    # 4. Verify MCP server is responding
    # -------------------------------------------------------------------------
    - name: Wait for MCP server to become ready
      uri:
        use_proxy: false
        url: "http://{{ (aap_host | default(aac_host)) }}:8004/"
        method: GET
        status_code: [200, 404]  # 404 is expected for root path
        timeout: 5
        validate_certs: false
      register: mcp_health
      until: mcp_health.status in [200, 404]
      retries: 12
      delay: 5

    # -------------------------------------------------------------------------
    # 5. Print instructions for updating ~/.claude.json
    # -------------------------------------------------------------------------
    - name: Print token rotation summary
      debug:
        msg:
          - ""
          - "=============================================================="
          - "  AAC MCP TOKEN ROTATION — Complete"
          - "=============================================================="
          - ""
          - "  ✅ New token created (ID: {{ new_token_id }})"
          - "  ✅ /opt/aap-mcp-server/mcp.env updated on {{ (aap_host | default(aac_host)) }}"
          - "  ✅ MCP container restarted with new token"
          - "  ✅ MCP server health: {{ mcp_health.status }}"
          - ""
          - "  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "  ACTION REQUIRED ON YOUR MAC:"
          - ""
          - "  Run this command to update ~/.claude.json:"
          - ""
          - "  python3 -c \""
          - "  import json, os"
          - "  with open(os.path.expanduser('~/.claude.json'), 'r') as f: d = json.load(f)"
          - "  proj = '<path-to-aac-repo>'"
          - "  d['projects'][proj]['mcpServers']['aap']['headers']['Authorization'] = 'Bearer NEW_TOKEN'"
          - "  with open(os.path.expanduser('~/.claude.json'), 'w') as f: json.dump(d, f, indent=2)"
          - "  \""
          - ""
          - "  Replace NEW_TOKEN with the token shown in the AAP job detail"
          - "  (token value not shown here for security — check mcp.env on the server)"
          - "  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "=============================================================="
