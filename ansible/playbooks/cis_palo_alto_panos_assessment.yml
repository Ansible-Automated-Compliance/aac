---
# cis_palo_alto_panos_assessment.yml — CIS Palo Alto Firewall 11 Benchmark v1.2.1
#
# Reads each firewall's running configuration and license state over the PAN-OS
# XML API, maps them to the policy input (collection aac.panos), evaluates
# cis_palo_alto_panos in OPA and stores one result per firewall.
#
# Nothing runs on the firewall and nothing is changed on it: three read-only
# operational requests (show config running, request license info, show system
# info). No Palo Alto collection or Python library is needed in the execution
# environment.
#
# AAP job template
#   Inventory   : a group of firewalls (default group name: panos_firewalls),
#                 each host with ansible_host set to its management address
#   Credentials : a credential that injects panos_api_key (custom type, see
#                 collections/ansible_collections/aac/panos/README.md) and the
#                 AAC database credential
#   Extra vars  : panos_site (zones and URL categories), panos_attest,
#                 panos_cis_level (1 or 2), panos_vsys
#
# Panorama is not a target: point the inventory at the firewalls. Policy pushed
# from Panorama is not in a firewall's local running configuration; see the
# collection README for what that means for the result.

- name: CIS Palo Alto Firewall Compliance Assessment
  hosts: "{{ panos_hosts | default('panos_firewalls') }}"
  connection: local
  gather_facts: false

  vars_files:
    - [ "../vars/vault_secrets.yml", "../vars/empty_fallback.yml" ]
    - ../vars/site_config.yml

  vars:
    opa_server_url:      "{{ opa_security_url }}"
    policy_package:      "cis_palo_alto_panos"
    policy_version:      "CIS Palo Alto Firewall 11 Benchmark v1.2.1"
    report_dir:          "/tmp/compliance_assessments"
    timestamp:           "{{ lookup('pipe','date +%Y%m%dT%H%M%S') }}"
    # false = assess and print, store nothing (first run against a new device)
    panos_store_results: true

  tasks:

    - name: Collect the configuration and build the policy input
      ansible.builtin.include_role:
        name: aac.panos.panos_cis_collect
        public: true   # the role's defaults (panos_host, panos_vsys, ...) are read below

    - name: Ensure report directory exists
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    # The mapped facts hold no secrets (the mapper copies only what the policy
    # reads), so they are kept beside the result like every other assessment.
    - name: Save facts JSON
      ansible.builtin.copy:
        content: "{{ panos_cis_opa_input | to_nice_json }}"
        dest: "{{ report_dir }}/{{ inventory_hostname }}_panos_facts_{{ timestamp }}.json"
        mode: '0600'
      delegate_to: localhost

    # ── OPA evaluation ─────────────────────────────────────────────────────────

    - name: Query OPA — CIS Palo Alto Firewall
      ansible.builtin.uri:
        use_proxy: false
        url: "{{ opa_server_url }}/v1/data/{{ policy_package }}/main/compliance_report"
        method: POST
        body_format: json
        body:
          input: "{{ panos_cis_opa_input }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ aac_validate_certs | default(aap_validate_certs | default(true)) | bool }}"
      register: opa_response
      delegate_to: localhost
      failed_when: false

    - name: Fail loudly if OPA did not return a scored result
      ansible.builtin.fail:
        msg: >-
          OPA query to {{ opa_server_url }}/v1/data/{{ policy_package }}/main/compliance_report did
          not return a report (status={{ opa_response.status | default('n/a') }}). Aborting rather
          than storing a misleading 0%. Check the OPA service is reachable and that the
          cis_network_devices framework is enrolled and loaded (it carries {{ policy_package }}).
      when: >-
        (opa_response.status | default(0)) != 200
        or (opa_response.json.result | default(None)) is none
        or (opa_response.json.result.total_controls | default(0) | int) == 0

    - name: Parse OPA response
      ansible.builtin.set_fact:
        compliance_result: "{{ opa_response.json.result }}"

    # Report violations are "<id>: <message>" strings.
    - name: Normalise violations list
      ansible.builtin.set_fact:
        cis_violations: >-
          {%- set viols = [] -%}
          {%- for v in (compliance_result.violations | default([])) -%}
            {%- set text = v | string -%}
            {%- set cid = text.split(':')[0] | trim -%}
            {%- set _ = viols.append({
                  'control_id': cid if (cid | regex_search('^[0-9]+(\\.[0-9]+)*$')) else '',
                  'message': text,
                  'severity': 'high',
                  'evidence_missing': ('evidence missing' in text)}) -%}
          {%- endfor -%}
          {{ viols }}

    # ── Store to PostgreSQL ────────────────────────────────────────────────────

    - name: Store results to PostgreSQL
      ansible.builtin.include_role:
        name: aac_store_results
      vars:
        aac_result_policy_name:     "CIS Palo Alto Firewall"
        aac_result_framework:       "{{ policy_package }}"
        aac_result_policy_version:  "{{ policy_version }}"
        aac_result_hostname:        "{{ panos_device_info.hostname | default(inventory_hostname, true) }}"
        aac_result_total_controls:  "{{ compliance_result.total_controls | int }}"
        aac_result_failed_controls: "{{ compliance_result.failed_controls | int }}"
        aac_result_passed_controls: "{{ compliance_result.passed_controls | int }}"
        aac_result_violations:      "{{ cis_violations }}"
        aac_result_compliance_pct:  "{{ compliance_result.compliance_percentage | default(0) | float }}"
        aac_result_compliant:       "{{ (compliance_result.failed_controls | int) == 0 }}"
        aac_result_metadata:
          hostname:           "{{ panos_device_info.hostname | default(inventory_hostname, true) }}"
          inventory_hostname: "{{ inventory_hostname }}"
          ip_address:         "{{ panos_host }}"
          version:            "{{ panos_device_info.sw_version | default('unknown') }}"
          model:              "{{ panos_device_info.model | default('unknown') }}"
          serial:             "{{ panos_device_info.serial | default('unknown') }}"
          platform:           "panos"
          device_type:        "firewall"
          vsys:               "{{ panos_vsys }}"
          cis_profile_level:  "{{ panos_cis_level | int }}"
          collection_method:  "PAN-OS XML API: show config running, request license info, show system info"
          collection:         "{{ panos_collection }}"
          attested:           "{{ (panos_attest | default({}, true)).keys() | list | sort }}"
          assessment_time:    "{{ lookup('pipe','date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          opa_server:         "{{ opa_server_url }}"
      when: panos_store_results | bool

    # ── Summary ────────────────────────────────────────────────────────────────

    - name: Compliance assessment complete
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "  CIS Palo Alto Firewall Assessment"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "  Host       : {{ panos_device_info.hostname | default(inventory_hostname, true) }} ({{ panos_host }})"
          - "  Version    : PAN-OS {{ panos_device_info.sw_version | default('unknown') }}"
          - "  Profile    : Level {{ panos_cis_level | int }}, {{ panos_vsys }}"
          - "  Controls   : {{ compliance_result.passed_controls }} passed, {{ compliance_result.failed_controls }} failed of {{ compliance_result.total_controls }}"
          - "  Compliance : {{ compliance_result.compliance_percentage | default(0) }}%"
          - "  Evidence   : {{ cis_violations | selectattr('evidence_missing') | list | length }} recommendation(s) report evidence missing"
          - "  DB         : {{ 'stored to compliance_results' if (panos_store_results | bool) else 'NOT stored (panos_store_results=false)' }}"
          - "  Facts      : {{ report_dir }}/{{ inventory_hostname }}_panos_facts_{{ timestamp }}.json"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
