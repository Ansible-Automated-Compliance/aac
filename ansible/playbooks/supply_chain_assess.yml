---
# Software supply-chain assessment — gather supply-chain facts, evaluate against
# the supply-chain spine (benchmarks/supply_chain/*), and store the result.
#
# Facts -> OPA -> PostgreSQL, the same pipeline as every other AAC assessment.
# The facts here are supply-chain facts: repo source-integrity (GitHub branch
# protection — the control AAC dogfoods), an SBOM, and operator-supplied
# provenance/signing/dependency/vulnerability/build inputs (from other feeds,
# e.g. the portal's KEV/OSV matching). scripts/supply_chain_facts.py assembles
# them into the input contract; fail-closed on anything absent.
#
# PREREQUISITE: the supply-chain Rego must be loaded into the compliance OPA
# (policies/benchmarks/supply_chain/, pending rego PR #111 + a submodule bump).
#
# ── Variables ────────────────────────────────────────────────────────
#   sc_repo            (required) "owner/name" — the repo to assess source integrity of
#   sc_branch          default main
#   sc_github_token    GitHub token (repo admin read) — from vault
#   sc_sbom_path       path to a CycloneDX SBOM on the controller (optional)
#   sc_extra_sources   dict merged into raw sources (provenance/signing/deps/vulns/build/artifact)
#   sc_target_host     asset identity for the stored result (default: sc_repo)
#   sc_opa_url         OPA compliance endpoint
#   record_to_db       true|false (default true)
#
# ── AAP Job Template ─────────────────────────────────────────────────
#   "AAC - Supply-Chain Assessment"

- name: Software supply-chain assessment
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/site_config.yml

  vars:
    # sc_repo: <set via extra_vars / survey / inventory>
    sc_branch: "main"
    sc_github_token: "{{ vault_github_pat | default('') }}"
    # sc_sbom_path: <set via extra_vars / survey / inventory>
    sc_extra_sources: {}
    sc_target_host: "{{ (sc_repo | default('', true)) }}"
    # No literal fallback — opa_compliance_url comes from site_config.yml
    # (hardcoded in-cluster endpoints fail the Ansible Validation CI gate).
    sc_opa_url: "{{ opa_compliance_url }}"
    record_to_db: true
    _assembler: "{{ playbook_dir }}/../../scripts/supply_chain_facts.py"
    _tmp_raw: "/tmp/sc-raw-{{ (sc_repo | default('', true)) | regex_replace('[^A-Za-z0-9]', '_') }}.json"

  tasks:
    - name: Require opa_compliance_url (no in-cluster literal fallback by design)
      # sc_opa_url is sourced from opa_compliance_url (site_config.yml). If it is
      # undefined OR left blank the play would otherwise fail later with an
      # opaque uri/URL error — assert up front, fail-loud, matching the repo's
      # config pattern (| mandatory / preflight asserts elsewhere). `| mandatory`
      # alone would not catch a blank value, so check non-empty explicitly.
      ansible.builtin.assert:
        that:
          - opa_compliance_url is defined
          - (opa_compliance_url | trim | length) > 0
        fail_msg: >-
          opa_compliance_url is not set. It must come from site_config.yml —
          there is no hardcoded in-cluster fallback (that would fail the
          Ansible Validation endpoint gate). Set opa_compliance_url and re-run.
        success_msg: opa_compliance_url is set.

    - name: Validate sc_repo and sc_branch before they reach the GitHub API URL
      # These are interpolated into the request URL; constrain them to safe
      # owner/name and branch shapes so they cannot alter the host or path.
      ansible.builtin.assert:
        that:
          - sc_repo is match('^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$')
          - sc_branch is match('^[A-Za-z0-9._/-]+$')
        fail_msg: >-
          sc_repo must be 'owner/name' and sc_branch a valid branch name
          (both are interpolated into the GitHub API URL).

    # ── Source integrity: GitHub branch protection ────────────────────
    - name: Fetch branch protection
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ (sc_repo | default('', true)) }}/branches/{{ sc_branch }}/protection"
        headers:
          Authorization: "Bearer {{ sc_github_token }}"
          Accept: "application/vnd.github+json"
        status_code: [200, 404]   # 404 = unprotected branch (fail-closed downstream)
      register: _protection
      no_log: true   # the request carries the GitHub token in its headers
      when: sc_github_token | length > 0

    - name: Fetch required-signatures state
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ (sc_repo | default('', true)) }}/branches/{{ sc_branch }}/protection/required_signatures"
        headers:
          Authorization: "Bearer {{ sc_github_token }}"
          Accept: "application/vnd.github+json"
        status_code: [200, 404]
      register: _signatures
      no_log: true   # the request carries the GitHub token in its headers
      when: sc_github_token | length > 0

    - name: Read the SBOM if provided
      ansible.builtin.slurp:
        src: "{{ (sc_sbom_path | default('', true)) }}"
      register: _sbom_raw
      when: (sc_sbom_path | default('', true)) | length > 0

    # ── Assemble the raw sources, then normalise with the collector ───
    - name: Build the raw-sources document
      # Only emit the GitHub keys when a token was supplied (the protection tasks
      # actually ran). Without a token the source was NOT measured, so the keys are
      # omitted entirely — the normalizer then drops the `source` section and the
      # Rego reports it unsatisfied as "unknown/absent", rather than asserting an
      # unprotected branch. `github_protection: {}` is reserved for the real case:
      # a token was used and GitHub returned 404 (branch genuinely unprotected).
      ansible.builtin.copy:
        dest: "{{ _tmp_raw }}"
        mode: "0600"
        content: >-
          {{
            ({}
              | combine(
                  {
                    'github_protection': (_protection.json | default({})) if (_protection.status | default(404)) == 200 else {},
                    'required_signatures': ((_signatures.json | default({})).enabled | default(false))
                  } if (sc_github_token | length > 0) else {}
                )
              | combine({'sbom': (_sbom_raw.content | b64decode | from_json)} if ((sc_sbom_path | default('', true)) | length > 0) else {})
              | combine(sc_extra_sources)
            ) | to_nice_json
          }}

    - name: Normalise into the supply-chain input contract
      ansible.builtin.command:
        argv: [python3, "{{ _assembler }}", "{{ _tmp_raw }}"]
      register: _facts_raw
      changed_when: false

    - name: Load facts
      ansible.builtin.set_fact:
        _sc_facts: "{{ _facts_raw.stdout | from_json }}"

    # ── Evaluate against the supply-chain spine ───────────────────────
    - name: Evaluate the baseline (the spine)
      ansible.builtin.uri:
        url: "{{ sc_opa_url }}/v1/data/supply_chain/baseline/compliance_report"
        method: POST
        body_format: json
        body: { "input": "{{ _sc_facts }}" }
      register: _baseline

    - name: Evaluate the coverage triage
      ansible.builtin.uri:
        url: "{{ sc_opa_url }}/v1/data/supply_chain/coverage/report"
        method: POST
        body_format: json
        body: { "input": "{{ _sc_facts }}" }
      register: _coverage

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Supply-chain assessment — {{ (sc_repo | default('', true)) }}@{{ sc_branch }}"
          - "  baseline: {{ _baseline.json.result.passed_controls }}/{{ _baseline.json.result.total_controls }} = {{ _baseline.json.result.compliance_percentage }}%  ({{ 'COMPLIANT' if _baseline.json.result.compliant else 'NON-COMPLIANT' }})"
          - "  evaluation depth: {{ _coverage.json.result.evaluation_depth | default('n/a') }} (footprint {{ _coverage.json.result.touched_families | default([]) }})"

    - name: Record the supply-chain result (waiver-aware)
      ansible.builtin.include_role:
        name: aac_store_results
      vars:
        aac_result_hostname: "{{ sc_target_host }}"
        aac_result_policy_name: "AAC Supply-Chain Baseline"
        aac_result_framework: "supply_chain_baseline"
        aac_result_policy_version: "spine"
        aac_result_total_controls: "{{ _baseline.json.result.total_controls | int }}"
        aac_result_passed_controls: "{{ _baseline.json.result.passed_controls | int }}"
        aac_result_failed_controls: "{{ _baseline.json.result.failed_controls | int }}"
        aac_result_compliance_pct: "{{ _baseline.json.result.compliance_percentage | float }}"
        aac_result_violations: "{{ _baseline.json.result.violations }}"
        aac_result_metadata:
          repo: "{{ (sc_repo | default('', true)) }}"
          branch: "{{ sc_branch }}"
          evaluation_depth: "{{ _coverage.json.result.evaluation_depth | default('n/a') }}"
          spine_footprint: "{{ _coverage.json.result.touched_families | default([]) }}"
          source_integrity: "{{ _sc_facts.source | default({}) }}"
        aac_result_opa_server: "{{ sc_opa_url }}"
      when: record_to_db | bool

    - name: Clean up the temp raw-sources file
      ansible.builtin.file:
        path: "{{ _tmp_raw }}"
        state: absent
