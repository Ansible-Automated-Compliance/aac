---
# AWS Compliance Lab - Destroy Infrastructure
# Terminates all lab resources to stop AWS charges
#
# Required AAP Credentials:
#   - Amazon Web Services credential
#
# Variables:
#   - aws_region: AWS region (default: us-east-1)
#   - lab_name: Name prefix used during provisioning (default: compliance-lab)

- name: Destroy AWS Compliance Lab
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    # aws_region: <set via extra_vars / survey / inventory>   # default 'us-east-1'
    # lab_name: <set via extra_vars / survey / inventory>   # default 'compliance-lab'

  tasks:
    - name: Display destruction parameters
      debug:
        msg:
          - "WARNING: This will terminate all resources for lab: {{ (lab_name | default('compliance-lab', true)) }}"
          - "Region: {{ (aws_region | default('us-east-1', true)) }}"

    # =========================================
    # Find and Terminate EC2 Instances
    # =========================================
    - name: Find lab instances
      amazon.aws.ec2_instance_info:
        region: "{{ (aws_region | default('us-east-1', true)) }}"
        filters:
          "tag:Project": "{{ (lab_name | default('compliance-lab', true)) }}"
          "instance-state-name":
            - running
            - stopped
            - pending
      register: lab_instances

    - name: Display instances to terminate
      debug:
        msg: "Found {{ lab_instances.instances | length }} instances to terminate"

    - name: Terminate EC2 instances
      amazon.aws.ec2_instance:
        instance_ids: "{{ lab_instances.instances | map(attribute='instance_id') | list }}"
        region: "{{ (aws_region | default('us-east-1', true)) }}"
        state: absent
        wait: yes
      when: lab_instances.instances | length > 0

    - name: Wait for instances to terminate
      pause:
        seconds: 30
      when: lab_instances.instances | length > 0

    # =========================================
    # Delete Security Groups
    # =========================================
    - name: Find VPC
      amazon.aws.ec2_vpc_net_info:
        region: "{{ (aws_region | default('us-east-1', true)) }}"
        filters:
          "tag:Name": "{{ (lab_name | default('compliance-lab', true)) }}-vpc"
      register: vpc_info

    - name: Delete Linux Security Group
      amazon.aws.ec2_security_group:
        name: "{{ (lab_name | default('compliance-lab', true)) }}-linux-sg"
        region: "{{ (aws_region | default('us-east-1', true)) }}"
        state: absent
      when: vpc_info.vpcs | length > 0
      ignore_errors: yes

    - name: Delete Windows Security Group
      amazon.aws.ec2_security_group:
        name: "{{ (lab_name | default('compliance-lab', true)) }}-windows-sg"
        region: "{{ (aws_region | default('us-east-1', true)) }}"
        state: absent
      when: vpc_info.vpcs | length > 0
      ignore_errors: yes

    # =========================================
    # Delete VPC Resources
    # =========================================
    - block:
        - name: Find subnets
          amazon.aws.ec2_vpc_subnet_info:
            region: "{{ (aws_region | default('us-east-1', true)) }}"
            filters:
              vpc-id: "{{ vpc_info.vpcs[0].vpc_id }}"
          register: subnets

        - name: Delete subnets
          amazon.aws.ec2_vpc_subnet:
            vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
            cidr: "{{ item.cidr_block }}"
            region: "{{ (aws_region | default('us-east-1', true)) }}"
            state: absent
          loop: "{{ subnets.subnets }}"
          ignore_errors: yes

        - name: Find route tables
          amazon.aws.ec2_vpc_route_table_info:
            region: "{{ (aws_region | default('us-east-1', true)) }}"
            filters:
              vpc-id: "{{ vpc_info.vpcs[0].vpc_id }}"
          register: route_tables

        - name: Delete non-main route tables
          amazon.aws.ec2_vpc_route_table:
            route_table_id: "{{ item.route_table_id }}"
            vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
            region: "{{ (aws_region | default('us-east-1', true)) }}"
            state: absent
          loop: "{{ route_tables.route_tables }}"
          when: not item.associations[0].main | default(false)
          ignore_errors: yes

        - name: Delete Internet Gateway
          amazon.aws.ec2_vpc_igw:
            vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
            region: "{{ (aws_region | default('us-east-1', true)) }}"
            state: absent
          ignore_errors: yes

        - name: Delete VPC
          amazon.aws.ec2_vpc_net:
            vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
            region: "{{ (aws_region | default('us-east-1', true)) }}"
            state: absent

      when: vpc_info.vpcs | length > 0
      ignore_errors: yes

    # =========================================
    # Delete Key Pairs
    # =========================================
    - name: Delete EC2 key pair (Linux)
      amazon.aws.ec2_key:
        name: "{{ (lab_name | default('compliance-lab', true)) }}-key"
        region: "{{ (aws_region | default('us-east-1', true)) }}"
        state: absent

    - name: Delete EC2 key pair (Windows RSA)
      amazon.aws.ec2_key:
        name: "{{ (lab_name | default('compliance-lab', true)) }}-key-win"
        region: "{{ (aws_region | default('us-east-1', true)) }}"
        state: absent

    # =========================================
    # Cleanup local files
    # =========================================
    - name: Remove local Linux SSH key file
      file:
        path: "/home/aapuser1/.ssh/{{ (lab_name | default('compliance-lab', true)) }}-key.pem"
        state: absent
      ignore_errors: yes

    - name: Remove local Windows SSH key file
      file:
        path: "/home/aapuser1/.ssh/{{ (lab_name | default('compliance-lab', true)) }}-key-win.pem"
        state: absent
      ignore_errors: yes

    - name: Display completion
      debug:
        msg: |

          =============================================
          AWS Compliance Lab Destroyed
          =============================================

          Lab Name: {{ (lab_name | default('compliance-lab', true)) }}
          Region: {{ (aws_region | default('us-east-1', true)) }}

          Deleted Resources:
            - EC2 Instances: {{ lab_instances.instances | length }}
            - Security Groups: 2
            - VPC and networking components
            - SSH Key Pair

          All AWS charges for this lab have stopped.

          =============================================
