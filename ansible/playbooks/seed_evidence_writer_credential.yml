---
# seed_evidence_writer_credential.yml — wire the evidence writer into AAP
#
# AAP jobs do not see site_config.yml or any vault file (both are gitignored
# and absent from a project checkout); secrets reach them through credential
# types that inject extra_vars. compliance_db_password arrives that way today
# ("AAC - Compliance DB (extra_vars)"). This seeder does the same for the
# evidence writer (docs/EVIDENCE_IMMUTABILITY.md):
#
#   1. credential type "AAC - Evidence Writer (extra_vars)": injects
#      compliance_writer_password and aac_evidence_writer_user as extra_vars
#      (a credential type in use cannot be edited, so this is a new type
#      rather than a change to the Compliance DB one)
#   2. credential "AAC Evidence Writer" of that type, password supplied once
#      from vault_secrets.lab.yml on the operator machine (or -e)
#   3. attaches that credential to every job template that already carries a
#      Compliance DB credential — those are, by construction, the templates
#      that write evidence
#
# Idempotent: type and credential are found-or-created, attachments are
# diffed. Safe to re-run after new templates are seeded.
#
# Run from an operator machine (site_config.yml + vault_secrets.lab.yml), or as
# a job template with the "AAP Token (extra_vars)" credential and
# -e compliance_writer_password=... (the API base is pinned to this controller;
# see seed_sales_demos_pack_schedule.yml for the model).
# AAP Job Template: "AAC - Seed Evidence Writer Credential"

- name: Seed the evidence writer credential and attach it to evidence-writing templates
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ew_credential_type_name: "AAC - Evidence Writer (extra_vars)"
    ew_credential_name: "AAC Evidence Writer"
    ew_writer_user: "{{ aac_evidence_writer_user | default('compliance_writer', true) }}"
    db_credential_type_name: "AAC - Compliance DB (extra_vars)"
    _validate_certs: "{{ aap_validate_certs | default(true) | bool }}"

  tasks:

    # ── Config and token: operator machine or AAP job template ───────────

    - name: Load optional local config (operator machine only)
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files: ["{{ playbook_dir }}/../vars/site_config.yml"]
          skip: true

    - name: Load optional local secrets (lab file first, then the generic one)
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files:
            - "{{ playbook_dir }}/../vars/vault_secrets.lab.yml"
            - "{{ playbook_dir }}/../vars/vault_secrets.yml"
          skip: true

    - name: Resolve controller URL and token
      ansible.builtin.set_fact:
        _aap_url: >-
          {{ (lookup('env', 'CONTROLLER_HOST') | default(lookup('env', 'AWX_HOST'), true)
              if (lookup('env', 'JOB_ID') | length > 0)
              else aap_url | default('')) | regex_replace('/+$', '') }}
        aap_api_token: "{{ aap_token | default(vault_aap_local_mcp_token | default('', true), true) }}"

    - name: Require a controller URL the token may be sent to, a token, and the writer password
      ansible.builtin.assert:
        that:
          - _aap_url | length > 0
          - _aap_url is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?$')
            or _aap_url is match('^http://[a-z0-9.-]+\\.svc(\\.cluster\\.local)?(:[0-9]+)?$')
          - aap_api_token | length > 0
          - compliance_writer_password | default('', true) | length > 0
          - compliance_writer_password | default('', true) != 'PLACEHOLDER'
        fail_msg: >-
          Need: a controller URL (https, or in-cluster http *.svc), an API token, and a
          real compliance_writer_password (not PLACEHOLDER) — from vault_secrets.lab.yml
          on the operator machine, or -e from AAP. Got url="{{ _aap_url }}".
        quiet: true

    - name: Set the API base
      ansible.builtin.set_fact:
        aap_api: "{{ _aap_url }}/api/controller/v2"

    - name: Pin the API base to this controller when running as an AAP job
      ansible.builtin.assert:
        that:
          - lookup('env', 'JOB_ID') | length == 0
            or (
              (lookup('env', 'CONTROLLER_HOST') | default(lookup('env', 'AWX_HOST'), true) | length > 0)
              and aap_api == ((lookup('env', 'CONTROLLER_HOST') | default(lookup('env', 'AWX_HOST'), true))
                              | regex_replace('/+$', '')) ~ '/api/controller/v2'
            )
        fail_msg: "Running as an AAP job: the API base must be this controller's own URL from the job environment."
        quiet: true

    - name: Set request headers
      ansible.builtin.set_fact:
        aap_headers:
          Authorization: "Bearer {{ aap_api_token }}"
          Content-Type:  "application/json"
      no_log: true

    # ── 1. Credential type ───────────────────────────────────────────────

    - name: Look up the evidence writer credential type
      ansible.builtin.uri:
        use_proxy: false
        url: "{{ aap_api }}/credential_types/?name={{ ew_credential_type_name | urlencode }}"
        headers: "{{ aap_headers }}"
        validate_certs: "{{ _validate_certs }}"
      register: ew_ct_lookup
      failed_when: ew_ct_lookup.json.count > 1

    - name: Create the evidence writer credential type (injects two extra_vars)
      ansible.builtin.uri:
        use_proxy: false
        url: "{{ aap_api }}/credential_types/"
        method: POST
        headers: "{{ aap_headers }}"
        validate_certs: "{{ _validate_certs }}"
        body_format: json
        body:
          name: "{{ ew_credential_type_name }}"
          description: >-
            Injects compliance_writer_password and aac_evidence_writer_user so evidence is
            stored as the INSERT-only compliance_writer role (docs/EVIDENCE_IMMUTABILITY.md).
          kind: cloud
          inputs:
            fields:
              - { id: compliance_writer_password, type: string, label: "Evidence writer password", secret: true }
              - { id: aac_evidence_writer_user,  type: string, label: "Evidence writer role", default: "compliance_writer" }
            required: ["compliance_writer_password"]
          injectors:
            extra_vars:
              # literal Jinja for AAP to evaluate at run time (escaped so this seeder does not template it)
              compliance_writer_password: "{{ '{{' }} compliance_writer_password {{ '}}' }}"
              aac_evidence_writer_user:   "{{ '{{' }} aac_evidence_writer_user | default('compliance_writer', true) {{ '}}' }}"
        status_code: [200, 201]
      register: ew_ct_created
      when: ew_ct_lookup.json.count == 0

    - name: Resolve the credential type id
      ansible.builtin.set_fact:
        ew_ct_id: "{{ ew_ct_lookup.json.results[0].id if ew_ct_lookup.json.count == 1 else ew_ct_created.json.id }}"

    # ── 2. Credential ────────────────────────────────────────────────────

    - name: Look up the evidence writer credential
      ansible.builtin.uri:
        use_proxy: false
        url: "{{ aap_api }}/credentials/?name={{ ew_credential_name | urlencode }}"
        headers: "{{ aap_headers }}"
        validate_certs: "{{ _validate_certs }}"
      register: ew_cred_lookup
      failed_when: ew_cred_lookup.json.count > 1

    - name: Create the evidence writer credential
      ansible.builtin.uri:
        use_proxy: false
        url: "{{ aap_api }}/credentials/"
        method: POST
        headers: "{{ aap_headers }}"
        validate_certs: "{{ _validate_certs }}"
        body_format: json
        body:
          name: "{{ ew_credential_name }}"
          description: "Evidence writer ({{ ew_writer_user }}): INSERT-only role for compliance_results / compliance_certifications"
          organization: 1
          credential_type: "{{ ew_ct_id | int }}"
          inputs:
            compliance_writer_password: "{{ compliance_writer_password }}"
            aac_evidence_writer_user: "{{ ew_writer_user }}"
        status_code: [200, 201]
      register: ew_cred_created
      no_log: true
      when: ew_cred_lookup.json.count == 0

    - name: Resolve the credential id
      ansible.builtin.set_fact:
        ew_cred_id: "{{ ew_cred_lookup.json.results[0].id if ew_cred_lookup.json.count == 1 else ew_cred_created.json.id }}"

    # ── 3. Attach to every template that carries a Compliance DB credential ─

    - name: Look up the Compliance DB credential type
      ansible.builtin.uri:
        use_proxy: false
        url: "{{ aap_api }}/credential_types/?name={{ db_credential_type_name | urlencode }}"
        headers: "{{ aap_headers }}"
        validate_certs: "{{ _validate_certs }}"
      register: db_ct_lookup
      failed_when: db_ct_lookup.json.count != 1

    - name: List job templates that carry a Compliance DB credential (first page)
      ansible.builtin.uri:
        use_proxy: false
        url: "{{ aap_api }}/job_templates/?credentials__credential_type={{ db_ct_lookup.json.results[0].id }}&page_size=200&order_by=id"
        headers: "{{ aap_headers }}"
        validate_certs: "{{ _validate_certs }}"
      register: jt_page

    - name: Refuse to continue if the template list is paginated beyond one page
      ansible.builtin.assert:
        that:
          - jt_page.json.next is none
        fail_msg: "More than 200 templates carry the Compliance DB credential; raise page_size or add pagination before re-running."
        quiet: true

    - name: Read each template's attached credentials
      ansible.builtin.uri:
        use_proxy: false
        url: "{{ aap_api }}/job_templates/{{ item.id }}/credentials/?page_size=200"
        headers: "{{ aap_headers }}"
        validate_certs: "{{ _validate_certs }}"
      loop: "{{ jt_page.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      register: jt_creds

    - name: Attach the evidence writer credential where it is missing
      ansible.builtin.uri:
        use_proxy: false
        url: "{{ aap_api }}/job_templates/{{ item.item.id }}/credentials/"
        method: POST
        headers: "{{ aap_headers }}"
        validate_certs: "{{ _validate_certs }}"
        body_format: json
        body:
          id: "{{ ew_cred_id | int }}"
        status_code: [204]
      loop: "{{ jt_creds.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: (ew_cred_id | int) not in (item.json.results | map(attribute='id') | list)
      register: attached

    # ── Summary ───────────────────────────────────────────────────────────

    - name: "=== Evidence Writer wired into AAP ==="
      ansible.builtin.debug:
        msg:
          - "Credential type: {{ ew_credential_type_name }} (ID {{ ew_ct_id }})"
          - "Credential:      {{ ew_credential_name }} (ID {{ ew_cred_id }})"
          - "                 injects compliance_writer_password + aac_evidence_writer_user={{ ew_writer_user }}"
          - "Templates carrying a Compliance DB credential: {{ jt_page.json.count }}"
          - "Newly attached: {{ attached.results | selectattr('changed') | list | length }}"
          - "Already attached: {{ attached.results | rejectattr('changed') | list | length }}"
          - ""
          - "Next: launch 'AAC - Compliance DB Schema' once (creates the role, applies the guard),"
          - "      then 'AAC - Verify Evidence Chain' — expect 'writer role: configured as {{ ew_writer_user }}; can rewrite: False'."
