---
# identify_affected_components.yml — catalog-driven CVE → affected systems/components
#
# THE CORE AAC CLAIM: identify the SYSTEMS and TECHNOLOGY COMPONENTS that need
# the patch — from observed inventory, not assumption.
#
# Implements `docs/patch_remediation_lifecycle.md` Stage 3 (inventory matching),
# but sourced from the LOCAL product catalog rather than the Customer Portal.
#
# Why this exists alongside pull_patch_worklist.yml:
#   pull_patch_worklist.yml resolves a manifest the PORTAL has already matched.
#   This playbook does the matching HERE, against the catalog fact collection
#   already produces. That matters because it removes the portal from the
#   identification half entirely — AAC can answer "which of my systems and
#   components are affected" with no external dependency at all.
#   Both write patch_worklist; rows are distinguished by host_resolution.
#
# FIX VERSION: resolved from cve_vendor_remediations, so a CVE with no
# remediation row is still reported — you are affected whether or not a fix
# exists — but carries fix_match='none' rather than a guessed version.
# A wrong fix version is worse than a missing one.
#
# cve_vendor_remediations is keyed (cve_id, vendor): one CVE can carry a fix
# from each vendor that ships the component. The lookup is therefore a LATERAL
# that picks EXACTLY ONE row per matched component — the remediation whose
# vendor matches the installed package's vendor, else the CVE's own vendor,
# else the earliest published fix. A plain join on cve_id would multiply every
# work item by the number of vendor rows and collide on patch_worklist's
# unique key.
#
#   fix_match='vendor_fix'  a published fix exists and is named
#   fix_match='none'        no fix is published. Materially different
#                           from "a fix exists and we have not applied it":
#                           past end-of-support this is PERMANENT, and it
#                           is replacement debt, not remediation debt.
#
# cve_vendor_remediations is §13 build-sequence #1 and is populated by the CVE
# feed. For a demo it can be seeded from ansible/files/demo_cve_fixture.sql.
#
# Matching is layered, most to least confident:
#   1. cpe            — catalog CPE appears in the CVE's affected_cpes[]
#   2. vendor_product — vendor AND product both match
#   3. product        — product name matches only
#
# VERSION HANDLING. The rule lives in ONE place, the database function
# aac_cve_package_verdict (ansible/files/cve_cache_schema.sql), and is the same
# one patch_assurance.yml uses:
#
#   * When the CVE carries a fixed build for the host's product stream
#     (cve_fixed_builds), an rpm package is affected when its installed
#     epoch:version-release is LOWER than that build, by rpm's own ordering
#     (ansible/files/rpm_evr_functions.sql). Builds of another stream are never
#     compared: an el8 fixed build says nothing about an el9 host.
#   * A kernel is judged on the build the host is RUNNING. Fixed build
#     installed but an older one booted is 'reboot_pending' and is still a
#     work item.
#   * With no fixed build, the old exact list applies and stays FAIL-CLOSED: a
#     component is reported when its version is in affected_versions, or when
#     the CVE carries no version data at all (cannot tell, so report it). It is
#     left out only when the CVE lists versions and this one is not among them.
#   * A host with no matching component is "not affected (not installed)". That
#     is counted and printed, and it is not the same as 'unknown'.
#
# WHAT THE CACHE HOLDS. `source` on cve_events_received tells a real delivery
# from the demo seed. When every CVE in scope is a demo-seed row the summary
# says so, and the job artifact carries cve_cache_demo_only=true: "nothing
# matched" then means "no real CVE was looked for".
#
# AAP Job Template: "AAC - Identify Affected Components (catalog match)"
# Credentials: Ansible Vault
# EE: AAC Compliance EE (community.postgresql)
# Run after: "AAC - Refresh Inventory Catalog (patch intelligence)"

- name: Identify affected systems and components from the product catalog
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    pg_port: "{{ compliance_db_port | default(5432) }}"
    pg_db: "compliance"
    pg_user: "postgres"
    pg_password: "{{ compliance_db_password }}"

    # Survey: comma-separated CVE IDs, or empty for every CVE currently known
    cve_filter: "{{ cve_ids | default('') }}"
    # Report components whose version the CVE explicitly excludes (default: no)
    include_unaffected_versions: "{{ include_unaffected | default(false) | bool }}"
    # Refuse to match against inventory older than this
    max_inventory_age_hours: "{{ max_inventory_age | default(168) | int }}"

  tasks:
    # site_config.yml and vault_secrets.yml are gitignored and absent from AAP
    # project checkouts (and from the sales.demos pack); load them when present,
    # otherwise every value arrives as an extra var, survey answer or credential.
    - name: Load optional local config
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files:
            - "{{ playbook_dir }}/../vars/site_config.yml"
          skip: true

    - name: Load optional local secrets
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files:
            - "{{ playbook_dir }}/../vars/vault_secrets.yml"
          skip: true

    - name: Require the database connection to be configured
      ansible.builtin.assert:
        that:
          - pg_host is defined
          - pg_host | string | length > 0
          - compliance_db_password is defined
        fail_msg: >-
          pg_host and compliance_db_password must be set — from ansible/vars/site_config.yml
          and vault_secrets.yml on a workstation, or from extra_vars / a credential on AAP.
          No in-cluster default is assumed.
        quiet: true

      no_log: true  # the assertion names a secret variable; keep its evaluation out of job output
    # -------------------------------------------------------------------------
    # Schema — the matcher is a database function, so an install that has not
    # re-run the database role since this change still gets it. All four files
    # are idempotent (CREATE OR REPLACE / IF NOT EXISTS) and ORDER MATTERS:
    # the verdict functions call the rpm functions and read installed_inventory.
    # -------------------------------------------------------------------------
    - name: Ensure the rpm version-comparison functions exist
      community.postgresql.postgresql_script:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        path: "{{ playbook_dir }}/../files/rpm_evr_functions.sql"

    - name: Ensure the inventory schema carries the package build columns
      community.postgresql.postgresql_script:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        path: "{{ playbook_dir }}/../files/inventory_catalog_schema.sql"

    - name: Ensure the CVE cache schema and the verdict functions exist
      community.postgresql.postgresql_script:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        path: "{{ playbook_dir }}/../files/cve_cache_schema.sql"

    - name: Ensure the patch worklist carries the verdict columns
      community.postgresql.postgresql_script:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        path: "{{ playbook_dir }}/../files/patch_worklist_schema.sql"

    # -------------------------------------------------------------------------
    # Guard rails — matching against stale or absent data manufactures false
    # confidence, which is worse than reporting nothing.
    # -------------------------------------------------------------------------
    - name: Check the CVE store and inventory freshness
      community.postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        query: |
          SELECT
            (SELECT count(*) FROM cve_events_received)                        AS cve_count,
            (SELECT count(*) FROM cve_events_received
              WHERE source = 'demo_seed')                                     AS cve_demo_count,
            (SELECT count(*) FROM cve_events_received c
              WHERE %(filter)s = ''
                 OR c.cve_id = ANY(string_to_array(replace(%(filter)s, ' ', ''), ','))) AS scope_count,
            (SELECT count(*) FROM cve_events_received c
              WHERE c.source IS DISTINCT FROM 'demo_seed'
                AND (%(filter)s = ''
                     OR c.cve_id = ANY(string_to_array(replace(%(filter)s, ' ', ''), ',')))) AS scope_real_count,
            (SELECT COALESCE(string_agg(w.id, ', ' ORDER BY w.id), '')
               FROM unnest(string_to_array(replace(%(filter)s, ' ', ''), ',')) AS w(id)
              WHERE w.id <> ''
                AND NOT EXISTS (SELECT 1 FROM cve_events_received c
                                 WHERE c.cve_id = w.id))                      AS cves_not_in_cache,
            (SELECT count(DISTINCT cve_id) FROM cve_fixed_builds
              WHERE base_os AND fixed_evr IS NOT NULL)                        AS cves_with_fixed_build,
            (SELECT count(*) FROM installed_inventory
              WHERE package_format = 'rpm' AND package_evr IS NOT NULL)       AS rpm_build_rows,
            (SELECT count(*) FROM installed_inventory)                        AS inventory_rows,
            (SELECT count(DISTINCT hostname) FROM installed_inventory)        AS hosts,
            (SELECT count(*) FROM inventory_catalog)                          AS catalog_products,
            (SELECT ROUND(EXTRACT(EPOCH FROM (now() - max(last_seen_at)))/3600)
               FROM installed_inventory)                                      AS inventory_age_hours
        named_args:
          filter: "{{ cve_filter }}"
      register: preflight

    - name: Set pre-flight facts
      ansible.builtin.set_fact:
        pf: "{{ preflight.query_result[0] }}"

    # "Demo only" is judged on the CVEs this run looks at. An empty scope (a
    # filter that names nothing in the cache) is handled just below.
    - name: Decide whether this run looks only at demo-seed CVEs
      ansible.builtin.set_fact:
        cve_cache_demo_only: "{{ (pf.scope_count | int > 0) and (pf.scope_real_count | int == 0) }}"

    - name: Report what we are matching against
      ansible.builtin.debug:
        msg:
          - "CVEs known locally      : {{ pf.cve_count }} ({{ pf.cve_demo_count }} demo seed, {{ pf.cve_count | int - pf.cve_demo_count | int }} delivered)"
          - "CVEs in this run        : {{ pf.scope_count }}{{ ' — ALL DEMO SEED' if cve_cache_demo_only | bool else '' }}"
          - "CVEs with a fixed build : {{ pf.cves_with_fixed_build }}"
          - "rpm rows with a build   : {{ pf.rpm_build_rows }}"
          - "Hosts observed          : {{ pf.hosts }}"
          - "Installed package rows  : {{ pf.inventory_rows }}"
          - "Catalog products        : {{ pf.catalog_products }}"
          - "Inventory age (hours)   : {{ pf.inventory_age_hours | default('never collected') }}"

    - name: Stop when there are no CVEs to match
      ansible.builtin.fail:
        msg: >-
          cve_events_received is empty — there is nothing to match against the catalog.
          Populate it from the CVE feed (portal `runner all`, the EDA CVE webhook, or a
          seed fixture for a demo) before running this playbook. Matching an empty CVE
          set would report zero affected components, which reads as "you are clean"
          when it actually means "we never looked".
      when: pf.cve_count | int == 0

    # A requested CVE that is not in the cache has NO verdict. Zero matches for
    # it would read as "not affected" when nothing was compared.
    - name: Stop when none of the requested CVEs is in the cache
      ansible.builtin.fail:
        msg: >-
          None of the requested CVE ids ({{ cve_filter }}) is in cve_events_received, so there
          is nothing to compare the inventory with. This is not a "not affected" result.
          Deliver the CVE first: the portal bridge, the EDA CVE webhook, or — for Red Hat
          products — the opt-in "AAC - Fetch Red Hat CVE Data" (fetch_redhat_cve_data.yml).
      when:
        - cve_filter | length > 0
        - pf.scope_count | int == 0

    - name: Say which requested CVEs are not in the cache
      ansible.builtin.debug:
        msg: >-
          NOT IN THE CACHE, NO VERDICT: {{ pf.cves_not_in_cache }}. Nothing below says anything
          about these ids. Deliver them and run again.
      when: pf.cves_not_in_cache | length > 0

    - name: Say when the cache holds only demo rows
      ansible.builtin.debug:
        msg: >-
          THE CVE CACHE HOLDS ONLY DEMO ROWS for this run (source='demo_seed', synthetic
          CVE-2026-9xxxx ids). Every result below is about invented vulnerabilities. A real
          CVE is absent from the cache, which is different from "not installed" and from
          "not affected". Deliver real CVEs before reading this as an exposure statement.
      when: cve_cache_demo_only | bool

    - name: Say when fixed builds cannot be compared because the catalog predates them
      ansible.builtin.debug:
        msg: >-
          {{ pf.cves_with_fixed_build }} CVE(s) carry a fixed build, but no rpm row in
          installed_inventory has its epoch:version-release yet. Re-run "AAC - Refresh
          Inventory Catalog (patch intelligence)"; until then matching falls back to the
          exact affected-version list.
      when:
        - pf.cves_with_fixed_build | int > 0
        - pf.rpm_build_rows | int == 0

    - name: Stop when there is no inventory to match
      ansible.builtin.fail:
        msg: >-
          installed_inventory is empty. Run "AAC - Gather Facts (All Systems)" and then
          "AAC - Refresh Inventory Catalog (patch intelligence)" first.
      when: pf.inventory_rows | int == 0

    - name: Refuse to match against stale inventory
      ansible.builtin.fail:
        msg: >-
          Inventory is {{ pf.inventory_age_hours }}h old, beyond the
          {{ max_inventory_age_hours }}h limit. Identification from stale facts
          reports components that may already have been patched and misses ones
          newly installed. Re-run fact collection, or raise max_inventory_age
          deliberately if you accept that risk.
      when:
        - pf.inventory_age_hours is not none
        - pf.inventory_age_hours | int > max_inventory_age_hours | int

    # -------------------------------------------------------------------------
    # Clear ALL of OUR rows — the catalog path's worklist is a CURRENT-DETECTION
    # snapshot, not a growing log. `host_resolution = 'catalog_match'` already
    # protects the portal path's rows (it owns 'host_resolution'-tagged rows).
    #
    # This DELETE is deliberately NOT scoped by cve_filter. A filtered run must
    # still wipe the whole catalog snapshot first, otherwise rows from a prior
    # run with a different filter linger — and the downstream verdict rollup and
    # patch install (which read the whole catalog set for the host) would then
    # reason and act on stale CVEs the current run never detected, i.e. remediate
    # beyond the gate. Rebuilding each run keeps decision and action bound to
    # exactly what this run matched.
    # -------------------------------------------------------------------------
    # -------------------------------------------------------------------------
    # The match itself — CVE × observed inventory
    # -------------------------------------------------------------------------
    # The snapshot rebuild (DELETE) and the re-match (INSERT) are ONE module call,
    # so they run in ONE transaction: a concurrently launched install/closure job
    # sees either the previous complete snapshot or the new one, never an empty
    # table in between, and two overlapping identify runs serialise on the row
    # locks rather than interleaving delete/delete/insert/insert.
    - name: Rebuild the catalog snapshot and record affected systems (one transaction)
      community.postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        query: |
          DELETE FROM patch_worklist
           WHERE host_resolution = 'catalog_match';
          -- The match is aac_cve_host_verdicts() (cve_cache_schema.sql): CVE x
          -- observed inventory, one verdict per matched component. A CVE with
          -- no remediation and no fixed build is still reported (you are
          -- affected whether or not a fix exists); it carries fix_match='none'.
          INSERT INTO patch_worklist (
            pulled_at, cve_id, severity, kev_member, hostname, os_family,
            vendor, product, installed_version,
            fix_vendor, fixed_version, package_manager, advisory_id,
            patch_source, host_resolution, fix_match,
            installed_evr, booted_evr, version_verdict, verdict_detail
          )
          SELECT
            now(), cve_id, severity, kev_member, hostname, os_family,
            vendor, product, installed_version,
            fix_vendor,
            -- The fixed build of THIS host's stream when one is known, else the
            -- vendor remediation's version.
            COALESCE(fixed_evr, fix_version),
            CASE
              WHEN os_family ILIKE '%%debian%%' OR os_family ILIKE '%%ubuntu%%' THEN 'apt'
              WHEN os_family ILIKE '%%suse%%'                                   THEN 'zypper'
              WHEN os_family ILIKE '%%windows%%'                                THEN 'windows'
              ELSE 'dnf'
            END,
            advisory_id,
            'catalog_match',
            'catalog_match',
            -- fix_match records HOW the fix was resolved. 'none' means no fix is
            -- known for this CVE on this host — you are affected and no fix is
            -- published. That is materially different from 'not yet applied'.
            CASE WHEN COALESCE(fixed_evr, fix_version, '') <> ''
                 THEN 'vendor_fix' ELSE 'none' END,
            installed_evr, booted_evr, verdict, detail
          FROM aac_cve_host_verdicts(%(filter)s)
          WHERE verdict IN ('affected', 'reboot_pending', 'unknown')
             OR (%(include_unaffected)s AND verdict <> 'not_installed')
        named_args:
          filter: "{{ cve_filter }}"
          include_unaffected: "{{ include_unaffected_versions }}"
      register: match_result

    # -------------------------------------------------------------------------
    # Read back — what did we actually find
    # -------------------------------------------------------------------------
    - name: Summarise affected systems and components
      community.postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        query: |
          SELECT cve_id, severity, kev_member, product,
                 count(DISTINCT hostname)        AS hosts,
                 count(DISTINCT COALESCE(installed_evr, installed_version)) AS versions,
                 string_agg(DISTINCT COALESCE(installed_evr, installed_version), ', '
                            ORDER BY COALESCE(installed_evr, installed_version)) AS version_spread
            FROM patch_worklist
           WHERE host_resolution = 'catalog_match'
           GROUP BY 1,2,3,4
           ORDER BY kev_member DESC, hosts DESC
      register: summary

    # Every host gets an answer for every CVE in scope, including the ones that
    # are not work items: fixed, not affected, and not installed.
    - name: Count hosts per CVE and verdict
      community.postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        query: |
          SELECT cve_id,
                 count(DISTINCT hostname) FILTER (WHERE verdict = 'affected')       AS affected,
                 count(DISTINCT hostname) FILTER (WHERE verdict = 'reboot_pending') AS reboot_pending,
                 count(DISTINCT hostname) FILTER (WHERE verdict = 'unknown')        AS unknown,
                 count(DISTINCT hostname) FILTER (WHERE verdict = 'fixed')          AS fixed,
                 count(DISTINCT hostname) FILTER (WHERE verdict IN ('not_affected', 'not_listed')) AS not_affected,
                 count(DISTINCT hostname) FILTER (WHERE verdict = 'not_installed')  AS not_installed
            FROM aac_cve_host_verdicts(%(filter)s)
           GROUP BY cve_id
           ORDER BY cve_id
        named_args:
          filter: "{{ cve_filter }}"
      register: verdict_counts

    - name: Read the reboot-pending and unknown rows
      community.postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        query: |
          SELECT cve_id, hostname, product, version_verdict, verdict_detail
            FROM patch_worklist
           WHERE host_resolution = 'catalog_match'
             AND version_verdict IN ('reboot_pending', 'unknown')
           ORDER BY version_verdict, cve_id, hostname, product
           LIMIT 200
      register: attention_rows

    - name: Count the totals
      community.postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        query: |
          SELECT count(*)                       AS work_items,
                 count(DISTINCT hostname)       AS affected_hosts,
                 count(DISTINCT cve_id)         AS matched_cves,
                 count(DISTINCT product)        AS affected_components,
                 count(*) FILTER (WHERE kev_member) AS kev_items,
                 count(DISTINCT hostname) FILTER (WHERE version_verdict = 'reboot_pending') AS reboot_pending_hosts
            FROM patch_worklist
           WHERE host_resolution = 'catalog_match'
      register: totals

    # ── Expose the patch verdict to Automation Orchestrator ──────────────────
    # AO's agentic triage node reads these as workflow artifacts
    # (${identify.artifacts.<key>}). Additive and side-effect-free.
    - name: Verdict rollup for AO agentic triage
      community.postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        query: |
          SELECT
            count(*)                                                 AS affected_count,
            count(DISTINCT cve_id)                                   AS affected_cves,
            bool_or(fix_match = 'vendor_fix')                        AS has_vendor_fix,
            bool_or(kev_member)                                      AS kev_present,
            max(CASE severity WHEN 'CRITICAL' THEN 4 WHEN 'HIGH' THEN 3
                              WHEN 'MEDIUM' THEN 2 WHEN 'LOW' THEN 1 ELSE 0 END) AS sev_rank
            FROM patch_worklist
           WHERE host_resolution = 'catalog_match'
      register: verdict

    - name: Publish patch verdict as workflow stats (for AO agentic triage)
      vars:
        v: "{{ verdict.query_result[0] }}"
        sev_map: {4: CRITICAL, 3: HIGH, 2: MEDIUM, 1: LOW, 0: NONE}
      ansible.builtin.set_stats:
        aggregate: false
        per_host: false
        data:
          affected_count: "{{ v.affected_count | default(0) | int }}"
          affected_cves:  "{{ v.affected_cves | default(0) | int }}"
          has_vendor_fix: "{{ v.has_vendor_fix | default(false) | bool }}"
          kev_present:    "{{ v.kev_present | default(false) | bool }}"
          max_severity:   "{{ sev_map[v.sev_rank | default(0) | int] }}"
          # Fixed build installed, older kernel still running: counted in
          # affected_count, and a reboot (not an install) is what closes it.
          reboot_pending_hosts: "{{ totals.query_result[0].reboot_pending_hosts | default(0) | int }}"
          # true when every CVE this run looked at is a demo-seed row.
          cve_cache_demo_only: "{{ cve_cache_demo_only | bool }}"
          cves_not_in_cache: "{{ pf.cves_not_in_cache }}"
          # EOL exposure is resolved by the Refresh Support Status step, not here;
          # default false so the agent has a well-defined field either way.
          eol_exposed:    false

    - name: Identification summary
      vars:
        t: "{{ totals.query_result[0] }}"
      ansible.builtin.debug:
        msg:
          - "──────────────────────────────────────────────────────────"
          - "AFFECTED SYSTEMS AND COMPONENTS (catalog-matched)"
          - "──────────────────────────────────────────────────────────"
          - "{{ 'CVE CACHE HOLDS ONLY DEMO ROWS — these results are about synthetic CVEs' if cve_cache_demo_only | bool else 'CVE cache: ' ~ pf.scope_real_count ~ ' delivered CVE(s) in this run' }}"
          - "{{ 'NOT IN THE CACHE, NO VERDICT: ' ~ pf.cves_not_in_cache if pf.cves_not_in_cache | length > 0 else 'Every requested CVE is in the cache.' if cve_filter | length > 0 else 'No CVE filter: every cached CVE was matched.' }}"
          - "CVEs matched to this estate : {{ t.matched_cves }} of {{ pf.scope_count }} in this run"
          - "Affected components         : {{ t.affected_components }}"
          - "Affected hosts              : {{ t.affected_hosts }} of {{ pf.hosts }} observed"
          - "Host x component work items : {{ t.work_items }}"
          - "KEV (actively exploited)    : {{ t.kev_items }}"
          - "Fixed build installed, reboot pending : {{ t.reboot_pending_hosts }} host(s) (counted as affected)"
          - "──────────────────────────────────────────────────────────"
          - "fixed_version is the fixed build of the host's own product"
          - "stream when the CVE carries one, else the vendor remediation's"
          - "version, else empty (fix_match='none')."
          - "──────────────────────────────────────────────────────────"

    - name: Hosts per CVE and verdict (not_installed means not affected, not installed)
      ansible.builtin.debug:
        var: verdict_counts.query_result

    - name: Rows that need a reboot or could not be decided
      ansible.builtin.debug:
        var: attention_rows.query_result
      when: attention_rows.query_result | length > 0

    - name: Per-CVE component and version spread
      ansible.builtin.debug:
        var: summary.query_result

    - name: Note when nothing matched
      ansible.builtin.debug:
        msg: >-
