---
# rotation_mcp_token.yml — Step 2 of AAC Credential Rotation Workflow
#
# Rotates the AAP Bearer token used by the MCP server (Claude Code integration).
# Writes the new token to the rotation temp directory for vault update (Step 5).
#
# Survey variables (set at workflow level):
#   rotate_mcp_token  (bool) — set to false to skip this step
#   aap_admin_password (string) — AAP admin password for token API
#
# Part of workflow: "AAC - Rotate Credentials"

- name: Rotate MCP Token
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - ../vars/site_config.yml

  vars:
    # aap_host: <set via extra_vars / survey / inventory>   # default aac_host
    aap_user:      "{{ aap_ssh_user }}"
    aap_admin_user: "admin"
    rotation_dir:  "/tmp/aac_cred_rotation"

    # Survey default — override at workflow level
    rotate_mcp_token: false

  tasks:

    - name: Skip if not selected
      meta: end_play
      when: not (rotate_mcp_token | bool)

    - name: Create new AAP Bearer token
      uri:
        use_proxy: false
        url: "{{ aap_url }}/api/gateway/v1/tokens/"
        method: POST
        body_format: json
        body:
          description: "Claude Code MCP Token (rotated {{ ansible_date_time.date }})"
          scope: "write"
        headers:
          Authorization: "Basic {{ (aap_admin_user + ':' + aap_admin_password) | b64encode }}"
        status_code: 201
        validate_certs: false
      register: token_response
      no_log: true

    - name: Extract token value
      set_fact:
        new_mcp_token: "{{ token_response.json.token }}"
        new_mcp_token_id: "{{ token_response.json.id }}"
      no_log: true

    - name: Write new token to rotation directory
      copy:
        dest: "{{ rotation_dir }}/mcp_token.env"
        mode: "0600"
        content: "{{ new_mcp_token }}"
      delegate_to: "{{ (aap_host | default(aac_host)) }}"
      become: true
      no_log: true

    - name: Write new token to mcp.env for MCP server
      copy:
        dest: /opt/aap-mcp-server/mcp.env
        owner: "{{ aap_user }}"
        group: "{{ aap_user }}"
        mode: "0600"
        content: |
          # Auto-generated by rotation_mcp_token.yml — {{ ansible_date_time.date }}
          AAP_TOKEN={{ new_mcp_token }}
      delegate_to: "{{ (aap_host | default(aac_host)) }}"
      become: true
      no_log: true

    - name: Stop existing MCP container
      shell: podman stop aap-mcp 2>/dev/null || true
      delegate_to: "{{ (aap_host | default(aac_host)) }}"
      changed_when: false

    - name: Remove existing MCP container
      shell: podman rm aap-mcp 2>/dev/null || true
      delegate_to: "{{ (aap_host | default(aac_host)) }}"
      changed_when: false

    - name: Start MCP container with new token
      shell: |
        podman run -d \
          --name aap-mcp \
          -p 8004:8004 \
          --restart=always \
          -v /opt/aap-mcp-server:/app:rw \
          -e AAP_GATEWAY_URL=https://host.containers.internal \
          -e AAP_SERVICE_URL=https://host.containers.internal/api/controller/v2 \
          -e CONTROLLER_OPENAPI_SPEC_URL=file:///app/aap-controller-api.json \
          -e AAP_TOKEN={{ new_mcp_token }} \
          -e PYTHONPATH=/app \
          -e HOST=0.0.0.0 \
          -e PORT=8004 \
          {{ mcp_image }} \
          python /app/server.py
      delegate_to: "{{ (aap_host | default(aac_host)) }}"
      no_log: true
      changed_when: true

    - name: Wait for MCP server to become ready
      uri:
        use_proxy: false
        url: "http://{{ (aap_host | default(aac_host)) }}:8004/"
        method: GET
        status_code: [200, 404]
        timeout: 5
        validate_certs: false
      register: mcp_health
      until: mcp_health.status in [200, 404]
      retries: 12
      delay: 5

    - name: MCP token rotation complete
      debug:
        msg:
          - "✅ New MCP token created (ID: {{ new_mcp_token_id }})"
          - "✅ MCP container restarted and responding (HTTP {{ mcp_health.status }})"
          - "✅ Token written to rotation directory for vault update"
          - "⚠️  ACTION REQUIRED: After workflow completes, update ~/.claude.json on your Mac"
