---
# deploy_vyos_container.yml — Deploy VyOS router container on AAC host
#
# Builds a VyOS-compatible container image (vyos-build base + openssh-server)
# then runs it with SSH exposed on port 2224.
# (2222 is reserved by the CRC OpenShift Local SSH forward, so VyOS uses 2224.)
#
# After deployment:
#   ssh vyos@<aac-host> -p 2224   (password: vyos — change immediately)
#
# AAP Job Template: "Deploy VyOS Container"
# Credentials: AAC Build Host (aapuser1) (ID 9)
# Inventory: Compliance Infrastructure, limit: aap-controller-ssh

- name: Deploy VyOS Router Container
  hosts: aap-controller-ssh
  gather_facts: false

  vars_files:
    - [ "../vars/vault_secrets.yml", "../vars/empty_fallback.yml" ]
    - ../vars/site_config.yml

  vars:
    vyos_container_name: "vyos-router-01"
    vyos_base_image:     "docker.io/vyos/vyos-build:current"
    vyos_local_image:    "localhost/vyos-ssh:latest"
    vyos_ssh_port:       "{{ vyos_ssh_port_override | default(2224) }}"   # 2222 reserved by CRC
    vyos_config_dir:     "/home/aapuser1/aac-vyos"

    # Containerfile — adds openssh-server and vyos user on top of vyos-build
    vyos_containerfile: |
      FROM docker.io/vyos/vyos-build:current
      RUN apt-get update -qq && \
          apt-get install -y --no-install-recommends openssh-server && \
          mkdir -p /run/sshd /opt/vyatta/etc/config && \
          useradd -m -s /bin/bash vyos 2>/dev/null || true && \
          echo 'vyos:vyos' | chpasswd && \
          sed -i 's/#PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config && \
          sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config && \
          echo 'AllowUsers vyos' >> /etc/ssh/sshd_config
      COPY config.boot /opt/vyatta/etc/config/config.boot
      COPY config.json /opt/vyatta/etc/config/config.json
      EXPOSE 22
      CMD ["/usr/sbin/sshd", "-D", "-e"]

    # Minimal VyOS-style config stored in container for assessment
    vyos_config_boot: |
      system {
          host-name vyos-router-01
          domain-name compliance.lab
          time-zone America/Los_Angeles
          name-server 8.8.8.8
          name-server 8.8.4.4
          login {
              banner "AUTHORIZED ACCESS ONLY - This system is monitored"
              user vyos {
                  level admin
                  authentication {
                      encrypted-password "$6$compliance$placeholder"
                  }
              }
          }
          ntp {
              server time.cloudflare.com
              server pool.ntp.org
          }
          syslog {
              host {{ syslog_server | default(aac_host) }} {
                  facility all {
                      level info
                  }
              }
          }
      }
      service {
          ssh {
              port 22
              client-keepalive-interval 60
              disable-password-authentication
          }
      }
      firewall {
          name WAN-IN {
              default-action drop
              rule 10 {
                  action accept
                  log enable
                  state {
                      established enable
                      related enable
                  }
              }
              rule 20 {
                  action drop
                  log enable
              }
          }
      }
      interfaces {
          ethernet eth0 {
              address dhcp
              description WAN
              firewall {
                  in {
                      name WAN-IN
                  }
              }
          }
      }

    # config.json — the same config rendered as `show configuration json` output.
    # The assessment reads THIS (the vyos-build image has no op-mode CLI to render it
    # live). Keys mirror cis_vyos.rego's expected input paths. This baseline scores
    # 90% (2 intentional findings: SNMP v2c community + no console login timeout).
    vyos_config_json: |
      {
        "system": {
          "host-name": "vyos-router-01",
          "domain-name": "compliance.lab",
          "time-zone": "America/Los_Angeles",
          "name-server": ["8.8.8.8", "8.8.4.4"],
          "login": {
            "banner": "AUTHORIZED ACCESS ONLY - This system is monitored",
            "user": {
              "vyos": {
                "level": "admin",
                "authentication": {"encrypted-password": "$6$compliance$placeholder"}
              }
            }
          },
          "ntp": {"server": {"time.cloudflare.com": {}, "pool.ntp.org": {}}},
          "syslog": {"host": {"{{ syslog_server | default(aac_host) }}": {"facility": {"all": {"level": "info"}}}}},
          "console": {"device": {"ttyS0": {"speed": "115200"}}}
        },
        "service": {
          "ssh": {
            "port": "22",
            "client-keepalive-interval": "60",
            "disable-password-authentication": {}
          },
          "snmp": {"community": {"public": {"authorization": "ro"}}}
        },
        "firewall": {
          "name": {
            "WAN-IN": {
              "default-action": "drop",
              "rule": {
                "10": {
                  "action": "accept",
                  "log": {},
                  "state": {"established": {"action": "accept"}, "related": {"action": "accept"}}
                },
                "20": {"action": "drop", "log": {}}
              }
            }
          }
        },
        "interfaces": {
          "ethernet": {
            "eth0": {"address": "dhcp", "description": "WAN", "firewall": {"in": {"name": "WAN-IN"}}}
          }
        },
        "version": "VyOS 1.4.0",
        "platform": "vyos",
        "hostname": "vyos-router-01"
      }

  tasks:

    - name: Ensure VyOS build directory exists
      file:
        path: "{{ vyos_config_dir }}"
        state: directory
        mode: '0755'

    - name: Write Containerfile
      copy:
        content: "{{ vyos_containerfile }}"
        dest: "{{ vyos_config_dir }}/Containerfile"
        mode: '0644'

    - name: Write VyOS config.boot
      copy:
        content: "{{ vyos_config_boot }}"
        dest: "{{ vyos_config_dir }}/config.boot"
        mode: '0644'

    - name: Write VyOS config.json (what the assessment reads)
      copy:
        content: "{{ vyos_config_json }}"
        dest: "{{ vyos_config_dir }}/config.json"
        mode: '0644'

    - name: Pull VyOS base image
      shell: podman pull {{ vyos_base_image }}
      register: pull_result
      changed_when: true

    - name: Build VyOS SSH image
      shell: |
        podman build -t {{ vyos_local_image }} {{ vyos_config_dir }}/
      register: build_result
      changed_when: true

    - name: Stop and remove existing VyOS container (if any)
      shell: |
        podman stop {{ vyos_container_name }} 2>/dev/null || true
        podman rm   {{ vyos_container_name }} 2>/dev/null || true
      changed_when: false

    - name: Start VyOS container
      shell: |
        podman run -d \
          --name {{ vyos_container_name }} \
          --restart=always \
          -p {{ vyos_ssh_port }}:22 \
          {{ vyos_local_image }}
      changed_when: true

    - name: Wait for SSH to be available
      wait_for:
        host: "{{ aac_host }}"
        port: "{{ vyos_ssh_port }}"
        delay: 5
        timeout: 60
        state: started

    - name: Generate user-level systemd unit for auto-restart on boot
      shell: |
        mkdir -p ~/.config/systemd/user
        podman generate systemd --name {{ vyos_container_name }} --restart-policy=always \
          > ~/.config/systemd/user/container-{{ vyos_container_name }}.service
        systemctl --user daemon-reload
        systemctl --user enable container-{{ vyos_container_name }}
        loginctl enable-linger {{ ansible_user | default('aapuser1') }} 2>/dev/null || true
      changed_when: true

    - name: "=== VyOS Deployment Complete ==="
      debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "  VyOS Router Container Deployed"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "  Container : {{ vyos_container_name }}"
          - "  SSH       : ssh vyos@{{ aac_host }} -p {{ vyos_ssh_port }}"
          - "  Password  : vyos  (change immediately)"
          - "  Config    : {{ vyos_config_dir }}/config.boot"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
