---
# AAC Fresh Install — Phase 4: Install AAP 2.6
#
# Extracts the AAP 2.6 containerized setup bundle, writes the installer inventory
# with credentials from Ansible Vault + survey inputs, and runs the installer.
# Then waits for the AAP Gateway to become available.
#
# Survey variables (required):
#   target_host          — public IP from Phase 1
#   new_aap_admin_password — desired admin password for this AAP install
#   new_pg_password        — desired PostgreSQL password for this AAP install
#
# Runtime: 30-60 minutes (downloads/extracts container images from registry.redhat.io)
# Do NOT cancel this job — the installer handles partial restarts.
#
# AAP Job Template: "AAC - Fresh Install: 04 Install AAP"
# Credentials: Ansible Vault, Compliance SSH Credential
# EE: AAC Compliance EE

- name: Install AAP 2.6 on Target Host
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - [ "../vars/vault_secrets.yml", "../vars/empty_fallback.yml" ]
    - ../vars/site_config.yml

  vars:
    target_host:           "{{ target_host }}"
    new_aap_admin_password: "{{ new_aap_admin_password }}"
    new_pg_password:        "{{ new_pg_password }}"
    bundle_path:  "/home/ec2-user/aap-bundle.tar.gz"
    manifest_path: "/home/ec2-user/aap-manifest.zip"
    install_dir:  "/home/ec2-user/aap-installer"

  tasks:

    # ── Extract bundle ─────────────────────────────────────────────────────────
    - name: Create install directory
      ansible.builtin.file:
        path: "{{ install_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'
      delegate_to: "{{ target_host }}"
      vars:
        ansible_user: ec2-user
      become: true

    - name: Extract AAP bundle
      ansible.builtin.shell: |
        tar xzf {{ bundle_path }} -C {{ install_dir }} --strip-components=1
        echo "Extracted to: {{ install_dir }}"
        ls {{ install_dir }} | head -10
      delegate_to: "{{ target_host }}"
      vars:
        ansible_user: ec2-user
      register: extract_result
      async: 600
      poll: 15

    - name: Show extracted contents
      ansible.builtin.debug:
        msg: "{{ extract_result.stdout_lines }}"

    # ── Write installer inventory ──────────────────────────────────────────────
    - name: Write AAP installer inventory
      ansible.builtin.copy:
        dest: "{{ install_dir }}/inventory"
        owner: ec2-user
        group: ec2-user
        mode: '0600'
        content: |
          # AAP 2.6 Containerized Install — Generated by AAC Fresh Install Phase 4
          # Generated: {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}
          # Target: {{ target_host }}

          [automationcontroller]
          {{ target_host }} ansible_connection=local

          [automationhub]
          {{ target_host }} ansible_connection=local

          [automationeda]
          {{ target_host }} ansible_connection=local

          [database]
          {{ target_host }} ansible_connection=local

          [all:vars]
          # AAP admin credentials
          admin_password='{{ new_aap_admin_password }}'

          # Internal AAP PostgreSQL (separate from AAC compliance DB)
          pg_password='{{ new_pg_password }}'

          # Red Hat registry credentials (for pulling container images)
          # Note: registry.redhat.io uses the offline token as the password
          registry_url='registry.redhat.io'
          registry_username='{{ vault_redhat_username }}'
          registry_password='{{ vault_redhat_offline_token }}'

          # Red Hat subscription manifest for AAP entitlements
          manifest={{ manifest_path }}
      delegate_to: "{{ target_host }}"
      vars:
        ansible_user: ec2-user
      become: true

    # ── Run AAP installer ──────────────────────────────────────────────────────
    - name: Run AAP 2.6 containerized installer (30-60 min)
      ansible.builtin.shell: |
        cd {{ install_dir }}
        ansible-playbook -i inventory \
          collections/ansible_collections/ansible/containerized_installer/playbooks/install.yml \
          2>&1 | tee /tmp/aap_install_log.txt
        echo "EXIT_CODE:$?"
      delegate_to: "{{ target_host }}"
      vars:
        ansible_user: ec2-user
      register: install_result
      async: 5400
      poll: 30
      failed_when: >
        install_result.rc is defined and install_result.rc != 0
        or (install_result.stdout is defined and 'EXIT_CODE:1' in install_result.stdout)

    - name: Show installer completion status
      ansible.builtin.debug:
        msg: "{{ install_result.stdout_lines[-20:] | default(['no output']) }}"

    # ── Wait for AAP Gateway ──────────────────────────────────────────────────
    - name: Wait for AAP Gateway to respond (up to 5 min)
      ansible.builtin.uri:
        use_proxy: false
        url: "https://{{ target_host }}/api/gateway/v1/ping/"
        method: GET
        validate_certs: false
        status_code: 200
        timeout: 10
      register: gateway_check
      until: gateway_check.status == 200
      retries: 30
      delay: 10
      ignore_errors: true

    - name: Wait for AAP Controller API
      ansible.builtin.uri:
        use_proxy: false
        url: "https://{{ target_host }}/api/controller/v2/ping/"
        method: GET
        validate_certs: false
        status_code: 200
        timeout: 10
        headers:
          Authorization: "Basic {{ ('admin:' + new_aap_admin_password) | b64encode }}"
      register: controller_check
      until: controller_check.status == 200
      retries: 30
      delay: 10
      ignore_errors: true

    - name: Get AAP version
      ansible.builtin.set_fact:
        aap_version: "{{ controller_check.json.version | default('unknown') }}"
      when: controller_check.status == 200

    - name: "=== Phase 4 Complete ==="
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════════════════════╗"
          - "║               AAP 2.6 Installation Complete              ║"
          - "╚══════════════════════════════════════════════════════════╝"
          - ""
          - "  AAP Gateway:    https://{{ target_host }}"
          - "  Version:        {{ aap_version | default('check manually') }}"
          - "  Admin user:     admin"
          - "  Admin password: (as entered in survey)"
          - ""
          - "  Install log:    /tmp/aap_install_log.txt on {{ target_host }}"
          - ""
          - "  Run Phase 05 with:"
          - "    target_host = {{ target_host }}"
          - "    new_aap_admin_password = (same as above)"
