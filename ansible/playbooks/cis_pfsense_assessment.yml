---
# cis_pfsense_assessment.yml — CIS pfSense / OPNsense Firewall Assessment
#
# Runs on aap-controller-ssh, which owns the firewall container, and reads the
# device through podman exec: the config document (pfsense_config_path, config.xml
# keys as JSON) plus sshd_config and motd. Evaluates via OPA, stores to PostgreSQL.
#
# Compatible with pfSense CE 2.6/2.7 and OPNsense 23/24.
#
# Evidence sent to OPA (CIS pfSense Firewall v1.1.1 input contract, a superset of
# what the older v1.0.0 policy reads):
#   config sections (passed through when present): system, filter, interfaces,
#     snmpd, syslogd, syslog, hasync, openvpn, unbound, installedpackages, ...
#   sshd_config : text of /etc/ssh/sshd_config inside the device   (CIS 1.1)
#   motd        : text of /etc/motd inside the device              (CIS 1.3)
#   attest      : review-only recommendations, from pfsense_attest (see below)
# A section or file that cannot be read is left out of the payload, so the
# policy reports it as evidence missing; nothing is defaulted to a pass.
#
# Attestations (extra var, or a survey textarea holding the same YAML/JSON).
# Default empty, so every review-only control fails as "not attested" until a
# person signs it off. Values are read with
# the bool filter: true, yes, on and 1 attest; anything else does not.
#   pfsense_attest:
#     autoconfigbackup_enabled: true        # 1.2   AutoConfigBackup is enabled
#     default_accounts_secured: true        # 2.4   default accounts disabled or strong passwords
#     local_accounts_disabled: true         # 3.1   local account status set to disabled
#     admin_default_password_changed: true  # 3.4   admin default password changed
#     unused_rules_reviewed: true           # 4.1.4 no unused firewall policies
#     net_snmp_secured: true                # 5.1.3 NET-SNMP add-on installed and secured
#     vpn_portal_certificate_trusted: true  # 5.4.2 trusted signed certificate on the VPN portal
#     ipv6_required: true                   # 1.6   IPv6 is allowed because it is in use
#
# AAP Job Template: "CIS pfSense Assessment"
# Credentials: AAC Build Host (aapuser1) (ID 9) + Ansible Vault (ID 8)
# EE: AAC Compliance EE
# Inventory: Compliance Infrastructure, limit: aap-controller-ssh

- name: CIS pfSense / OPNsense Firewall Compliance Assessment
  hosts: aap-controller-ssh
  gather_facts: false

  vars_files:
    - [ "../vars/vault_secrets.yml", "../vars/empty_fallback.yml" ]
    - ../vars/site_config.yml

  vars:
    opa_server_url:      "{{ opa_security_url }}"
    policy_package:      "cis_pfsense"
    report_dir:          "/tmp/compliance_assessments"
    timestamp:           "{{ lookup('pipe','date +%Y%m%dT%H%M%S') }}"
    cis_total_controls:  22
    # OPNsense container — the assessment play runs on the AAC host
    # (aap-controller-ssh), which owns the rootless-podman container, so config is
    # read via `podman exec`. (Post-CRC the EE runs as OpenShift pods; the old
    # `sshpass … php simplexml_load_file` path is unreachable from the pods.)
    pfsense_container_name: "opnsense-fw-01"
    pfsense_config_path:    "/cf/conf/config.json"
    # Demo default. Override per environment with -e / an AAP survey or extra_vars.
    pfsense_hostname:       "compliance-lab-pfsense"
    # Device files read for CIS 1.1 / 1.3 (same paths on pfSense and the sim).
    pfsense_sshd_config_path: "/etc/ssh/sshd_config"
    pfsense_motd_path:        "/etc/motd"
    # Review-only attestations; see the header. Never pre-populate this in a profile.
    pfsense_attest:           {}

  tasks:

    - name: Ensure report directory exists
      file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'

    # ── Collect config via podman exec ────────────────────────────────────────
    # Play runs on the AAC host, which owns the container. config.json is served
    # from the baked file (the sim container has no live pfSense config engine).

    - name: Collect pfSense/OPNsense configuration JSON from container
      shell: >
        podman exec {{ pfsense_container_name }} cat {{ pfsense_config_path }}
      register: config_json_raw
      changed_when: false
      failed_when: false

    - name: Parse pfSense config JSON
      set_fact:
        pfsense_config: "{{ config_json_raw.stdout | from_json if (config_json_raw.rc | default(1)) == 0 and (config_json_raw.stdout | trim) != '' else {} }}"

    - name: Fail loudly if no config was collected
      fail:
        msg: >-
          pfSense config collection from container '{{ pfsense_container_name }}'
          returned nothing (rc={{ config_json_raw.rc | default('n/a') }}). Assessment
          aborted rather than storing a misleading 0%. Redeploy the container (template
          "Deploy pfSense on AWS") and confirm {{ pfsense_config_path }} exists.
      when: pfsense_config == {}

    # sshd_config and motd are not in config.xml; the CIS audit reads the files.
    # rc is checked below: an unreadable file is left out of the payload.
    - name: Collect sshd_config from the device
      command:
        argv: [podman, exec, "{{ pfsense_container_name }}", cat, "{{ pfsense_sshd_config_path }}"]
      register: sshd_config_raw
      changed_when: false
      failed_when: false

    - name: Collect message of the day from the device
      command:
        argv: [podman, exec, "{{ pfsense_container_name }}", cat, "{{ pfsense_motd_path }}"]
      register: motd_raw
      changed_when: false
      failed_when: false

    # A survey textarea arrives as a string: read it as YAML/JSON, blank means none.
    - name: Read pfsense_attest
      set_fact:
        pfsense_attest_map: >-
          {{ ((pfsense_attest | from_yaml) or {}) if pfsense_attest is string else pfsense_attest }}

    - name: Fail if pfsense_attest is not a mapping
      fail:
        msg: >-
          pfsense_attest must be a mapping of attestation key to true/false
          (got {{ pfsense_attest_map | type_debug }}). See the playbook header for the keys.
      when: pfsense_attest_map is not mapping

    - name: Build OPA input payload
      set_fact:
        opa_input:
          system:              "{{ pfsense_config.system             | default({}) }}"
          filter:              "{{ pfsense_config.filter             | default({'rule': []}) }}"
          interfaces:          "{{ pfsense_config.interfaces         | default({}) }}"
          snmpd:               "{{ pfsense_config.snmpd              | default({}) }}"
          syslogd:             "{{ pfsense_config.syslogd            | default({}) }}"
          installedpackages:   "{{ pfsense_config.installedpackages  | default({}) }}"
          unbound:             "{{ pfsense_config.unbound            | default({}) }}"
          miniupnpd:           "{{ pfsense_config.miniupnpd          | default({}) }}"
          captiveportal:       "{{ pfsense_config.captiveportal      | default({}) }}"
          vulnerability_scan:  "{{ pfsense_config.vulnerability_scan  | default({'performed': false}) }}"
          vulnerable_packages: "{{ pfsense_config.vulnerable_packages | default([]) }}"
          version:   "{{ pfsense_config.version  | default('unknown') }}"
          platform:  "{{ pfsense_config.platform | default('opnsense') }}"
          hostname:  "{{ pfsense_hostname }}"
          attest: "{{ dict(pfsense_attest_map.keys() | map('string') | zip(pfsense_attest_map.values() | map('bool'))) }}"

    # v1.1.1 sections, added only when the source has them (a missing section must
    # reach the policy as missing, not as an empty object or an empty server list).
    # syslog is the real pfSense key; syslogd stays above for the v1.0.0 policy.
    - name: Add the config sections the CIS v1.1.1 policy reads
      set_fact:
        opa_input: "{{ opa_input | combine({item: pfsense_config[item]}) }}"
      loop: [syslog, hasync, openvpn]
      when: item in pfsense_config

    - name: Add sshd_config text (CIS 1.1)
      set_fact:
        opa_input: "{{ opa_input | combine({'sshd_config': sshd_config_raw.stdout}) }}"
      when: (sshd_config_raw.rc | default(1)) == 0

    - name: Add message of the day text (CIS 1.3)
      set_fact:
        opa_input: "{{ opa_input | combine({'motd': motd_raw.stdout}) }}"
      when: (motd_raw.rc | default(1)) == 0

    - name: Save facts JSON
      copy:
        content: "{{ opa_input | to_nice_json }}"
        dest: "{{ report_dir }}/{{ pfsense_hostname }}_pfsense_facts_{{ timestamp }}.json"

    # ── OPA Evaluation ─────────────────────────────────────────────────────────

    # Runs in the EE (delegate_to: localhost) so the in-cluster OPA service name
    # resolves; config collection above runs on the host where the container lives.
    - name: Query OPA — CIS pfSense
      uri:
        use_proxy: false
        url: "{{ opa_server_url }}/v1/data/{{ policy_package }}/compliance_assessment"
        method: POST
        body_format: json
        body:
          input: "{{ opa_input }}"
        return_content: true
        status_code: 200
        validate_certs: false
      register: opa_response
      delegate_to: localhost
      failed_when: false

    - name: Fail loudly if OPA did not return a scored result
      fail:
        msg: >-
          OPA query to {{ opa_server_url }}/v1/data/{{ policy_package }} did not return
          a result (status={{ opa_response.status | default('n/a') }}). Aborting rather
          than storing a misleading 0%. Check the OPA service is reachable and
          cis_pfsense is loaded.
      when: >-
        (opa_response.status | default(0)) != 200
        or (opa_response.json.result | default(None)) is none

    - name: Parse OPA response
      set_fact:
        compliance_result: "{{ opa_response.json.result }}"

    - name: Normalise violations list
      set_fact:
        cis_violations: >-
          {%- set viols = [] -%}
          {%- for v in (compliance_result.violations | default([])) -%}
            {%- if v is mapping -%}
              {%- set _ = viols.append(v) -%}
            {%- else -%}
              {%- set _ = viols.append({'message': v | string, 'severity': 'high', 'control_id': ''}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ viols }}

    # ── Store to PostgreSQL ────────────────────────────────────────────────────

    - name: Store results to PostgreSQL
      include_role:
        name: aac_store_results
      vars:
        aac_result_policy_name:    "CIS pfSense Firewall"
        aac_result_framework:      "cis_pfsense"
        aac_result_policy_version: >-
          {{ compliance_result.benchmark | default('CIS pfSense/OPNsense Hardening Benchmark v1.0.0') }}
        aac_result_total_controls: >-
          {{ compliance_result.summary.total_controls | default(cis_total_controls) | int }}
        aac_result_violations:     "{{ cis_violations }}"
        aac_result_compliance_pct: >-
          {{ compliance_result.summary.compliance_percentage | default(0) | float }}
        aac_result_metadata:
          hostname:           "{{ pfsense_hostname }}"
          ip_address:         "{{ aac_host }}"
          version:            "{{ pfsense_config.version  | default('unknown') }}"
          platform:           "{{ pfsense_config.platform | default('opnsense') }}"
          device_type:        "firewall"
          collection_method:  "podman exec {{ pfsense_container_name }} cat {{ pfsense_config_path }}"
          assessment_time:    "{{ lookup('pipe','date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          section_compliance: "{{ compliance_result.section_compliance | default({}) }}"
          attestations:       "{{ opa_input.attest }}"
          evidence_files_collected: "{{ ['sshd_config', 'motd'] | select('in', opa_input) | list }}"
          opa_server:         "{{ opa_server_url }}"

    # ── Summary ────────────────────────────────────────────────────────────────

    - name: Compliance assessment complete
      debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "  CIS pfSense / OPNsense Assessment"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "  Host       : {{ pfsense_hostname }} (container {{ pfsense_container_name }})"
          - "  Platform   : {{ pfsense_config.platform | default('opnsense') }}"
          - "  Version    : {{ pfsense_config.version | default('unknown') }}"
          - "  Status     : {{ compliance_result.summary.overall_compliance | default('N/A') }}"
          - "  Compliance : {{ compliance_result.summary.compliance_percentage | default(0) }}%"
          - "  Violations : {{ cis_violations | length }}"
          - "  DB         : stored to compliance_results"
          - "  Report     : {{ report_dir }}/{{ pfsense_hostname }}_pfsense_facts_{{ timestamp }}.json"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
