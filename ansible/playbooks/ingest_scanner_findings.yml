---
# ingest_scanner_findings.yml
#
# Ingests a pre-apply IaC scanner's JSON output (Checkov or Trivy) into AAC's
# compliance_results, so plan-time findings land on the same PostgreSQL timeline
# as post-deploy verdicts — one lifecycle of evidence (gap-analysis item #3).
#
# The scanner JSON is normalized by scripts/ingest_scanner_findings.py into the
# aac_result_* inputs, then stored via the shared aac_store_results role (which
# also applies waivers).
#
# AAP Job Template: "AAC - Ingest IaC Scanner Findings"
# Execution Environment: AAC Compliance EE — has community.postgresql
#
# Survey variables:
#   scanner_output_file  — path to the scanner's JSON output (required)
#   scanner              — checkov | trivy | auto (default auto)
#   subject              — repo/stack identifier the findings belong to
#   policy_version       — scanner version string (optional)
#   terraform_plan_file  — (optional) `terraform show -json` output; when present,
#                          findings are linked to their originating IaC commit
#                          via the git-provenance tags Yor stamps on resources.

- name: Ingest IaC scanner findings into compliance_results
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    scanner: "{{ scanner_type | default('auto') }}"
    evidence_subject_id: "{{ subject | default('iac-scan') }}"

  tasks:
    - name: Load optional local config
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files: ["{{ playbook_dir }}/../vars/site_config.yml"]
          skip: true

    - name: Load optional local secrets
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files: ["{{ playbook_dir }}/../vars/vault_secrets.yml"]
          skip: true

    - name: Require a scanner output file
      ansible.builtin.assert:
        that:
          - scanner_output_file | default('') | length > 0
        fail_msg: "scanner_output_file is required (path to the Checkov/Trivy JSON output)."

    - name: Confirm the scanner output file exists
      ansible.builtin.stat:
        path: "{{ scanner_output_file }}"
      register: _scan_stat

    - name: Fail if the scanner output file is missing
      ansible.builtin.fail:
        msg: "scanner_output_file not found: {{ scanner_output_file }}"
      when: not _scan_stat.stat.exists

    - name: Normalize scanner findings to AAC shape (Python)
      # The script reads SCANNER_FILE directly — piping the JSON through Ansible's
      # stdin templating coerces it to a Python dict repr and breaks json.loads.
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../scripts/ingest_scanner_findings.py"
      environment:
        SCANNER_FILE: "{{ scanner_output_file }}"
        SCANNER: "{{ scanner }}"
        SUBJECT: "{{ evidence_subject_id }}"
        POLICY_VERSION: "{{ policy_version | default('unknown') }}"
      register: _ingest
      changed_when: false

    - name: Parse normalized findings
      ansible.builtin.set_fact:
        _finding: "{{ _ingest.stdout | from_json }}"

    # Optional: link each finding to the IaC commit that produced it, using the
    # git-provenance tags Yor stamps onto resources (present in the plan JSON).
    - name: Link findings to their originating IaC commit (Yor provenance)
      when: terraform_plan_file | default('') | length > 0
      block:
        - name: Confirm the plan file exists
          ansible.builtin.stat:
            path: "{{ terraform_plan_file }}"
          register: _plan_stat

        # Fail fast — if the operator supplied a plan path, a missing file is a
        # misconfiguration, not a reason to silently store findings without
        # provenance (mirrors the scanner_output_file handling above).
        - name: Fail if the supplied plan file is missing
          ansible.builtin.fail:
            msg: "terraform_plan_file not found: {{ terraform_plan_file }}"
          when: not _plan_stat.stat.exists

        - name: Enrich violations with Yor provenance
          ansible.builtin.command:
            argv:
              - python3
              - "{{ playbook_dir }}/../../scripts/yor_provenance.py"
            stdin: "{{ _finding.violations | to_json }}"
          environment:
            PLAN_FILE: "{{ terraform_plan_file }}"
          register: _enriched
          changed_when: false

        - name: Replace violations with the provenance-enriched set
          ansible.builtin.set_fact:
            _finding: "{{ _finding | combine({'violations': (_enriched.stdout | from_json)}) }}"

    - name: Map to aac_store_results inputs
      ansible.builtin.set_fact:
        aac_result_framework: "{{ _finding.framework }}"
        aac_result_policy_name: "{{ _finding.policy_name }}"
        aac_result_policy_version: "{{ _finding.policy_version }}"
        aac_result_total_controls: "{{ _finding.total_controls | int }}"
        aac_result_passed_controls: "{{ _finding.passed_controls | int }}"
        aac_result_failed_controls: "{{ _finding.failed_controls | int }}"
        aac_result_compliance_pct: "{{ _finding.compliance_pct | float }}"
        aac_result_violations: "{{ _finding.violations }}"
        aac_result_metadata: "{{ _finding.metadata }}"
        aac_evidence_subject: "{{ _finding.hostname }}"

    - name: Store the ingested findings (shared role — applies waivers)
      ansible.builtin.include_role:
        name: aac_store_results

    - name: Ingest summary
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════
          IaC Scanner Findings Ingested
          ═══════════════════════════════════════════════════════════
          Scanner:     {{ _finding.policy_name }} ({{ _finding.framework }})
          Subject:     {{ _finding.hostname }}
          Checks:      {{ _finding.passed_controls }} passed / {{ _finding.failed_controls }} failed
          Compliance:  {{ _finding.compliance_pct }}%
          Stored row:  {{ aac_result_id | default('(see aac_store_results output)') }}
          ═══════════════════════════════════════════════════════════
