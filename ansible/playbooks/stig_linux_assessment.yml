---
# DISA STIG assessment for RHEL 8/9 and Oracle Linux 8/9 using OPA
#
# One playbook for the four Linux STIG modules in the Rego library
# (benchmarks/stig/{rhel_8,rhel_9,oracle_linux_8,oracle_linux_9}); they share
# one input contract. The platform is read from the host's distribution, or
# forced with stig_framework.
#
# Collect  — the shared Linux collector (../tasks/collect_linux_compliance_facts.yml)
#            plus the STIG supplement (../tasks/collect_linux_stig_facts.yml)
# Map      — ../tasks/stig_linux_build_opa_input.yml (never fabricates)
# Evaluate — POST {{ opa_security_url }}/v1/data/stig/<platform>/main/compliance_report
#            (fail-closed: empty input reports every control Open)
# Store    — compliance_results + a CAA row, every number from OPA's report
#
# AAP Job Template: "AAC - STIG Linux Assessment (RHEL / Oracle Linux)"
# Credentials: Compliance SSH Credential (machine), Ansible Vault
# Survey / extra_vars:
#   stig_framework              — override the detected key: stig_rhel9 | stig_rhel8 |
#                                 stig_oracle_linux_9 | stig_oracle_linux_8
#   stig_documented_suid_files  — list of SUID/SGID paths the site has documented
#   stig_ipv6_required          — true/false when the site has decided IPv6 is required
#
# Before the first run: load the policies ("AAC - Load OPA Policies", loader key
# `stigs`) and register the four keys in site_config.yml (opa_framework_map and
# opa_framework_path) — see ansible/vars/site_config.yml.example.

- name: DISA STIG Linux Assessment (RHEL / Oracle Linux)
  hosts: all
  gather_facts: yes
  become: yes

  vars:
    report_dir: "{{ playbook_dir }}/../../reports"
    timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
    facts_schema_version: "2.0"
    pg_db: "compliance"
    pg_user: "postgres"
    # distribution → framework key (the key must exist in opa_framework_map and
    # opa_framework_path; the path is the Rego package below data.)
    _stig_by_distribution:
      "RedHat-9":      stig_rhel9
      "RedHat-8":      stig_rhel8
      "OracleLinux-9": stig_oracle_linux_9
      "OracleLinux-8": stig_oracle_linux_8
    _stig_labels:
      stig_rhel9:           "DISA STIG RHEL 9"
      stig_rhel8:           "DISA STIG RHEL 8"
      stig_oracle_linux_9:  "DISA STIG Oracle Linux 9"
      stig_oracle_linux_8:  "DISA STIG Oracle Linux 8"

  tasks:
    # site_config.yml / vault_secrets.yml are gitignored and absent from a synced
    # AAP project checkout — load them OPTIONALLY (the export playbooks do the
    # same) so routing and credentials can also arrive as extra_vars / survey /
    # inventory. The assertions below name what is missing.
    - name: Load optional local config
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files: ["{{ playbook_dir }}/../vars/site_config.yml"]
          skip: true

    - name: Load optional local secrets
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files: ["{{ playbook_dir }}/../vars/vault_secrets.yml"]
          skip: true
      no_log: true

    - name: Require the OPA routing tables and the database password
      ansible.builtin.assert:
        that:
          - opa_framework_map is defined
          - opa_framework_path is defined
          - opa_endpoints is defined
          - (compliance_db_password | default('', true)) | length > 0
        fail_msg: >-
          opa_framework_map / opa_framework_path / opa_endpoints / compliance_db_password
          are not set: provide ansible/vars/site_config.yml and vault_secrets.yml in the
          checkout, or pass them as extra_vars / a credential.

    - name: Resolve the STIG platform for this host
      set_fact:
        framework: "{{ stig_framework | default(_stig_by_distribution[ansible_distribution ~ '-' ~ ansible_distribution_major_version] | default(''), true) }}"

    - name: Refuse hosts with no STIG module
      ansible.builtin.assert:
        that:
          - framework | length > 0
          - framework in _stig_labels
          - framework in opa_framework_map
          - framework in opa_framework_path
        fail_msg: >-
          No Linux STIG module for {{ ansible_distribution }} {{ ansible_distribution_version }}
          (resolved key '{{ framework }}'). Supported: {{ _stig_labels.keys() | join(', ') }}.
          Pass stig_framework to force one, and make sure the key is in opa_framework_map
          AND opa_framework_path in site_config.yml.

    - name: Ensure report directory exists
      file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: no
      run_once: true

    # ── Collect ──────────────────────────────────────────────────────────────
    - name: Collect Linux compliance facts (shared collector)
      include_tasks: ../tasks/collect_linux_compliance_facts.yml

    - name: Collect the STIG supplement
      include_tasks: ../tasks/collect_linux_stig_facts.yml

    # ── Map ──────────────────────────────────────────────────────────────────
    - name: Build STIG OPA input from collected facts (shared mapper)
      include_tasks: ../tasks/stig_linux_build_opa_input.yml
      vars:
        facts_data: "{{ combined_facts }}"
        opa_hostname: "{{ inventory_hostname }}"

    - name: Save OPA input to local file
      copy:
        content: "{{ opa_input | to_nice_json }}"
        dest: "{{ report_dir }}/{{ inventory_hostname }}_{{ framework }}_facts_{{ timestamp }}.json"
      delegate_to: localhost
      become: no

    # ── Evaluate ─────────────────────────────────────────────────────────────
    - name: Resolve OPA endpoint
      include_tasks: ../tasks/resolve_opa_url.yml

    - name: Resolve evidence provenance (policy SHA + real subject)
      ansible.builtin.include_tasks: ../tasks/resolve_evidence_provenance.yml
      vars:
        evidence_subject: "{{ inventory_hostname }}"

    - name: "Query OPA — {{ _stig_labels[framework] }} compliance report"
      uri:
        use_proxy: false
        url: "{{ opa_server_url }}/v1/data/{{ opa_framework_path[framework] }}/main/compliance_report"
        method: POST
        body_format: json
        body:
          input: "{{ opa_input }}"
        return_content: yes
        status_code: 200
      register: opa_response
      delegate_to: localhost
      become: no
      failed_when: false

    - name: Refuse to fabricate a result when OPA did not answer
      ansible.builtin.assert:
        that:
          - (opa_response.status | default(-1)) == 200
          - opa_response.json.result is defined
          - opa_response.json.result.total_controls is defined
          - opa_response.json.result.facts_supplied is defined
          - opa_response.json.result.facts_supplied | bool
        fail_msg: >-
          OPA did not return an evaluation (status
          {{ opa_response.status | default('no connection') }} from
          {{ opa_server_url }}/v1/data/{{ opa_framework_path[framework] }}/main/compliance_report).
          Refusing to continue: no answer from the policy engine means NO
          ASSESSMENT, never a clean one. Is the `stigs` loader key loaded?
          OPA said: {{ (opa_response.json | default(opa_response.content | default(opa_response.msg | default('nothing')))) | to_json | truncate(600) }}

    - name: Read the STIG version label from the module metadata
      uri:
        use_proxy: false
        url: "{{ opa_server_url }}/v1/data/{{ opa_framework_path[framework] }}/stig_assessment/metadata"
        method: POST
        body_format: json
        body:
          input: "{{ opa_input }}"
        return_content: yes
        status_code: 200
      register: stig_meta
      delegate_to: localhost
      become: no
      failed_when: false

    - name: Extract report fields
      set_fact:
        compliance_result: "{{ opa_response.json.result }}"
        assessment_timestamp: "{{ ansible_date_time.iso8601 }}"
        violations: "{{ opa_response.json.result.violations | default([]) }}"
        is_compliant: "{{ opa_response.json.result.compliant | default(false) | bool }}"
        total_controls: "{{ opa_response.json.result.total_controls | int }}"
        passed_controls: "{{ opa_response.json.result.passed_controls | default(0) | int }}"
        failed_controls: "{{ opa_response.json.result.failed_controls | default(0) | int }}"
        compliance_score: "{{ opa_response.json.result.compliance_percentage | default(0) | float }}"
        stig_version: "{{ (stig_meta.json.result.version | default('')) if (stig_meta.status | default(0)) == 200 else '' }}"
        stig_title: "{{ (stig_meta.json.result.stig_title | default(_stig_labels[framework])) if (stig_meta.status | default(0)) == 200 else _stig_labels[framework] }}"

    - name: Generate compliance report file
      copy:
        content: "{{ {
            'assessment_metadata': {
              'hostname': inventory_hostname,
              'assessment_time': assessment_timestamp,
              'framework': framework,
              'benchmark': stig_title,
              'benchmark_version': stig_version,
              'opa_path': opa_framework_path[framework] ~ '/main/compliance_report'
            },
            'system_info': opa_input.system_info,
            'compliance_summary': {
              'is_compliant': is_compliant,
              'total_controls': total_controls | int,
              'passed_controls': passed_controls | int,
              'failed_controls': failed_controls | int,
              'compliance_percentage': compliance_score | float
            },
            'violations': violations
          } | to_nice_json }}"
        dest: "{{ report_dir }}/{{ inventory_hostname }}_{{ framework }}_report_{{ timestamp }}.json"
      delegate_to: localhost
      become: no

    - name: Display compliance summary
      debug:
        msg: |
          ========================================
          {{ stig_title }} {{ stig_version }}
          ========================================
          Hostname: {{ inventory_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }}, {{ ansible_kernel }})
          Controls evaluated: {{ total_controls }} — Open: {{ failed_controls }} — Not a finding: {{ passed_controls }}
          Compliance: {{ compliance_score }}%
          Report: {{ report_dir }}/{{ inventory_hostname }}_{{ framework }}_report_{{ timestamp }}.json

    - name: Open findings (first 10)
      debug:
        msg: "{{ violations[:10] | map(attribute='stig_id') | zip(violations[:10] | map(attribute='severity'), violations[:10] | map(attribute='rule_title')) | list }}"
      when: violations | length > 0

    # ── Store ────────────────────────────────────────────────────────────────
    - name: Store STIG results to PostgreSQL (+ CAA row)
      include_role:
        name: aac_store_results
      vars:
        pg_password:               "{{ compliance_db_password }}"
        aac_result_framework:      "{{ framework }}"
        aac_result_policy_name:    "{{ _stig_labels[framework] }}"
        aac_result_policy_version: "{{ stig_title }}{{ (' ' ~ stig_version) if stig_version else '' }}"
        aac_result_total_controls: "{{ total_controls | int }}"
        aac_result_violations:     "{{ violations }}"
        aac_result_failed_controls: "{{ failed_controls | int }}"
        aac_result_passed_controls: "{{ passed_controls | int }}"
        aac_result_compliance_pct:  "{{ compliance_score | float }}"
        aac_result_metadata: "{{ {'hostname': inventory_hostname, 'distribution': ansible_distribution, 'distribution_version': ansible_distribution_version, 'kernel': ansible_kernel, 'architecture': ansible_architecture, 'assessment_time': assessment_timestamp, 'is_compliant': is_compliant, 'framework': framework, 'benchmark': stig_title, 'benchmark_version': stig_version, 'evaluation_endpoint': opa_framework_path[framework] ~ '/main/compliance_report', 'facts_schema_version': facts_schema_version, 'cat_i_open': violations | selectattr('severity', 'equalto', 'CAT I') | list | length} }}"
        aac_result_opa_server: "{{ opa_server_url }}"
        aac_caa_enabled: true
        aac_result_caa_framework_version: "{{ stig_version | default('', true) }}"
        aac_result_caa_result:
          framework:             "{{ framework }}"
          benchmark:             "{{ stig_title }}"
          benchmark_version:     "{{ stig_version }}"
          compliant:             "{{ is_compliant | bool }}"
          compliance_percentage: "{{ compliance_score | float }}"
          total_controls:        "{{ total_controls | int }}"
          passed_controls:       "{{ passed_controls | int }}"
          failed_controls:       "{{ failed_controls | int }}"
          violations:            "{{ violations }}"
        aac_result_caa_input: "{{ opa_input }}"

    - name: Results stored to PostgreSQL
      debug:
        msg: "Stored {{ _stig_labels[framework] }} result for {{ inventory_hostname }}: {{ compliance_score }}% ({{ passed_controls }}/{{ total_controls }} controls)"
