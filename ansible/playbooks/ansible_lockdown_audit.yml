---
# Ansible-Lockdown audit ingestion — ingest goss audit results as AAC findings.
#
# Runs a goss audit (the audit format ansible-lockdown ships) on each target
# host against an operator-supplied gossfile, captures the JSON output, parses
# it deterministically (scripts/goss_audit_parse.py), and records the result in
# compliance_results via the aac_store_results role — so ansible-lockdown audit
# results become first-class AAC findings: waiver-aware, evidence-provenanced,
# historically tracked, and visible in the heat map and dashboards.
#
# This is the "keep your Ansible-Lockdown hardening + goss audit, gain the AAC
# program" on-ramp. It ingests the audit faithfully; it does not (yet) map goss
# checks to a control framework — the parsed output keeps each check's `meta`
# (which ansible-lockdown gossfiles use for the CIS/STIG control id) so a control
# crosswalk can be added later without re-auditing.
#
# ── What it does NOT do ──────────────────────────────────────────────
#   - It does not install content. The target needs the `goss` binary and the
#     ansible-lockdown gossfile present (ansible-lockdown's audit role stages
#     both). Point gossfile_path at that file.
#   - It does not run the *remediation* roles. Orchestrating ansible-lockdown
#     remediation is a separate, governed flow.
#
# ── Variables ────────────────────────────────────────────────────────
#   gossfile_path    (required) path to the goss file on the target.
#   goss_bin         goss binary. Default: goss (on PATH).
#   framework_label  compliance_results.framework key. Default derived from the
#                    gossfile name (e.g. ansible_lockdown_RHEL9-CIS).
#   record_to_db     true|false. Default true.
#
# ── AAP Job Template ─────────────────────────────────────────────────
#   "AAC - Ansible-Lockdown Audit"

- name: Ansible-Lockdown audit — run goss on targets and ingest results
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true

  vars_files:
    - ../vars/site_config.yml

  vars:
    # gossfile_path: <set via extra_vars / survey / inventory>
    goss_bin: "goss"
    # framework_label: <set via extra_vars / survey / inventory>
    record_to_db: true
    _ts: "{{ lookup('pipe', 'date +%s') }}"
    _controller_results: "/tmp/goss-audit-{{ inventory_hostname }}-{{ _ts }}.json"
    _parser: "{{ playbook_dir }}/../../scripts/goss_audit_parse.py"

  tasks:
    - name: Require a gossfile_path
      ansible.builtin.assert:
        that: (gossfile_path | default('', true)) | length > 0
        fail_msg: "gossfile_path is required (path to the ansible-lockdown goss file on the target)."

    - name: Ensure goss is present (captures its version too)
      ansible.builtin.command:
        argv:
          - "{{ goss_bin }}"
          - "--version"
      register: _goss_ver
      changed_when: false
      # rc != 0 fails here clearly. Install goss (ansible-lockdown's audit role
      # stages it); this playbook does not install it.

    - name: Confirm the gossfile exists on the target
      ansible.builtin.stat:
        path: "{{ (gossfile_path | default('', true)) }}"
      register: _gf_stat

    - name: Fail with a clear message if the gossfile is missing
      ansible.builtin.fail:
        msg: >-
          gossfile not found on {{ inventory_hostname }}: {{ (gossfile_path | default('', true)) }}.
          Stage the ansible-lockdown audit content, or pass gossfile_path=<file>.
      when: not _gf_stat.stat.exists

    - name: Run the goss audit
      ansible.builtin.command:
        argv:
          - "{{ goss_bin }}"
          - "-g"
          - "{{ (gossfile_path | default('', true)) }}"
          - "validate"
          - "--format"
          - "json"
      register: _goss_run
      changed_when: false
      # goss exit codes: 0 = all pass, 1 = at least one check failed (a normal
      # finding), >1 = error. Only >1 (or other) is fatal.
      failed_when: _goss_run.rc not in [0, 1]

    - name: Derive framework label when none supplied
      ansible.builtin.set_fact:
        framework_label: >-
          {{ ('ansible_lockdown_' + ((gossfile_path | default('', true)) | basename | regex_replace('\.[^.]*$', '')
              | regex_replace('[^A-Za-z0-9]', '_'))) | truncate(90, true, '') }}
      when: (framework_label | default('', true)) | length == 0

    # ── Controller-side: parse the captured JSON and store the result ────
    - name: Parse and record the Ansible-Lockdown audit result
      delegate_to: localhost
      become: false
      block:
        - name: Write the goss JSON to the controller
          ansible.builtin.copy:
            content: "{{ _goss_run.stdout }}"
            dest: "{{ _controller_results }}"
            mode: "0600"

        - name: Parse the goss results (deterministic)
          ansible.builtin.command:
            argv:
              - python3
              - "{{ _parser }}"
              - "{{ _controller_results }}"
          register: _parsed_raw
          changed_when: false

        - name: Load parsed results
          ansible.builtin.set_fact:
            _goss: "{{ _parsed_raw.stdout | from_json }}"

        - name: Summary
          ansible.builtin.debug:
            msg:
              - "Ansible-Lockdown audit — {{ inventory_hostname }}"
              - "  gossfile:  {{ (gossfile_path | default('', true)) }}"
              - "  framework: {{ (framework_label | default('', true)) }}"
              - "  evaluated: {{ _goss.total_evaluated }}  (passed {{ _goss.passed }}, failed {{ _goss.failed }}, skipped {{ _goss.skipped }})"
              - "  score:     {{ _goss.compliance_pct }}%"
              - "  {{ '✓ COMPLIANT' if _goss.compliant else '✗ NON-COMPLIANT' }}"

        - name: Record Ansible-Lockdown result to compliance_results (waiver-aware)
          ansible.builtin.include_role:
            name: aac_store_results
          vars:
            aac_result_hostname:        "{{ inventory_hostname }}"
            aac_result_policy_name:     "Ansible-Lockdown {{ (framework_label | default('', true)) }}"
            aac_result_framework:       "{{ (framework_label | default('', true)) }}"
            aac_result_policy_version:  "{{ (gossfile_path | default('', true)) | basename }}"
            aac_result_total_controls:  "{{ _goss.total_evaluated | int }}"
            aac_result_passed_controls: "{{ _goss.passed | int }}"
            aac_result_failed_controls: "{{ _goss.failed | int }}"
            aac_result_compliance_pct:  "{{ _goss.compliance_pct | float }}"
            aac_result_violations: "{{ _goss.failed_rules }}"
            aac_result_metadata:
              tool: "ansible-lockdown"
              audit_engine: "goss (ingested by AAC)"
              tool_version: "{{ _goss_ver.stdout | trim }}"
              gossfile: "{{ (gossfile_path | default('', true)) }}"
              by_status: "{{ _goss.by_status }}"
              test_count: "{{ _goss.test_count }}"
              skipped: "{{ _goss.skipped }}"
              framework: "{{ (framework_label | default('', true)) }}"
              compliant: "{{ _goss.compliant }}"
            aac_result_opa_server: "{{ opa_security_url | default(opa_server_url | default('', true), true) }}"
          when: record_to_db | bool
      always:
        - name: Clean up the captured result (even if parse/store failed)
          ansible.builtin.file:
            path: "{{ _controller_results }}"
            state: absent
