---
# AAC Fresh Install — Phase 1: Provision EC2 Instance
#
# Launches a RHEL 9 t3.2xlarge (8 vCPU, 32GB RAM) in AWS for a full AAC install.
# Creates a dedicated security group with all required AAC service ports.
# Outputs the public IP — record it for phases 2-6.
#
# Survey variables (required):
#   ec2_key_name   — name of existing AWS key pair for SSH access (ec2-user)
#   aws_region     — AWS region (default: us-east-1)
#
# After this job: scp the AAP bundle and manifest to the new instance:
#   scp ~/Downloads/ansible-automation-platform-containerized-setup-bundle-2.6-1-x86_64.tar.gz \
#       ec2-user@<TARGET_IP>:/home/ec2-user/aap-bundle.tar.gz
#   scp ~/Downloads/0ec418ab-59ed-4654-8ca9-de11cc57c0ce.zip \
#       ec2-user@<TARGET_IP>:/home/ec2-user/aap-manifest.zip
#
# AAP Job Template: "AAC - Fresh Install: 01 Provision EC2"
# Credentials: Ansible Vault (for AWS keys)
# EE: AAC Compliance EE

- name: Provision RHEL 9 EC2 for AAC Fresh Install
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - [ "../vars/vault_secrets.yml", "../vars/empty_fallback.yml" ]
    - ../vars/site_config.yml

  vars:
    # aws_region: <set via extra_vars / survey / inventory>   # default 'us-east-1'
    ec2_key_name:  "{{ ec2_key_name }}"
    instance_name: "aac-fresh-install"
    instance_type: "t3.2xlarge"
    root_volume_gb: 150
    # RHEL 9 — Red Hat official AMI
    rhel9_ami_owner: "309956199498"
    rhel9_ami_filter: "RHEL-9*_HVM-*-x86_64-*"

  tasks:

    # ── Find latest RHEL 9 AMI ─────────────────────────────────────────────────
    # AWS credentials come from the AAP "AWS Compliance Lab" credential (ID 5),
    # which injects AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars.
    - name: Find latest RHEL 9 AMI
      amazon.aws.ec2_ami_info:
        region: "{{ (aws_region | default('us-east-1', true)) }}"
        owners:
          - "{{ rhel9_ami_owner }}"
        filters:
          name: "{{ rhel9_ami_filter }}"
          architecture: "x86_64"
          root-device-type: "ebs"
          virtualization-type: "hvm"
      register: rhel9_ami_results

    - name: Set RHEL 9 AMI ID
      ansible.builtin.set_fact:
        rhel9_ami_id: >-
          {{ (rhel9_ami_results.images | sort(attribute='creation_date', reverse=true) | first).image_id }}

    - name: Show AMI selected
      ansible.builtin.debug:
        msg: "Using RHEL 9 AMI: {{ rhel9_ami_id }}"

    # ── Look up default VPC and subnet ───────────────────────────────────────
    - name: Find default VPC
      amazon.aws.ec2_vpc_net_info:
        region: "{{ (aws_region | default('us-east-1', true)) }}"
        filters:
          isDefault: "true"
      register: default_vpc

    - name: Find default subnet (first available in default VPC)
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ (aws_region | default('us-east-1', true)) }}"
        filters:
          vpc-id: "{{ default_vpc.vpcs[0].vpc_id }}"
          defaultForAz: "true"
      register: default_subnets

    - name: Set default subnet ID
      ansible.builtin.set_fact:
        default_subnet_id: "{{ default_subnets.subnets[0].subnet_id }}"
        default_vpc_id: "{{ default_vpc.vpcs[0].vpc_id }}"

    - name: Show VPC and subnet
      ansible.builtin.debug:
        msg: "Using VPC: {{ default_vpc_id }}, Subnet: {{ default_subnet_id }}"

    # ── Create Security Group ─────────────────────────────────────────────────
    - name: Create AAC security group
      amazon.aws.ec2_security_group:
        name: "aac-fresh-install-sg"
        description: "AAC fresh install - all required service ports"
        region: "{{ (aws_region | default('us-east-1', true)) }}"
        state: present
        rules:
          - proto: tcp
            ports: 22
            cidr_ip: "0.0.0.0/0"
            rule_desc: "SSH"
          - proto: tcp
            ports: 443
            cidr_ip: "0.0.0.0/0"
            rule_desc: "AAP HTTPS"
          - proto: tcp
            ports: 80
            cidr_ip: "0.0.0.0/0"
            rule_desc: "HTTP redirect"
          - proto: tcp
            ports: 8181
            cidr_ip: "0.0.0.0/0"
            rule_desc: "OPA Security"
          - proto: tcp
            ports: 8182
            cidr_ip: "0.0.0.0/0"
            rule_desc: "OPA Compliance"
          - proto: tcp
            ports: 8183
            cidr_ip: "0.0.0.0/0"
            rule_desc: "OPA OT"
          - proto: tcp
            ports: 8004
            cidr_ip: "0.0.0.0/0"
            rule_desc: "MCP Server"
          - proto: tcp
            ports: 3000
            cidr_ip: "0.0.0.0/0"
            rule_desc: "Grafana"
          - proto: tcp
            from_port: 8085
            to_port: 8087
            cidr_ip: "0.0.0.0/0"
            rule_desc: "Smart Meter Simulator"
          - proto: tcp
            ports: 5432
            cidr_ip: "0.0.0.0/0"
            rule_desc: "PostgreSQL (restrict if needed)"
        rules_egress:
          - proto: all
            cidr_ip: "0.0.0.0/0"
        tags:
          Name: "aac-fresh-install-sg"
          Project: "aac"
          Purpose: "fresh-install-test"
        vpc_id: "{{ default_vpc_id }}"
      register: aac_sg

    # ── Launch EC2 Instance ───────────────────────────────────────────────────
    - name: Launch RHEL 9 t3.2xlarge instance
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        key_name: "{{ ec2_key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ rhel9_ami_id }}"
        region: "{{ (aws_region | default('us-east-1', true)) }}"
        vpc_subnet_id: "{{ default_subnet_id }}"
        security_groups:
          - "aac-fresh-install-sg"
        network:
          assign_public_ip: true
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: "{{ root_volume_gb }}"
              volume_type: gp3
              delete_on_termination: true
        state: running
        wait: true
        wait_timeout: 300
        tags:
          Name: "{{ instance_name }}"
          Project: "aac"
          Purpose: "fresh-install-test"
          DestroyAfterValidation: "true"
      register: ec2_result

    - name: Set target host IP
      ansible.builtin.set_fact:
        target_ip: "{{ ec2_result.instances[0].public_ip_address }}"
        instance_id: "{{ ec2_result.instances[0].instance_id }}"

    # ── Wait for SSH ──────────────────────────────────────────────────────────
    - name: Wait for SSH to be available
      ansible.builtin.wait_for:
        host: "{{ target_ip }}"
        port: 22
        delay: 30
        timeout: 300
        state: started

    # ── Output ────────────────────────────────────────────────────────────────
    - name: "=== Phase 1 Complete — Instance Ready ==="
      ansible.builtin.debug:
        msg:
          - ""
          - "╔══════════════════════════════════════════════════════════╗"
          - "║          EC2 Instance Provisioned Successfully           ║"
          - "╚══════════════════════════════════════════════════════════╝"
          - ""
          - "  Instance ID:  {{ instance_id }}"
          - "  Public IP:    {{ target_ip }}"
          - "  Instance Type: {{ instance_type }}"
          - "  AMI:           {{ rhel9_ami_id }}"
          - "  Region:        {{ (aws_region | default('us-east-1', true)) }}"
          - ""
          - "  ┌──────────────────────────────────────────────────────┐"
          - "  │           NEXT STEP — MANUAL (do this now)           │"
          - "  ├──────────────────────────────────────────────────────┤"
          - "  │  Copy AAP bundle + manifest to instance:             │"
          - "  │                                                      │"
          - "  │  scp ~/Downloads/ansible-automation-platform-        │"
          - "  │      containerized-setup-bundle-2.6-1-x86_64.tar.gz │"
          - "  │      ec2-user@{{ target_ip }}:/home/ec2-user/aap-bundle.tar.gz  │"
          - "  │                                                      │"
          - "  │  scp ~/Downloads/0ec418ab-59ed-4654-8ca9-            │"
          - "  │      de11cc57c0ce.zip                                │"
          - "  │      ec2-user@{{ target_ip }}:/home/ec2-user/aap-manifest.zip   │"
          - "  │                                                      │"
          - "  │  NOTE: You need your AWS SSH key ({{ ec2_key_name }}.pem) │"
          - "  │        Add -i ~/.ssh/{{ ec2_key_name }}.pem if needed       │"
          - "  └──────────────────────────────────────────────────────┘"
          - ""
          - "  Then run Phase 02 with:"
          - "    target_host = {{ target_ip }}"
          - ""
          - "  To destroy when done:"
          - "    Run 'AAC - Fresh Install: 00 Teardown' with"
          - "    instance_id = {{ instance_id }}"
