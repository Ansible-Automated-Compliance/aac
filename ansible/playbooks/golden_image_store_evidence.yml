---
# golden_image_store_evidence.yml — the evidence finale of the governed-drift AO
# workflow: write one compliance_results row recording the enforcement outcome,
# including the governance receipts (policy route, overrode_agent,
# rollback_verified).
#
# Topology-neutral product version of the AO job template
# AAC_GoldenImage_StoreEvidence (the SSH-shape family, next to
# golden_image_check.yml / golden_image_rollback.yml). It touches only the
# evidence database and never connects to the target host.
#
# FAIL-CLOSED: the row claims compliance ONLY when the outcome is proven —
# an EXPLICIT upstream route == compliant (the policy's verdict: no drift,
# baseline verdict clean), or a remediation route whose rollback was VERIFIED
# (rollback_verified from the Rollback job's set_stats). A remediation that
# was not verified is recorded as NON-compliant, with a violation message.
# No route at all (artifact missing, playbook launched by hand) keeps the
# default route=hold and is recorded NON-compliant with its own violation
# text — the default is never the compliant path. Evidence never claims a
# baseline that was not provably checked.
#
# Rows are written by direct INSERT and are UNSIGNED: metadata records
# caa_signed:false so nobody mistakes the row for the cosign-signed CAA path.
#
# ── Required extra_vars ─────────────────────────────────────────────────────
#   target_host   Hostname the row is recorded against (compliance_results.hostname)
# ── Database (all three) ────────────────────────────────────────────────────
#   pg_host / pg_user / pg_db / pg_password (or compliance_db_password)
#                 Evidence database. From site_config.yml / vault_secrets.yml
#                 when the checkout has them (gitignored; AAP project checkouts
#                 do not), else from a credential or extra_vars. pg_host has no
#                 default and the play fails without it. pg_port defaults to
#                 5432. There is no default password.
# ── Optional (survey/extra_vars) ────────────────────────────────────────────
#   framework          compliance_results.framework. Default: nerc_cip_ocp.
#   route              Policy route: compliant | auto_remediate | approve_remediate
#                      (REQUIRED for a compliant row; default "hold" → non-compliant).
#   overrode_agent     Did policy override the agent's recommendation (bool).
#   rollback_verified  Rollback job's verified outcome (bool; fail-closed).

- name: Store governed-drift enforcement evidence
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    framework: "nerc_cip_ocp"
    route: "hold"
    overrode_agent: false
    rollback_verified: false

    _remediation_route: "{{ route in ['auto_remediate', 'approve_remediate'] }}"
    _at_baseline: >-
      {{ (route == 'compliant') or
         (_remediation_route | bool and rollback_verified | bool) }}
    _violations: >-
      {{ [] if _at_baseline | bool else
         (['CIP-010 baseline: no policy verdict supplied (route=' ~ route ~
           ') — baseline status unknown, recorded as non-compliant']
          if not (route == 'compliant' or _remediation_route | bool) else
          ['CIP-010 baseline: drift detected and remediation NOT verified (route=' ~ route ~
           ', rollback_verified=' ~ (rollback_verified | bool) ~ ')']) }}

  tasks:
    - name: Load site config if present
      ansible.builtin.include_vars: "{{ item }}"
      loop: "{{ query('first_found', ['../vars/site_config.yml'], errors='ignore') }}"

    - name: Load vault secrets if present
      ansible.builtin.include_vars: "{{ item }}"
      loop: "{{ query('first_found', ['../vars/vault_secrets.yml'], errors='ignore') }}"
      no_log: true

    - name: Require a target host
      ansible.builtin.assert:
        that:
          - target_host is defined
          - (target_host | default('', true)) | length > 0
          # Deliberately NOT checked against groups['all']: this play only
          # talks to the evidence database and never SSHes to the host, so
          # target_host is a database key (hostname), not an inventory member.
        fail_msg: >-
          target_host is not set. Supply the hostname the evidence database
          knows this system by, via extra_vars or the job template survey.
        quiet: true

    - name: Require a database host
      ansible.builtin.assert:
        that:
          - (pg_host | default('', true)) | length > 0
        fail_msg: >-
          pg_host is not set. Supply it via site_config.yml, an evidence-database
          credential, or extra_vars — this playbook has no environment default.
        quiet: true

    - name: Record the enforcement outcome
      community.postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port | default(5432) }}"
        login_user: "{{ pg_user | default('postgres') }}"
        login_password: "{{ pg_password | default(compliance_db_password | default(omit)) }}"
        login_db: "{{ pg_db | default('compliance') }}"
        query: |
          INSERT INTO compliance_results
            (hostname, framework, policy_name, policy_version,
             total_controls, passed_controls, failed_controls,
             compliance_percentage, compliant, violations, metadata)
          VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s::jsonb, %s::jsonb)
          RETURNING id, evaluation_timestamp
        positional_args:
          - "{{ target_host }}"
          - "{{ framework }}"
          - "AAC Golden Image (CIP-010) — AO governed enforcement"
          - "golden-image-ao"
          - 1
          - "{{ 1 if _at_baseline | bool else 0 }}"
          - "{{ 0 if _at_baseline | bool else 1 }}"
          - "{{ 100.0 if _at_baseline | bool else 0.0 }}"
          - "{{ _at_baseline | bool }}"
          - "{{ _violations | to_json }}"
          - "{{ {'enforcement': 'automation_orchestrator',
                 'route': route,
                 'overrode_agent': overrode_agent | bool,
                 'rollback_verified': rollback_verified | bool,
                 'baseline_restored': _at_baseline | bool,
                 'caa_signed': false} | to_json }}"
      register: evidence_row

    - name: Evidence stored
      ansible.builtin.debug:
        msg:
          - "Evidence row {{ evidence_row.query_result[0].id }} written for {{ target_host }} ({{ framework }})."
          - "  Route: {{ route }} | overrode_agent: {{ overrode_agent | bool }} | rollback verified: {{ rollback_verified | bool }}"
          - "  {{ 'COMPLIANT row recorded.' if _at_baseline | bool else ('NON-COMPLIANT row recorded — no policy verdict supplied (route=' ~ route ~ ').' if not (route == 'compliant' or _remediation_route | bool) else 'NON-COMPLIANT row recorded — remediation unverified; the evidence says so.') }}"
