---
# AAC EDA Credentials — RHPDS Configuration
#
# EDA needs its own AAP controller credential to launch job templates
# and workflow job templates in response to events.

eda_credentials:

  - name: AAC Controller Credential
    description: "EDA → AAP controller auth for launching AAC job/workflow templates"
    credential_type: Red Hat Ansible Automation Platform
    organization: "{{ aac_organization }}"
    inputs:
      host: "{{ aap_controller_url }}"
      username: "admin"
      password: "{{ rhpds_controller_password }}"
      ssl_verify: "false"
