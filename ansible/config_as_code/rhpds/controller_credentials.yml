---
# AAC Controller Credentials
#
# Sensitive values are sourced from vault_secrets.yml (loaded by the bootstrap playbook).
# The SSH private key for AAC Demo Host must be set post-bootstrap via the AAP UI or
# by running the "AAC - Update SSH Key" job template.

controller_credentials:

  # ── Source Control ──────────────────────────────────────────────────────────
  - name: GitHub PAT
    description: "GitHub PAT for AAC compliance repo (ansible-automated-compliance/aac)"
    organization: "{{ aac_organization }}"
    credential_type: Source Control
    inputs:
      username: "ynotbhatc"
      password: "{{ vault_github_pat }}"

  # ── Vault ───────────────────────────────────────────────────────────────────
  - name: Ansible Vault
    description: "Vault password for AAC encrypted vars (vault_secrets.yml)"
    organization: "{{ aac_organization }}"
    credential_type: Vault
    inputs:
      vault_password: "{{ vault_password }}"

  # ── Machine (SSH) ────────────────────────────────────────────────────────────
  # ansible_host is set at bootstrap time via the aac_demo_host survey variable.
  # SSH private key must be populated after bootstrap via the AAP UI.
  - name: AAC Demo Host (SSH)
    description: "SSH access to AWS EC2 demo host — update private key after bootstrap"
    organization: "{{ aac_organization }}"
    credential_type: Machine
    inputs:
      username: "{{ rhpds_ssh_user | default('ec2-user') }}"
      become_method: sudo
