      - {kind: service, match: veeamservice.service}
      - {kind: process, match: veeamservice}

  - key: netbackup_server
    name: Veritas NetBackup server
    kind: backup_server
    collector: none yet
    loader_keys: []
    privileged: {act: true, map: true, rank: true}
