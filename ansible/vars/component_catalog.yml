    name: Veritas NetBackup client (backup agent)
    kind: backup_agent
    collector: none yet
    loader_keys: []
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: VRTSnbclt}
      - {kind: process, match: bpcd, role: supporting}
      - {kind: port, match: 13724}
      - {kind: port, match: 1556}

  - key: commvault_agent
    name: Commvault (backup agent or MediaAgent)
    kind: backup_agent
    collector: none yet
    loader_keys: []
    privileged: {act: false, map: false, rank: false}
    signals:
