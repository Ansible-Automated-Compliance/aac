# ── Base operating system allowlist ──────────────────────────────────────────
# Units and listening processes that ship with the supported operating systems.
# They are left out of the "running, not recognised" list so that the list
# shows what the catalog does not explain, not what every host runs.
# Patterns are shell-style and compared without regard to case.
base_os:
  service_units:
    - "systemd-*.service"
    - "user@*.service"
    - "user-runtime-dir@*.service"
    - "getty@*.service"
    - "serial-getty@*.service"
    - "dbus.service"
    - "dbus-broker.service"
    - "polkit.service"
    - "NetworkManager*.service"
    - "networkd-dispatcher.service"
    - "wpa_supplicant.service"
    - "ModemManager.service"
    - "firewalld.service"
    - "nftables.service"
    - "ufw.service"
    - "chronyd.service"
    - "chrony.service"
    - "crond.service"
    - "cron.service"
    - "atd.service"
    - "auditd.service"
    - "rsyslog.service"
    - "tuned.service"
    - "tuned-ppd.service"
    - "irqbalance.service"
    - "smartd.service"
    - "mcelog.service"
    - "udisks2.service"
    - "upower.service"
    - "multipathd.service"
    - "lvm2-*.service"
    - "libstoragemgmt.service"
    - "rhsmcertd.service"
    - "rhsm.service"
    - "insights-client*.service"
    - "sssd.service"
    - "sssd-*.service"
    - "gssproxy.service"
    - "rpcbind.service"
    - "qemu-guest-agent.service"
    - "vmtoolsd.service"
    - "vgauthd.service"
    - "acpid.service"
    - "apparmor.service"
    - "apport.service"
    - "kmod.service"
    - "procps.service"
    - "udev.service"
    - "plymouth*.service"
    - "snapd.service"
    - "unattended-upgrades.service"
