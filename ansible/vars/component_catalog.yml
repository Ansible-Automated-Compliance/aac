      - {kind: port, match: 8400}

  - key: spectrum_protect_client
    name: IBM Storage Protect (Spectrum Protect) client
    kind: backup_agent
    collector: none yet
    loader_keys: []
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: TIVsm-BA}
      - {kind: service, match: dsmcad.service}
      - {kind: process, match: dsmcad}
      - {kind: package, match: TIVsm-API64, role: supporting}

  - key: rubrik_agent
    name: Rubrik Backup Service (backup agent)
    kind: backup_agent
    collector: none yet
    loader_keys: []
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: rubrik-agent}
      - {kind: service, match: rubrikagents.service}
      - {kind: port, match: 12800}
      - {kind: port, match: 12801}

  # ── Secrets, monitoring, policy ────────────────────────────────────────────
  - key: hashicorp_vault
    name: HashiCorp Vault server
    kind: secrets_manager
    collector: none yet
    loader_keys: []
    privileged: {act: true, map: false, rank: true}
    signals:
      # The vault package ships one binary that is both client and server, so
      # the package alone does not identify a server.
      - {kind: service, match: vault.service}
      - {kind: process, match: vault}
      - {kind: container_image, match: "*hashicorp/vault*"}
      - {kind: package, match: vault, role: supporting}
      - {kind: port, match: 8200}

  - key: grafana
    name: Grafana
    kind: monitoring
    collector: none yet
    loader_keys: []
    privileged: {act: false, map: true, rank: false}
    signals:
      - {kind: package, match: grafana}
      - {kind: package, match: grafana-enterprise}
      - {kind: service, match: grafana-server.service}
      - {kind: process, match: grafana}
      - {kind: process, match: grafana-server}
      - {kind: container_image, match: "*grafana/grafana*"}
      - {kind: port, match: 3000}

  - key: opa
    name: Open Policy Agent
    kind: policy_engine
    collector: none yet
    loader_keys: []
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: service, match: opa.service}
      - {kind: service, match: "opa-*.service"}
      - {kind: process, match: opa}
      - {kind: container_image, match: "*openpolicyagent/opa*", strength: strong}
      - {kind: port, match: 8181}

# ── Base operating system allowlist ──────────────────────────────────────────
# Units and listening sockets that ship with the supported operating systems.
# They are left out of the "running, not recognised" list so that the list
# shows what the catalog does not explain, not what every host runs.
# Patterns are shell-style and compared without regard to case.
base_os:
  service_units:
    - "systemd-*.service"
    - "user@*.service"
    - "user-runtime-dir@*.service"
    - "getty@*.service"
    - "serial-getty@*.service"
    - "dbus.service"
    - "dbus-broker.service"
    - "polkit.service"
    - "NetworkManager*.service"
    - "networkd-dispatcher.service"
    - "wpa_supplicant.service"
    - "ModemManager.service"
    - "firewalld.service"
    - "nftables.service"
    - "ufw.service"
    - "chronyd.service"
    - "chrony.service"
    - "crond.service"
    - "cron.service"
    - "atd.service"
    - "auditd.service"
    - "rsyslog.service"
    - "tuned.service"
    - "tuned-ppd.service"
    - "irqbalance.service"
    - "smartd.service"
    - "mcelog.service"
    - "udisks2.service"
    - "upower.service"
    - "multipathd.service"
    - "lvm2-*.service"
    - "libstoragemgmt.service"
    - "rhsmcertd.service"
    - "rhsm.service"
    - "insights-client*.service"
    - "sssd.service"
    - "sssd-*.service"
    - "gssproxy.service"
    - "rpcbind.service"
    - "qemu-guest-agent.service"
    - "vmtoolsd.service"
    - "vgauthd.service"
    - "acpid.service"
    - "apparmor.service"
    - "apport.service"
    - "kmod.service"
    - "procps.service"
    - "udev.service"
    - "plymouth*.service"
    - "snapd.service"
    - "unattended-upgrades.service"
    - "packagekit.service"
    - "fwupd.service"
    - "bolt.service"
    - "kdump.service"
    - "cloud-init*.service"
    - "cloud-config.service"
    - "cloud-final.service"
    - "amazon-ssm-agent.service"
    - "snap.amazon-ssm-agent.amazon-ssm-agent.service"
    - "hibinit-agent.service"
    - "gdm.service"
    - "accounts-daemon.service"
    - "colord.service"
    - "rtkit-daemon.service"
    - "switcheroo-control.service"
    - "alsa-state.service"
    - "low-memory-monitor.service"
    - "power-profiles-daemon.service"
    - "avahi-daemon.service"
    - "bluetooth.service"
    - "cups.service"
    - "cups-browsed.service"
  # A base listener is allowlisted only when the process name AND the protocol
  # and port match, and the bind scope too where one is given (`loopback`).
  # The same process name on any other socket is reported as not recognised,
  # so naming a process after a base daemon does not hide its socket.
  listeners:
    - {process: systemd, proto: tcp, port: 111}
    - {process: systemd, proto: udp, port: 111}
    - {process: rpcbind, proto: tcp, port: 111}
    - {process: rpcbind, proto: udp, port: 111}
    - {process: systemd-resolve, proto: tcp, port: 53, scope: loopback}
    - {process: systemd-resolve, proto: udp, port: 53, scope: loopback}
    - {process: systemd-resolve, proto: tcp, port: 5355}
    - {process: systemd-resolve, proto: udp, port: 5355}
    - {process: systemd-network, proto: udp, port: 68}
    - {process: systemd-network, proto: udp, port: 546}
    - {process: NetworkManager, proto: udp, port: 68}
    - {process: NetworkManager, proto: udp, port: 546}
    - {process: dhclient, proto: udp, port: 68}
    - {process: chronyd, proto: udp, port: 323, scope: loopback}
    - {process: avahi-daemon, proto: udp, port: 5353}
    - {process: cupsd, proto: tcp, port: 631, scope: loopback}
