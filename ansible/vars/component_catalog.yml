---
# Component detection catalog — which signals in stored host facts identify
# which technology component.
#
# Read by scripts/component_discovery.py (run by
# ansible/playbooks/discover_host_components.yml). This file ships with the
# product and is maintained here; the per-host component map is built from
# discovery and lives in the database. Reference: docs/reference/COMPONENT_DISCOVERY.md
#
# Bump catalog_version on every change to this file. Each row of the component
# map records the catalog_version that identified it.
#
# Entry fields
#   key          stable identifier (lower case, digits, underscore)
#   name         display name
#   kind         one of the values in `kinds` below
#   collector    name of the collector that gathers this component's own facts,
#                or "none yet"
#   loader_keys  framework_catalog.yml loader keys whose policies assess it
#   privileged   capability hints, each true or false:
#                  act   can act on other systems
#                  map   holds a map of the estate
#                  rank  reveals which systems matter most
#   signals      list of {kind, match, role, strength}
#
# Optional entry fields for layered collection (docs/reference/LAYERED_FACT_GATHERING.md;
# checked against ansible/files/component_collector_contract.schema.json)
#   assess       true (default) or false. false: the component is inventoried
#                where it is found and no collector runs for it
#   contains     catalog keys that can be found inside this component ("*" for any).
#                What a collector reports as found inside is matched against the
#                signals of these entries only
#   collectors   at most one per layer:
#                  layer       host (layer 2, over the connection already in use, only
#                              on hosts where the component was detected) or service
#                              (layer 3, the service's own API, once per instance)
#                  file        <key>_<layer>.py in ansible/tasks/component_collectors/,
#                              or "none yet"
#                  version     collector version, stored with every fact row
#                  cost        cheap or heavy (a schedule can run cheap collectors
#                              nightly and all of them weekly)
#                  access      the least-privilege, read-only access the collector needs
#                  credential  service side only: {type, env}. `type` is the credential
#                              type an operator attaches to the job; `env` lists the
#                              environment variables that type injects. When any is
#                              empty the service side is recorded as not assessed
#   `collector` (above) stays the name of the host-side collector for the step-1 views.
#
# Signal kinds, where each is read from the stored facts, and its strength
#   package          packages.installed (name)                 strong, shows "installed"
#   service          services.all + services.enabled_at_boot   strong when running or enabled
#                    (a unit that is present but neither running nor enabled is supporting only)
#   process          processes.processes_raw (command name) and the process
#                    named on each listening socket               medium
#   container_image  containers.running[].image                   medium, or strong when the
#                    entry sets `strength: strong`
#   port             network.listening_ports                      weak, supporting only
#
# `match` is a shell-style pattern (fnmatch), compared without regard to case.
# Process names are compared on their first 15 characters, because that is all
# the kernel keeps in the command name.
#
# role (default: server)
#   server      can identify the component
#   client      a client tool; recorded, never identifies the server component
#   supporting  recorded as evidence when the component is otherwise detected;
#               never identifies it alone
# A port signal is always supporting, whatever role is written.

catalog_version: "2026.11.3"

# What the collector guard (ansible/files/component_collector_guard.py) accepts
# when it verifies a process before a collector may read anything through it.
#   binary_dirs      directories, beside the standard system paths, where a
#                    trusted service binary may live (shell-style patterns)
#   runtime_parents  command names of container runtime monitors. A process in
#                    a container counts only when one of these, running as root
#                    from a root-owned binary, started it
collector_guard:
  binary_dirs:
    - "/usr/pgsql-*/bin"
    - "/usr/lib/postgresql/*/bin"
    - "/var/lib/rancher/*/data/*/bin"
  runtime_parents:
    - conmon
    - conmonrs
    - containerd-shim
    - containerd-shim-runc-v1
    - containerd-shim-runc-v2
    - docker-containerd-shim

kinds:
  - automation_controller
  - automation_node
  - container_orchestrator
  - container_runtime
  - database
  - web_server
  - remote_access
  - identity_server
  - systems_management
  - backup_server
  - backup_agent
  - secrets_manager
  - monitoring
  - policy_engine

components:

  # ── Automation ─────────────────────────────────────────────────────────────
  - key: aap_controller
    name: Ansible Automation Platform controller
    kind: automation_controller
    collector: none yet
    loader_keys: []
    privileged: {act: true, map: true, rank: true}
    signals:
      - {kind: package, match: automation-controller}
      - {kind: package, match: automation-controller-server}
      - {kind: package, match: ansible-tower}
      - {kind: package, match: ansible-tower-server}
      - {kind: service, match: automation-controller.service}
      - {kind: service, match: "automation-controller-*.service"}
      - {kind: service, match: ansible-tower.service}
      - {kind: service, match: supervisord.service, role: supporting}
      - {kind: container_image, match: "*ansible-automation-platform*/controller-rhel*", strength: strong}
      - {kind: package, match: automation-controller-cli, role: client}

  - key: awx
    name: AWX
    kind: automation_controller
    collector: none yet
    loader_keys: []
    privileged: {act: true, map: true, rank: true}
    signals:
      - {kind: container_image, match: "*quay.io/ansible/awx:*", strength: strong}
      - {kind: container_image, match: "*quay.io/ansible/awx", strength: strong}
      - {kind: container_image, match: "*ansible/awx_web*", strength: strong}
      - {kind: container_image, match: "*ansible/awx_task*", strength: strong}
      - {kind: container_image, match: "*quay.io/ansible/awx-operator*"}
      - {kind: port, match: 8052}

  - key: receptor
    name: Receptor (automation mesh node)
    kind: automation_node
    collector: none yet
    loader_keys: []
    privileged: {act: true, map: false, rank: false}
    signals:
      - {kind: package, match: receptor}
      - {kind: service, match: receptor.service}
      - {kind: process, match: receptor}
      - {kind: port, match: 27199}

  # ── Kubernetes and OpenShift ───────────────────────────────────────────────
  - key: kubernetes_control_plane
    name: Kubernetes control plane
    kind: container_orchestrator
    collector: kubernetes_control_plane_host
    loader_keys: [cis_kubernetes]
    privileged: {act: true, map: true, rank: true}
    assess: true
    contains: [etcd]
    collectors:
      - layer: host
        file: kubernetes_control_plane_host.py
        version: "1.0"
        cost: cheap
        access: >-
          The SSH account already used for fact collection, with privilege escalation to
          read root-owned files. Reads process command lines, file modes and owners under
          /etc/kubernetes, /etc/cni/net.d and the etcd data directory, and the static pod
          manifests and the audit, encryption and authentication configuration files the
          API server names. Reads no key file, no kubeconfig content and no Secret. Writes nothing.
      - layer: service
        file: none yet
        cost: heavy
        credential:
          type: AAC Kubernetes Read-Only
          env: [K8S_AUTH_HOST, K8S_AUTH_API_KEY]
        access: >-
          A service account token bound to a ClusterRole with get and list only on
          namespaces, service accounts, role bindings, network policies and workloads.
          No access to Secret objects, no write verbs.
    signals:
      - {kind: process, match: kube-apiserver}
      - {kind: process, match: kube-controller-manager}
      - {kind: process, match: kube-scheduler}
      - {kind: service, match: kube-apiserver.service}
      - {kind: container_image, match: "*kube-apiserver*", strength: strong}
      - {kind: process, match: etcd, role: supporting}
      - {kind: port, match: 6443}
      - {kind: port, match: 2379}
      - {kind: package, match: kubectl, role: client}
      - {kind: package, match: kubernetes-client, role: client}
      - {kind: package, match: kubeadm, role: client}

  - key: kubelet
    name: Kubernetes node (kubelet)
    kind: container_orchestrator
    collector: kubelet_host
    loader_keys: [cis_kubernetes]
    privileged: {act: false, map: false, rank: false}
    collectors:
      - layer: host
        file: kubelet_host.py
        version: "1.0"
        cost: cheap
        access: >-
          The SSH account already used for fact collection, with privilege escalation to
          read root-owned files. Reads the kubelet and kube-proxy command lines, the kubelet
          configuration file, and the modes and owners of the kubelet unit file, kubeconfig,
          client CA file and configuration directory. Reads no kubeconfig content and no key
          file. Writes nothing.
    signals:
      - {kind: package, match: kubelet}
      - {kind: service, match: kubelet.service}
      - {kind: process, match: kubelet}
      - {kind: port, match: 10250}

  - key: k3s
    name: K3s
    kind: container_orchestrator
    collector: none yet
    loader_keys: [cis_kubernetes]
    privileged: {act: true, map: true, rank: true}
    signals:
      - {kind: service, match: k3s.service}
      - {kind: service, match: k3s-agent.service}
      - {kind: process, match: k3s-server}
      - {kind: process, match: k3s-agent}
      - {kind: package, match: k3s-selinux, role: supporting}
      - {kind: port, match: 6443}

  - key: rke2
    name: RKE2
    kind: container_orchestrator
    collector: none yet
    loader_keys: [cis_kubernetes]
    privileged: {act: true, map: true, rank: true}
    signals:
      - {kind: package, match: rke2-server}
      - {kind: package, match: rke2-agent}
      - {kind: service, match: rke2-server.service}
      - {kind: service, match: rke2-agent.service}
      - {kind: package, match: rke2-common, role: supporting}
      - {kind: port, match: 9345}
      - {kind: port, match: 6443}

  - key: openshift_node
    name: OpenShift node
    kind: container_orchestrator
    collector: none yet
    loader_keys: [cis_openshift]
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: openshift-hyperkube}
      - {kind: service, match: "machine-config-daemon-*.service", role: supporting}
      - {kind: port, match: 10250}
      - {kind: package, match: openshift-clients, role: client}

  - key: microshift
    name: MicroShift
    kind: container_orchestrator
    collector: none yet
    loader_keys: [cis_openshift]
    privileged: {act: true, map: true, rank: true}
    signals:
      - {kind: package, match: microshift}
      - {kind: service, match: microshift.service}
      - {kind: process, match: microshift}
      - {kind: port, match: 6443}

  - key: openshift_local
    name: OpenShift Local (CRC)
    kind: container_orchestrator
    collector: none yet
    loader_keys: [cis_openshift]
    privileged: {act: true, map: true, rank: true}
    signals:
      - {kind: process, match: crc}
      - {kind: process, match: crcd}

  - key: etcd
    name: etcd
    kind: database
    collector: none yet
    loader_keys: []
    privileged: {act: false, map: true, rank: false}
    signals:
      - {kind: package, match: etcd}
      - {kind: service, match: etcd.service}
      - {kind: container_image, match: "*/etcd:*"}
      - {kind: container_image, match: "*/etcd"}
      - {kind: process, match: etcd, role: supporting}
      - {kind: port, match: 2379}

  # ── Container runtimes ─────────────────────────────────────────────────────
  - key: podman
    name: Podman
    kind: container_runtime
    collector: none yet
    loader_keys: [cis_containers]
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: podman}
      - {kind: service, match: podman.service}
      - {kind: process, match: conmon, role: supporting}

  - key: containerd
    name: containerd
    kind: container_runtime
    collector: none yet
    loader_keys: [cis_containers]
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: containerd}
      - {kind: package, match: containerd.io}
      - {kind: service, match: containerd.service}
      - {kind: process, match: containerd}

  - key: cri_o
    name: CRI-O
    kind: container_runtime
    collector: none yet
    loader_keys: [cis_containers]
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: cri-o}
      - {kind: service, match: crio.service}
      - {kind: process, match: crio}

  - key: docker
    name: Docker Engine
    kind: container_runtime
    collector: none yet
    loader_keys: [cis_docker]
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: docker-ce}
      - {kind: package, match: docker.io}
      - {kind: package, match: moby-engine}
      - {kind: package, match: docker}
      - {kind: service, match: docker.service}
      - {kind: process, match: dockerd}
      - {kind: package, match: docker-ce-cli, role: client}

  # ── Databases ──────────────────────────────────────────────────────────────
  - key: postgresql
    name: PostgreSQL server
    kind: database
    collector: postgresql_host
    loader_keys: [cis_postgresql]
    privileged: {act: false, map: false, rank: false}
    collectors:
      - layer: host
        file: postgresql_host.py
        version: "1.0"
        cost: cheap
        access: >-
          The SSH account already used for fact collection, with privilege escalation to
          read files owned by the database account. Reads the settings in postgresql.conf,
          the rules in pg_hba.conf, and the modes and owners of the data directory and those
          files. Opens no database session, reads no table and no password file. Writes nothing.
      - layer: service
        file: none yet
        cost: cheap
        credential:
          type: AAC PostgreSQL Read-Only
          env: [PGHOST, PGUSER, PGPASSWORD]
        access: >-
          A login role that is a member of pg_read_all_settings only: it can read the
          effective settings and role attributes and no table data. No write privilege.
    signals:
      - {kind: package, match: postgresql-server}
      - {kind: package, match: "postgresql[0-9]*-server"}
      - {kind: package, match: "postgresql-[0-9]*"}
      - {kind: service, match: postgresql.service}
      - {kind: service, match: "postgresql-[0-9]*.service"}
      - {kind: service, match: "postgresql@*.service"}
      - {kind: process, match: postgres}
      - {kind: process, match: postmaster}
      - {kind: container_image, match: "*postgresql-[0-9]*"}
      - {kind: container_image, match: "*/postgres:*"}
      - {kind: port, match: 5432}
      - {kind: package, match: postgresql, role: client}
      - {kind: package, match: "postgresql-client*", role: client}

  - key: mysql_mariadb
    name: MySQL / MariaDB server
    kind: database
    collector: none yet
    loader_keys: [cis_mysql]
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: mysql-server}
      - {kind: package, match: "mysql-server-[0-9]*"}
      - {kind: package, match: mysql-community-server}
      - {kind: package, match: mariadb-server}
      - {kind: service, match: mysqld.service}
      - {kind: service, match: mysql.service}
      - {kind: service, match: mariadb.service}
      - {kind: process, match: mysqld}
      - {kind: process, match: mariadbd}
      - {kind: port, match: 3306}
      - {kind: package, match: mysql, role: client}
      - {kind: package, match: mariadb, role: client}
      - {kind: package, match: mysql-community-client, role: client}
      - {kind: package, match: "mariadb-client*", role: client}
      - {kind: package, match: "mysql-client*", role: client}

  - key: oracle_database
    name: Oracle Database
    kind: database
    collector: none yet
    loader_keys: [cis_oracle]
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: "oracle-database-ee-*"}
      - {kind: package, match: "oracle-database-xe-*"}
      - {kind: package, match: "oracle-database-free-*"}
      - {kind: service, match: "oracle-xe-*.service"}
      - {kind: service, match: "oracle-free-*.service"}
      - {kind: service, match: "oracledb_*.service"}
      - {kind: process, match: tnslsnr}
      - {kind: process, match: "ora_pmon_*"}
      - {kind: package, match: "oracle-database-preinstall-*", role: supporting}
      - {kind: port, match: 1521}
      - {kind: package, match: "oracle-instantclient*", role: client}

  # ── Web servers ────────────────────────────────────────────────────────────
  - key: apache_httpd
    name: Apache HTTP Server
    kind: web_server
    collector: none yet
    loader_keys: [cis_apache]
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: httpd}
      - {kind: package, match: apache2}
      - {kind: service, match: httpd.service}
      - {kind: service, match: apache2.service}
      - {kind: process, match: httpd}
      - {kind: process, match: apache2}
      - {kind: port, match: 80}
      - {kind: port, match: 443}

  - key: nginx
    name: nginx
    kind: web_server
    collector: none yet
    loader_keys: [cis_nginx]
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: nginx}
      - {kind: package, match: nginx-core}
      - {kind: service, match: nginx.service}
      - {kind: process, match: nginx}
      - {kind: port, match: 80}
      - {kind: port, match: 443}

  # ── Remote access ──────────────────────────────────────────────────────────
  - key: openssh_server
    name: OpenSSH server
    kind: remote_access
    collector: aac_facts_collector
    loader_keys: []
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: openssh-server}
      - {kind: service, match: sshd.service}
      - {kind: service, match: ssh.service}
      - {kind: process, match: sshd}
      - {kind: port, match: 22}
      - {kind: package, match: openssh-clients, role: client}
      - {kind: package, match: openssh-client, role: client}

  # ── Identity ───────────────────────────────────────────────────────────────
  - key: freeipa_server
    name: Identity Management (IdM / FreeIPA) server
    kind: identity_server
    collector: none yet
    loader_keys: []
    privileged: {act: true, map: true, rank: true}
    signals:
      - {kind: package, match: ipa-server}
      - {kind: package, match: freeipa-server}
      - {kind: service, match: ipa.service}
      - {kind: service, match: "dirsrv@*.service", role: supporting}
      - {kind: service, match: krb5kdc.service, role: supporting}
      - {kind: port, match: 389}
      - {kind: port, match: 636}
      - {kind: port, match: 88}
      - {kind: package, match: ipa-client, role: client}
      - {kind: package, match: freeipa-client, role: client}

  - key: samba_ad_dc
    name: Samba Active Directory domain controller
    kind: identity_server
    collector: none yet
    loader_keys: []
    privileged: {act: true, map: true, rank: true}
    signals:
      - {kind: package, match: samba-dc}
      - {kind: package, match: samba-ad-dc}
      - {kind: service, match: samba.service}
      - {kind: service, match: samba-ad-dc.service}
      - {kind: port, match: 389}
      - {kind: port, match: 88}
      - {kind: package, match: samba-client, role: client}
      - {kind: package, match: smbclient, role: client}

  # ── Systems management ─────────────────────────────────────────────────────
  - key: satellite
    name: Red Hat Satellite (Foreman / Katello) server
    kind: systems_management
    collector: none yet
    loader_keys: []
    privileged: {act: true, map: true, rank: true}
    signals:
      - {kind: package, match: satellite}
      - {kind: package, match: katello}
      - {kind: package, match: foreman}
      - {kind: service, match: foreman.service}
      - {kind: package, match: satellite-installer, role: supporting}
      - {kind: package, match: katello-host-tools, role: client}
      - {kind: package, match: "katello-ca-consumer-*", role: client}

  - key: satellite_capsule
    name: Red Hat Satellite Capsule (Foreman smart proxy)
    kind: systems_management
    collector: none yet
    loader_keys: []
    privileged: {act: true, map: false, rank: false}
    signals:
      - {kind: package, match: satellite-capsule}
      - {kind: package, match: foreman-proxy}
      - {kind: service, match: foreman-proxy.service}
      - {kind: port, match: 9090}

  # ── Backup ─────────────────────────────────────────────────────────────────
  - key: bacula_director
    name: Bacula Director (backup server)
    kind: backup_server
    collector: none yet
    loader_keys: []
    privileged: {act: true, map: true, rank: true}
    signals:
      - {kind: package, match: bacula-director}
      - {kind: service, match: bacula-dir.service}
      - {kind: service, match: bacula-director.service}
      - {kind: process, match: bacula-dir}
      - {kind: port, match: 9101}

  - key: bacula_client
    name: Bacula File Daemon (backup agent)
    kind: backup_agent
    collector: none yet
    loader_keys: []
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: bacula-client}
      - {kind: package, match: bacula-fd}
      - {kind: service, match: bacula-fd.service}
      - {kind: process, match: bacula-fd}
      - {kind: port, match: 9102}

  - key: bareos_director
    name: Bareos Director (backup server)
    kind: backup_server
    collector: none yet
    loader_keys: []
    privileged: {act: true, map: true, rank: true}
    signals:
      - {kind: package, match: bareos-director}
      - {kind: service, match: bareos-dir.service}
      - {kind: service, match: bareos-director.service}
      - {kind: process, match: bareos-dir}
      - {kind: port, match: 9101}

  - key: bareos_client
    name: Bareos File Daemon (backup agent)
    kind: backup_agent
    collector: none yet
    loader_keys: []
    privileged: {act: false, map: false, rank: false}
    signals:
      - {kind: package, match: bareos-filedaemon}
      - {kind: service, match: bareos-fd.service}
      - {kind: service, match: bareos-filedaemon.service}
      - {kind: process, match: bareos-fd}
      - {kind: port, match: 9102}

  - key: veeam_agent
    name: Veeam Agent for Linux (backup agent)
    kind: backup_agent
    collector: none yet
    loader_keys: []
    privileged: {act: false, map: false, rank: false}
    signals:
