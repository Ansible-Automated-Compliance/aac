---
# Framework catalog — one entry per loadable OPA policy bundle.
#
# The single source of truth for:
#   - seed_framework_catalog.yml  (framework_catalog + customer_frameworks tables)
#   - load_opa_policies.yml       (the default BASELINE: every entry with
#                                  enabled_by_default: true is what a new install
#                                  loads, plus discovery and the customer's choice)
#
# Fields: loader_key, display_name, domain, description, opa_container,
#         policy_dir, tags (list), enabled_by_default, opa_keys (list)
#
# A new install NEVER loads every bundle. Keep enabled_by_default to the small
# set every estate needs; discovery (enroll_discovered_frameworks.yml) and the
# customer add the rest.
framework_catalog_entries:

