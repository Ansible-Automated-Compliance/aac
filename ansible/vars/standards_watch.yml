---
# =============================================================================
# Standards watch list — operational input for standards_update_sweep.yml
#
# Machine-readable companion to the authoritative registry:
#   policies/STANDARDS_UPDATE_REGISTRY.md   (rego library, human-readable)
#
# Each entry: framework key (matches registry row), the version the library
# implements, and a PUBLIC watch URL whose content changing is a signal that
# the upstream may have revised. The sweep is CHANGE DETECTION (content
# hashing), not version parsing — a hit means "a human looks", not "the
# standard changed". Keep URLs to stable, public, non-authenticated pages.
#
# When the registry gains/loses a row, update this list in the same PR.
# =============================================================================

standards_watch:
