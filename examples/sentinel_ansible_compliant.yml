---
# Compliant Ansible Playbook — passes all Sentinel policy checks
# This is the "before" picture that shows what properly written playbooks look like.
#
# Sentinel checks PASS:
#   SENTINEL-ANS-001: Every play has a name ✅
#   SENTINEL-ANS-002: No bare 'all' hosts — uses explicit group 'webservers' ✅
#   SENTINEL-ANS-003: No hardcoded secrets — all credentials via vault ✅
#   SENTINEL-ANS-004: Every task has tags ✅

- name: Deploy Application Stack
  hosts: webservers          # Explicit host group — NOT bare 'all'
  become: true
  gather_facts: true

  vars:
    app_version: "2.1.4"
    db_password: "{{ vault_db_password }}"    # Vault reference — NOT plaintext
    db_host:     "{{ vault_db_host }}"        # Vault reference — NOT hardcoded IP
    api_token:   "{{ vault_api_token }}"      # Vault reference

  tasks:
    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - python3
          - git
        state: present
      tags:
        - install
        - packages

    - name: Configure application
      ansible.builtin.template:
        src: app.conf.j2
        dest: /etc/myapp/app.conf
        mode: "0640"
      tags:
        - configure
        - application

    - name: Start application service
      ansible.builtin.systemd:
        name: myapp
        state: started
        enabled: true
      tags:
        - service
        - application

    - name: Run database migrations
      ansible.builtin.command:
        cmd: "/opt/myapp/bin/migrate --db-host {{ db_host }}"
      tags:
        - migrate
        - database

- name: Configure Monitoring
  hosts: monitoring
  gather_facts: false

  vars:
    grafana_password: "{{ vault_grafana_password }}"    # Vault reference
    alert_email: "ops@example.com"

  tasks:
    - name: Deploy Prometheus config
      ansible.builtin.copy:
        src: prometheus.yml
        dest: /etc/prometheus/prometheus.yml
      tags:
        - monitoring
        - prometheus

    - name: Restart Prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: restarted
      tags:
        - monitoring
        - restart
