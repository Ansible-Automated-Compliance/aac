---
# Example security exception waivers — copy entries into ansible/vars/waivers.yml
# (or supply waiver_entries via extra_vars) and re-run "AAC - Load OPA Policies".
#
# A waiver never hides a finding: it is stored and reported as waived, with the
# justification, approver, and expiry attached. Expired waivers revert to
# active violations automatically.

waiver_entries:
  # One CVE, one host, time-boxed until the vendor patch lands
  - host: "web01.example.com"
    framework: "cis_rhel9"
    control_id: "CVE-2026-12345"
    reason: "Vendor patch scheduled for Q4 maintenance window"
    mitigation: "WAF rule 4411 blocks the vulnerable path"
    evidence_ref: "CR-2188"
    approver: "security-officer@example.com"
    expires: "2026-12-31"

  # One control waived on a single system with a compensating control
  - host: "legacy-app-01.example.com"
    framework: "cis_rhel9"
    control_id: "5.2.1"
    reason: "Root SSH required by legacy backup agent"
    mitigation: "Access restricted to the jump host by firewall policy FW-118"
    evidence_ref: "RISK-0412"
    approver: "ciso@example.com"
    expires: "2027-03-31"

  # Estate-wide waiver for one control across every framework — use sparingly
  - host: "*"
    framework: "*"
    control_id: "1.1.6"
    reason: "Separate /tmp partition deferred to next image release"
    mitigation: "/tmp mounted noexec,nosuid,nodev on the current image"
    evidence_ref: "CR-2201"
    approver: "platform-lead@example.com"
    expires: "2026-11-30"

# Site rules the policy enforces on every entry above. An entry that breaks one
# is refused and its finding stays a violation.
waiver_settings:
  required_fields: [reason, approver, mitigation]
  max_ttl_days: 180
  expiring_within_days: 14
